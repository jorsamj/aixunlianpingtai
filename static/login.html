<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#070a12" />
  <title>登录 · 畅联云算法训练</title>
  <link rel="stylesheet" href="/static/auth.css?v=422601" />
</head>
<body class="auth-page">
  <main class="login-shell">
    <section class="login-visual" aria-hidden="true">
      <div class="login-visual-grid"></div>
      <div class="login-visual-noise"></div>
      <div class="login-orb login-orb-a"></div>
      <div class="login-orb login-orb-b"></div>

      <div class="login-brand-lockup">
        <div class="login-brand-mark">CL</div>
        <div>
          <strong>畅联云算法训练</strong>
          <span>VISION TRAINING STUDIO</span>
        </div>
      </div>

      <div class="login-visual-copy">
        <span class="login-eyebrow"><i></i> AI MODEL LIFECYCLE</span>
        <h1>从素材到模型，<br/><em>从模型到发布。</em></h1>
        <p>统一管理视觉算法的数据、训练、模型转换与畅联云发布链路。</p>
      </div>

      <div class="login-pipeline-card">
        <div class="login-pipeline-head">
          <span>MODEL PIPELINE</span>
          <b><i></i> READY</b>
        </div>
        <div class="login-pipeline">
          <div class="login-pipeline-step"><span>01</span><b>素材</b><small>DATA</small></div>
          <i class="login-pipeline-link"></i>
          <div class="login-pipeline-step"><span>02</span><b>训练</b><small>TRAIN</small></div>
          <i class="login-pipeline-link"></i>
          <div class="login-pipeline-step"><span>03</span><b>转换</b><small>CONVERT</small></div>
          <i class="login-pipeline-link"></i>
          <div class="login-pipeline-step"><span>04</span><b>发布</b><small>PUBLISH</small></div>
        </div>
      </div>

      <div class="login-signal">
        <i></i><span>畅联云统一身份认证</span><b>SECURE ACCESS</b>
      </div>
    </section>

    <section class="login-panel">
      <form class="login-card" id="changlianLoginForm" novalidate>
        <header>
          <div class="login-mobile-mark">CL</div>
          <div class="login-card-badge"><i></i><span>CHANG LIAN CLOUD IDENTITY</span></div>
          <span class="login-kicker">账号登录</span>
          <h2>欢迎回来</h2>
          <p>使用畅联云账号验证身份并进入算法工作台</p>
        </header>

        <label class="login-field">
          <span>用户名</span>
          <input id="loginUsername" name="username" type="text" autocomplete="username" maxlength="128" placeholder="请输入畅联云用户名" required autofocus />
        </label>

        <label class="login-field">
          <span>密码</span>
          <div class="password-field">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="512" placeholder="请输入密码" required />
            <button id="togglePassword" type="button" aria-label="显示或隐藏密码">显示</button>
          </div>
        </label>

        <details class="login-advanced">
          <summary>验证码信息（如畅联云要求）</summary>
          <div class="login-advanced-grid">
            <label class="login-field">
              <span>验证码</span>
              <input id="loginCode" name="code" type="text" autocomplete="off" maxlength="128" placeholder="可选" />
            </label>
            <label class="login-field">
              <span>UUID</span>
              <input id="loginUuid" name="uuid" type="text" autocomplete="off" maxlength="256" placeholder="可选" />
            </label>
          </div>
        </details>

        <div class="login-error hidden" id="loginError" role="alert"></div>
        <button class="login-submit" id="loginSubmit" type="submit">
          <span>登录</span>
          <i aria-hidden="true">→</i>
        </button>

        <footer>
          <span class="login-lock">✓</span>
          <span>账号由畅联云直接校验，本平台不保存您的密码</span>
        </footer>
      </form>
    </section>
  </main>
  <script src="/static/login.js?v=422601"></script>
</body>
</html>
