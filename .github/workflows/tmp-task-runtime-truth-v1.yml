name: Temporary Task Runtime Truth v1

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/tmp_task_runtime_truth_patch.py
      - .github/workflows/tmp-task-runtime-truth-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Task Runtime Truth patch
        run: python scripts/tmp_task_runtime_truth_patch.py
      - name: Install focused Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest pillow
      - name: Compile backend contract
        run: >-
          python -m py_compile
          platform_core/training_job_projection.py
          platform_core/task_runtime/public.py
          app.py
          tests/unit/test_training_job_projection.py
      - name: Backend truth tests
        run: >-
          python -m pytest -q
          tests/unit/test_training_job_projection.py
          tests/unit/task_runtime/test_public_projection.py
      - name: Frontend truth tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/frontend/task-runtime-truth.test.mjs
            tests/frontend/task-poller.test.mjs
            tests/frontend/training-task-runtime.test.mjs
            tests/frontend/phase2-task-truth.test.mjs
          )
          if [[ -f tests/frontend/training-runtime-truth-v2.test.mjs ]]; then
            tests+=(tests/frontend/training-runtime-truth-v2.test.mjs)
          fi
          node --test "${tests[@]}"
      - name: Commit product truth contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app.py \
            platform_core/training_job_projection.py \
            static/modules/task-runtime-truth.js \
            static/modules/task-poller.js \
            static/modules/training-task-runtime.js \
            static/modules/annotation-task-view.js \
            static/modules/material-batches.js \
            tests/unit/test_training_job_projection.py \
            tests/frontend/task-runtime-truth.test.mjs \
            tests/frontend/task-poller.test.mjs \
            tests/frontend/training-task-runtime.test.mjs \
            docs/CODEX_HANDOFF_2026-09-16_TASK_RUNTIME_TRUTH_V1.md
          git commit -m "refactor(tasks): unify frontend backend runtime truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
