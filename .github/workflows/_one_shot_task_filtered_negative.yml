name: One-shot Task Filtered Negative Migration

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - tools/_one_shot_task_filtered_negative.py
      - .github/workflows/_one_shot_task_filtered_negative.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-algorithm-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml filelock requests psutil keyring cryptography
      - name: Apply exact migration
        run: python tools/_one_shot_task_filtered_negative.py
      - name: Compile changed runtime
        run: >-
          python -m py_compile
          platform_core/training_label_tasks.py
          platform_core/snapshots.py
          tests/unit/test_training_label_contract.py
          tests/unit/test_negative_sample_contract.py
      - name: Focused negative and training label contracts
        run: >-
          PYTHONPATH=. pytest -q --confcutdir=tests/unit
          tests/unit/test_training_label_contract.py
          tests/unit/test_negative_sample_contract.py
          tests/unit/test_snapshots.py
          tests/unit/test_portable_dataset.py
      - name: Product contract guards
        shell: bash
        run: |
          grep -Fq 'negative_origin"] = "filtered_by_training_labels"' platform_core/training_label_tasks.py
          grep -Fq 'negative_origin_counts' platform_core/snapshots.py
          grep -Fq 'test_projection_turns_only_unselected_labels_into_task_negative_without_mutating_source' tests/unit/test_training_label_contract.py
          grep -Fq 'test_task_filtered_negative_materializes_as_empty_yolo_label' tests/unit/test_training_label_contract.py
          grep -Fq 'test_snapshot_preserves_task_filtered_negative_origin' tests/unit/test_negative_sample_contract.py
          if grep -Fq '不能通过过滤其他标签制造负样本' platform_core/training_label_tasks.py; then
            echo 'old task-negative rejection remains' >&2
            exit 1
          fi
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit production contract
        shell: bash
        run: |
          git config user.name 'jorsamj'
          git config user.email '50445927+jorsamj@users.noreply.github.com'
          git add \
            platform_core/training_label_tasks.py \
            platform_core/snapshots.py \
            tests/unit/test_training_label_contract.py \
            tests/unit/test_negative_sample_contract.py \
            docs/superpowers/specs/2026-09-11-negative-sample-contract.md \
            docs/PROJECT_HANDOFF_CURRENT.md \
            docs/BUG_AUDIT_2026-09-17.md
          if git diff --cached --quiet; then
            echo 'No production changes to commit'
            exit 0
          fi
          git commit -m 'fix: treat deselected-label images as task negatives'
          git push origin HEAD:feature/external-algorithm-publishing
