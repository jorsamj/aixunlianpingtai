name: Training Task Visibility

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
      - feature/external-algorithm-publishing
    paths:
      - app.py
      - static/index.html
      - static/styles.css
      - static/app.js
      - static/main.mjs
      - static/modules/training-submit.js
      - static/modules/training-task-runtime.js
      - static/modules/training-progress-stream.js
      - static/modules/task-runtime-truth.js
      - static/modules/training-task-visibility-runtime.js
      - static/modules/poll-registry.js
      - static/modules/page-request-scope.js
      - tests/frontend/training-submit.test.mjs
      - tests/frontend/training-task-identity.test.mjs
      - tests/frontend/training-task-runtime.test.mjs
      - tests/frontend/training-progress-stream.test.mjs
      - tests/frontend/training-task-visibility-runtime.test.mjs
      - tests/frontend/poll-registry.test.mjs
      - tests/api/test_training_unified_task_overlay.py
      - tests/api/test_training_job_visibility.py
      - tests/api/test_training_event_stream.py
      - tests/api/test_durable_training_controls.py
      - tests/api/test_training_terminal_runtime.py
      - tests/browser/training-task-performance.spec.mjs
      - .github/workflows/training-task-visibility.yml
  workflow_dispatch:

jobs:
  visibility-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check visibility runtime
        run: >-
          python -m py_compile app.py &&
          node --check static/app.js &&
          node --check static/modules/training-submit.js &&
          node --check static/modules/training-task-runtime.js &&
          node --check static/modules/training-progress-stream.js &&
          node --check static/modules/task-runtime-truth.js &&
          node --check static/modules/training-task-visibility-runtime.js &&
          node --check static/modules/poll-registry.js &&
          node --check static/modules/page-request-scope.js
      - name: Install focused backend test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Unified training job overlay truth
        run: >-
          python -m pytest -q
          tests/api/test_training_unified_task_overlay.py
          tests/api/test_training_job_visibility.py
          tests/api/test_training_event_stream.py
          tests/api/test_durable_training_controls.py
          tests/api/test_training_terminal_runtime.py
      - name: Training visibility and identity focused tests
        run: >-
          node --test
          tests/frontend/training-submit.test.mjs
          tests/frontend/training-task-identity.test.mjs
          tests/frontend/training-task-runtime.test.mjs
          tests/frontend/training-progress-stream.test.mjs
          tests/frontend/training-task-visibility-runtime.test.mjs
          tests/frontend/poll-registry.test.mjs
      - name: Visibility owner and identity wiring guard
        shell: bash
        run: |
          grep -Fq 'training-task-visibility-runtime.js?v=422570' static/index.html
          grep -Fq 'syncTrainingClockTimer' static/modules/poll-registry.js
          grep -Fq 'data-training-clock="elapsed"' static/modules/training-task-runtime.js
          grep -Fq "build: 'training-progress-stream-422500'" static/modules/training-progress-stream.js
          grep -Fq 'setTrainingRealtimeActive' static/modules/poll-registry.js
          grep -Fq 'const detachViewAdapter = runtime.setViewAdapter(viewAdapter);' static/modules/training-task-visibility-runtime.js
          if grep -Fq 'legacyRender' static/modules/training-task-visibility-runtime.js; then
            echo 'canonical training task renderer must not fall back to a legacy render owner' >&2
            exit 1
          fi
          grep -Fq '__trainingTaskVisibilityRuntime' static/modules/training-task-visibility-runtime.js
          grep -Fq 'visibleTrainingJobs' static/modules/training-task-visibility-runtime.js
          grep -Fq 'colspan="10" class="empty-row"' static/modules/training-task-visibility-runtime.js
          grep -Fq "  'success'," static/modules/training-task-visibility-runtime.js
          if grep -Fq 'function visibleJobs(' static/modules/training-task-visibility-runtime.js; then
            echo 'visibility runtime must reuse canonical training queue ordering' >&2
            exit 1
          fi
          if grep -Fq 'runtime.refresh = refreshOwned' static/modules/training-task-visibility-runtime.js; then
            echo 'visibility runtime must not monkey-patch TrainingTaskRuntime.refresh' >&2
            exit 1
          fi
          if grep -Fq 'window.loadRelated =' static/modules/training-task-visibility-runtime.js; then
            echo 'visibility runtime must not recapture broad loadRelated ownership' >&2
            exit 1
          fi
          grep -Fq "'cancel_requested'" static/modules/poll-registry.js
          grep -Fq 'id="tr429TaskId"' static/app.js
          grep -Fq '<label>算法名称</label>' static/app.js
          grep -Fq '<th>所属算法</th><th>训练任务</th><th>状态</th><th>优先级</th><th>进度</th><th>已用时间</th><th>剩余时间</th><th>当前阶段</th><th>开始时间</th><th>操作</th>' static/modules/training-task-visibility-runtime.js
          grep -Fq 'data-training-task-shell="canonical"' static/modules/training-task-visibility-runtime.js
          grep -Fq 'data-training-batch-toggle' static/modules/training-task-visibility-runtime.js
          grep -Fq 'batchAction,' static/modules/training-task-runtime.js
          grep -Fq "trainingBatchActionEligible(job, action)" static/modules/training-task-runtime.js
          if grep -Fq '<th>执行框架</th>' static/modules/training-task-visibility-runtime.js; then
            echo 'canonical training task table must not expose execution framework as a primary column' >&2
            exit 1
          fi
          grep -Fq '状态切换中' static/modules/training-task-runtime.js
          grep -Fq "if (status === 'PAUSING') return 'pausing';" static/modules/task-runtime-truth.js
          grep -Fq "if (status === 'RESUMING') return 'resuming';" static/modules/task-runtime-truth.js
          grep -Fq "if (status === 'STOPPING') return 'stopping';" static/modules/task-runtime-truth.js
          grep -Fq "if (status === 'CANCEL_REQUESTED') return 'cancel_requested';" static/modules/task-runtime-truth.js
          grep -Fq "window.showTrainLog423 = taskId => openDetail(taskId, {focus: 'log'});" static/modules/training-recovery-runtime.js
          grep -Fq 'window.TrainingRecoveryRuntime?.acceptLiveTask?.(next);' static/modules/training-progress-stream.js
          grep -Fq 'training_stats=_training_success_rate_stats(jobs)' app.py
          grep -Fq 'ended_statuses = success_statuses | {"failed", "stopped", "cancelled", "canceled"}' app.py
          grep -Fq 'test_training_success_rate_uses_all_ended_jobs_without_calling_cancellations_failures' tests/api/test_training_terminal_runtime.py
          grep -Fq '暂无已结束训练可统计' static/app.js
          grep -Fq 'payload.task_id = plannedTaskId' static/modules/training-submit.js
          grep -Fq 'durable_active = durable is not None and durable.status in {' app.py
          grep -Fq 'v48_stop_job(project_id, job_id)' app.py
          grep -Fq 'test_direct_delete_cancels_durable_training_before_hiding_job' tests/api/test_durable_training_controls.py
          grep -Fq 'queued_like = legacy_status in {"queued", "waiting", "pending"}' app.py
          grep -Fq 'test_legacy_waiting_and_pending_stop_as_never_started_without_version_archive' tests/api/test_durable_training_controls.py
          grep -Fq 'test_legacy_terminal_stop_fails_closed_without_version_archive' tests/api/test_durable_training_controls.py
          grep -Fq '远程训练停止失败，本地状态保持不变' app.py
          grep -Fq 'test_legacy_remote_training_stop_fails_closed_when_remote_rejects' tests/api/test_durable_training_controls.py
          grep -Fq 'test_legacy_remote_training_stop_commits_local_state_only_after_remote_ack' tests/api/test_durable_training_controls.py
          grep -Fq 'test_success_aliases_are_terminal_and_attempt_version_archive' tests/api/test_training_terminal_runtime.py
          grep -Fq 'successful_terminal_statuses = {"done", "finished", "completed", "succeeded", "success"}' app.py
          grep -Fq 'ended_terminal_statuses = successful_terminal_statuses | {"failed", "stopped", "cancelled", "canceled"}' app.py
          grep -Fq 'test_cancel_aliases_freeze_elapsed_without_fabricating_success_progress' tests/api/test_training_terminal_runtime.py
          grep -Fq '"SUCCESS", "PARTIAL_SUCCESS"' app.py
          grep -Fq 'task_id: Optional[str] = None' app.py
          grep -Fq 'dataset_revision_id' app.py
          grep -Fq "const rows=[['所属算法',job.asset_algorithm_name||job.algorithm_name||job.asset_algorithm_id||'-'],['训练任务',job.id],['数据版本',job.dataset_revision_id" static/app.js
          grep -Fq "['训练快照',job.snapshot_id" static/app.js
          grep -Fq 'train_[0-9a-f]{16,32}' app.py
          if grep -Fq 'setInterval(' static/modules/training-task-visibility-runtime.js; then
            echo 'visibility runtime must not create a second polling owner' >&2
            exit 1
          fi
          if grep -Fq 'setTimeout(' static/modules/training-task-visibility-runtime.js; then
            echo 'visibility runtime must not use delayed DOM reinsertion' >&2
            exit 1
          fi
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check


  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome training revision truth
        run: npx playwright test tests/browser/training-task-performance.spec.mjs
