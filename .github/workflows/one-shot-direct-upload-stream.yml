name: One-shot Direct Upload Stream Optimization

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/one-shot-direct-upload-stream.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact direct-stream migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          marker = 'def add_image_record('
          start = text.index(marker)
          helper = '\n'.join([
              'class _NonClosingImageStream:',
              '    """Let Pillow inspect a caller-owned stream without closing it."""',
              '    def __init__(self, stream):',
              '        self._stream = stream',
              '',
              '    def read(self, *args, **kwargs):',
              '        return self._stream.read(*args, **kwargs)',
              '',
              '    def seek(self, *args, **kwargs):',
              '        return self._stream.seek(*args, **kwargs)',
              '',
              '    def tell(self):',
              '        return self._stream.tell()',
              '',
              '    def readline(self, *args, **kwargs):',
              '        return self._stream.readline(*args, **kwargs)',
              '',
              '    def close(self):',
              '        return None',
              '',
              '    def __getattr__(self, name):',
              '        return getattr(self._stream, name)',
              '',
              '',
          ])
          if 'class _NonClosingImageStream:' in text:
              raise SystemExit('direct-stream helper already exists unexpectedly')
          text = text[:start] + helper + text[start:]

          start = text.index(marker)
          end = text.index('\ndef zip_dir(', start)
          body = text[start:end]

          body, count = re.subn(
              r'project_id: str, src: Path, original_name: str,',
              'project_id: str, src: Any, original_name: str,',
              body,
              count=1,
          )
          if count != 1:
              raise SystemExit('add_image_record source type contract changed')

          body, count = re.subn(
              r'(?m)^    ext = src\.suffix\.lower\(\)$',
              '    path_source = isinstance(src, (str, Path))\n'
              '    ext = (Path(src).suffix if path_source else Path(original_name).suffix).lower()',
              body,
              count=1,
          )
          if count != 1:
              raise SystemExit('add_image_record extension contract changed')

          info_pattern = re.compile(
              r'(?m)^    try:\n'
              r'        info = image_info\(src\)\n'
              r'    except Exception:\n'
              r'        return None\n'
          )
          info_replacement = '\n'.join([
              '    try:',
              '        if path_source:',
              '            info = image_info(Path(src))',
              '        else:',
              '            src.seek(0)',
              '            image = Image.open(_NonClosingImageStream(src))',
              '            try:',
              '                info = {"width": image.width, "height": image.height}',
              '            finally:',
              '                image.close()',
              '            src.seek(0)',
              '    except Exception:',
              '        try:',
              '            if not path_source:',
              '                src.seek(0)',
              '        except Exception:',
              '            pass',
              '        return None',
              '',
          ])
          body, count = info_pattern.subn(info_replacement, body, count=1)
          if count != 1:
              raise SystemExit('image info contract changed')

          hash_pattern = re.compile(
              r'(?m)^    content_hash = str\(content_sha256 or metadata\.sha256 or ""\)\.strip\(\)\.lower\(\)\n'
              r'    if not content_hash:\n'
              r'        content_hash = sha256_file\(src\)\n'
          )
          hash_replacement = '\n'.join([
              '    content_hash = str(content_sha256 or metadata.sha256 or "").strip().lower()',
              '    if not content_hash:',
              '        if path_source:',
              '            content_hash = sha256_file(Path(src))',
              '        else:',
              '            src.seek(0)',
              '            digest = hashlib.sha256()',
              '            for chunk in iter(lambda: src.read(1024 * 1024), b""):',
              '                digest.update(chunk)',
              '            content_hash = digest.hexdigest()',
              '            src.seek(0)',
              '',
          ])
          body, count = hash_pattern.subn(hash_replacement, body, count=1)
          if count != 1:
              raise SystemExit('content hash contract changed')

          text = text[:start] + body + text[end:]

          upload_start = text.index('@app.post("/api/projects/{project_id}/images")')
          upload_end = text.index('\n\n_ANNOTATION_INDEX_LOCK', upload_start)
          upload = text[upload_start:upload_end]
          loop_start = upload.index('        # Stream each multipart file to disk so memory stays bounded.')
          loop_end = upload.index('        committed = _v50_end_image_batch(save=True)', loop_start)
          replacement = '\n'.join([
              '        # Starlette already owns a seekable/spooled UploadFile. Send that stream',
              '        # directly to StorageManager instead of writing imports/upload_* and then',
              '        # copying the same bytes into the final object a second time.',
              '        for file in files:',
              '            filename = safe_filename(file.filename or "image.jpg")',
              '            ext = Path(filename).suffix.lower()',
              '            if ext not in IMAGE_EXTS:',
              '                failed.append({"name": filename, "reason": "不支持的图片格式"})',
              '                continue',
              '            try:',
              '                await file.seek(0)',
              '                stream = file.file',
              '                stream.seek(0, os.SEEK_END)',
              '                size_bytes = stream.tell()',
              '                stream.seek(0)',
              '                if size_bytes <= 0:',
              '                    failed.append({"name": filename, "reason": "文件为空"})',
              '                    continue',
              '                record = add_image_record(',
              '                    project_id,',
              '                    stream,',
              '                    filename,',
              '                    "raw",',
              '                    dataset_id,',
              '                    storage_source_id,',
              '                )',
              '                if record:',
              '                    uploaded.append(record)',
              '                else:',
              '                    failed.append({"name": filename, "reason": "图片损坏或无法识别"})',
              '            except StorageError as error:',
              '                failed.append({"name": filename, "reason": f"{error.message}：{error.detail}"})',
              '            except Exception as error:',
              '                failed.append({"name": filename, "reason": str(error)})',
              '',
          ])
          upload = upload[:loop_start] + replacement + upload[loop_end:]
          text = text[:upload_start] + upload + text[upload_end:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/api/test_upload_batch_performance_truth.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'from pathlib import Path\n' not in tests:
              if tests.count('import io\n') != 1:
                  raise SystemExit('upload test import anchor changed')
              tests = tests.replace('import io\n', 'import io\nfrom pathlib import Path\n', 1)

          setup_anchor = '    original_storage_manager = app_module.storage_manager\n    storage_manager_calls = 0\n'
          if 'direct_stream_sources = []' not in tests:
              if tests.count(setup_anchor) != 1:
                  raise SystemExit('upload test setup anchor changed')
              setup_extra = '\n'.join([
                  '    original_add_image_record = app_module.add_image_record',
                  '    direct_stream_sources = []',
                  '',
                  '    def tracked_add_image_record(project_id, source, *args, **kwargs):',
                  '        direct_stream_sources.append(not isinstance(source, (str, Path)))',
                  '        return original_add_image_record(project_id, source, *args, **kwargs)',
                  '',
                  '    monkeypatch.setattr(app_module, "add_image_record", tracked_add_image_record)',
                  '',
              ])
              tests = tests.replace(setup_anchor, setup_anchor + setup_extra, 1)

          assertion_anchor = '    assert storage_manager_calls == 1\n'
          if 'assert direct_stream_sources == [True] * 12' not in tests:
              if tests.count(assertion_anchor) != 1:
                  raise SystemExit('upload test assertion anchor changed')
              tests = tests.replace(
                  assertion_anchor,
                  assertion_anchor + '    assert direct_stream_sources == [True] * 12\n',
                  1,
              )
          tests = tests.replace(
              '    assert body["uploaded_count"] == 12\n',
              '    assert body["uploaded_count"] == 12, body\n',
              1,
          )
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Compile changed runtime
        run: python -m py_compile app.py tests/api/test_upload_batch_performance_truth.py
      - name: Verify direct stream and existing upload-clean flow
        run: >-
          python -m pytest -q
          tests/api/test_upload_batch_performance_truth.py
          tests/api/test_upload_clean_flow.py
          tests/unit/test_material_upload_cleaning_performance.py
      - name: Permanent invariants before commit
        shell: bash
        run: |
          grep -Fq 'class _NonClosingImageStream:' app.py
          grep -Fq 'path_source = isinstance(src, (str, Path))' app.py
          grep -Fq 'Image.open(_NonClosingImageStream(src))' app.py
          grep -Fq 'await file.seek(0)' app.py
          grep -Fq 'stream = file.file' app.py
          if grep -Fq 'p / "imports" / f"upload_' app.py; then
            echo 'plain upload still writes a second app-level temp copy'
            exit 1
          fi
          grep -Fq 'assert direct_stream_sources == [True] * 12' tests/api/test_upload_batch_performance_truth.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tests/api/test_upload_batch_performance_truth.py
          git commit -m 'perf(materials): stream plain uploads directly to storage'
          git push origin HEAD:refactor/frontend-runtime-stabilization
