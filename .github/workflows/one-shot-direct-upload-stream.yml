name: One-shot Direct Upload Stream Optimization

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/one-shot-direct-upload-stream.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact direct-stream migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def add_image_record(')
          end = text.index('\ndef zip_dir(', start)
          body = text[start:end]

          old_sig = '''def add_image_record(
              project_id: str, src: Path, original_name: str,
              source_type: str = "raw", dataset_id: str = "default",
              storage_source_id: str = "default_local", annotation_builder=None,
              content_sha256: Optional[str] = None,
          ) -> Optional[Dict[str, Any]]:
              p = project_dir(project_id)
              ext = src.suffix.lower()
          '''
          new_sig = '''def add_image_record(
              project_id: str, src: Any, original_name: str,
              source_type: str = "raw", dataset_id: str = "default",
              storage_source_id: str = "default_local", annotation_builder=None,
              content_sha256: Optional[str] = None,
          ) -> Optional[Dict[str, Any]]:
              p = project_dir(project_id)
              path_source = isinstance(src, (str, Path))
              ext = (Path(src).suffix if path_source else Path(original_name).suffix).lower()
          '''
          if body.count(old_sig) != 1:
              raise SystemExit('add_image_record signature/path contract changed')
          body = body.replace(old_sig, new_sig, 1)

          old_info = '''    try:
              info = image_info(src)
          except Exception:
              return None
          '''
          new_info = '''    try:
              if path_source:
                  info = image_info(Path(src))
              else:
                  src.seek(0)
                  image = Image.open(src)
                  try:
                      info = {"width": image.width, "height": image.height}
                  finally:
                      image.close()
                  src.seek(0)
          except Exception:
              try:
                  if not path_source:
                      src.seek(0)
              except Exception:
                  pass
              return None
          '''
          if body.count(old_info) != 1:
              raise SystemExit('image info contract changed')
          body = body.replace(old_info, new_info, 1)

          old_hash = '''    content_hash = str(content_sha256 or metadata.sha256 or "").strip().lower()
              if not content_hash:
                  content_hash = sha256_file(src)
          '''
          new_hash = '''    content_hash = str(content_sha256 or metadata.sha256 or "").strip().lower()
              if not content_hash:
                  if path_source:
                      content_hash = sha256_file(Path(src))
                  else:
                      src.seek(0)
                      digest = hashlib.sha256()
                      for chunk in iter(lambda: src.read(1024 * 1024), b""):
                          digest.update(chunk)
                      content_hash = digest.hexdigest()
                      src.seek(0)
          '''
          if body.count(old_hash) != 1:
              raise SystemExit('content hash contract changed')
          body = body.replace(old_hash, new_hash, 1)
          text = text[:start] + body + text[end:]

          upload_start = text.index('@app.post("/api/projects/{project_id}/images")')
          upload_end = text.index('\n\n_ANNOTATION_INDEX_LOCK', upload_start)
          upload = text[upload_start:upload_end]
          old_loop = '''        # Stream each multipart file to disk so memory stays bounded. The
                  # same pass also computes SHA256, avoiding a later full source reread.
                  for file in files:
                      filename = safe_filename(file.filename or "image.jpg")
                      ext = Path(filename).suffix.lower()
                      if ext not in IMAGE_EXTS:
                          failed.append({"name": filename, "reason": "不支持的图片格式"})
                          continue
                      tmp = p / "imports" / f"upload_{uuid.uuid4().hex}{ext}"
                      upload_digest = hashlib.sha256()
                      try:
                          with tmp.open("wb") as out:
                              while True:
                                  chunk = await file.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  upload_digest.update(chunk)
                                  out.write(chunk)
                          if not tmp.exists() or tmp.stat().st_size <= 0:
                              failed.append({"name": filename, "reason": "文件为空"})
                              continue
                          record = add_image_record(
                              project_id,
                              tmp,
                              filename,
                              "raw",
                              dataset_id,
                              storage_source_id,
                              content_sha256=upload_digest.hexdigest(),
                          )
                          if record:
                              uploaded.append(record)
                          else:
                              failed.append({"name": filename, "reason": "图片损坏或无法识别"})
                      except StorageError as error:
                          failed.append({"name": filename, "reason": f"{error.message}：{error.detail}"})
                      except Exception as error:
                          failed.append({"name": filename, "reason": str(error)})
                      finally:
                          tmp.unlink(missing_ok=True)
          '''
          new_loop = '''        # Starlette already owns a seekable/spooled UploadFile. Send that stream
                  # directly to StorageManager instead of writing imports/upload_* and then
                  # copying the same bytes into the final object a second time.
                  for file in files:
                      filename = safe_filename(file.filename or "image.jpg")
                      ext = Path(filename).suffix.lower()
                      if ext not in IMAGE_EXTS:
                          failed.append({"name": filename, "reason": "不支持的图片格式"})
                          continue
                      try:
                          await file.seek(0)
                          stream = file.file
                          stream.seek(0, os.SEEK_END)
                          size_bytes = stream.tell()
                          stream.seek(0)
                          if size_bytes <= 0:
                              failed.append({"name": filename, "reason": "文件为空"})
                              continue
                          record = add_image_record(
                              project_id,
                              stream,
                              filename,
                              "raw",
                              dataset_id,
                              storage_source_id,
                          )
                          if record:
                              uploaded.append(record)
                          else:
                              failed.append({"name": filename, "reason": "图片损坏或无法识别"})
                      except StorageError as error:
                          failed.append({"name": filename, "reason": f"{error.message}：{error.detail}"})
                      except Exception as error:
                          failed.append({"name": filename, "reason": str(error)})
          '''
          if upload.count(old_loop) != 1:
              raise SystemExit('plain upload tempfile loop contract changed')
          upload = upload.replace(old_loop, new_loop, 1)
          upload = upload.replace('    p = project_dir(project_id)\n', '', 1)
          text = text[:upload_start] + upload + text[upload_end:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/api/test_upload_batch_performance_truth.py')
          tests = test_path.read_text(encoding='utf-8')
          import_anchor = 'from PIL import Image\n'
          if tests.count(import_anchor) != 1:
              raise SystemExit('upload test import anchor changed')
          tests = tests.replace(import_anchor, import_anchor + 'from pathlib import Path\n', 1)

          setup_anchor = '''    original_storage_manager = app_module.storage_manager
              storage_manager_calls = 0
          '''
          setup_extra = '''    original_add_image_record = app_module.add_image_record
              direct_stream_sources = []

              def tracked_add_image_record(project_id, source, *args, **kwargs):
                  direct_stream_sources.append(not isinstance(source, (str, Path)))
                  return original_add_image_record(project_id, source, *args, **kwargs)

              monkeypatch.setattr(app_module, "add_image_record", tracked_add_image_record)
          '''
          if tests.count(setup_anchor) != 1:
              raise SystemExit('upload test setup contract changed')
          tests = tests.replace(setup_anchor, setup_anchor + setup_extra, 1)

          assert_anchor = '''    assert storage_manager_calls == 1
              assert all(item.get("annotation_summary_at") for item in body["uploaded"])
          '''
          assert_extra = '''    assert direct_stream_sources == [True] * 12
          '''
          if tests.count(assert_anchor) != 1:
              raise SystemExit('upload test assertion contract changed')
          tests = tests.replace(assert_anchor, '    assert storage_manager_calls == 1\n' + assert_extra + '    assert all(item.get("annotation_summary_at") for item in body["uploaded"])\n', 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Compile changed runtime
        run: python -m py_compile app.py tests/api/test_upload_batch_performance_truth.py
      - name: Verify direct stream and existing upload-clean flow
        run: >-
          python -m pytest -q
          tests/api/test_upload_batch_performance_truth.py
          tests/api/test_upload_clean_flow.py
          tests/unit/test_material_upload_cleaning_performance.py
      - name: Permanent invariants before commit
        shell: bash
        run: |
          grep -Fq 'path_source = isinstance(src, (str, Path))' app.py
          grep -Fq 'await file.seek(0)' app.py
          grep -Fq 'stream = file.file' app.py
          if grep -Fq 'p / "imports" / f"upload_' app.py; then
            echo 'plain upload still writes a second app-level temp copy'
            exit 1
          fi
          grep -Fq 'assert direct_stream_sources == [True] * 12' tests/api/test_upload_batch_performance_truth.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tests/api/test_upload_batch_performance_truth.py
          git commit -m 'perf(materials): stream plain uploads directly to storage'
          git push origin HEAD:refactor/frontend-runtime-stabilization
