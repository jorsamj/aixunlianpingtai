name: v42.25 frontend deploy check

on:
  push:
    branches:
      - refactor/v42.25-runtime
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend runtime
        run: >-
          node --check static/main.mjs &&
          node --check static/modules/training-labels.js &&
          node --check static/modules/navigation-stability.js &&
          node --test tests/frontend/training-labels.test.mjs tests/frontend/navigation-stability.test.mjs
