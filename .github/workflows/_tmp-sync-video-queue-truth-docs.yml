name: Temporary Video Queue Truth Authority Sync

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-sync-video-queue-truth-docs.yml
      - scripts/_tmp_sync_video_queue_truth_docs.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply authority doc sync
        run: python scripts/_tmp_sync_video_queue_truth_docs.py
      - name: Verify closure markers and release boundary
        shell: bash
        run: |
          for file in \
            docs/TECH_DEBT_CLOSURE_V42_25.md \
            docs/CODEX_CURRENT_STATE.md \
            docs/frontend-legacy-audit.md \
            docs/FRONTEND_OWNER_MAP_V42_25.md; do
            grep -Fq '## Product closure — Video resource queue truth CLOSED' "$file"
            grep -Fq 'cb81ca39016aea0fc53ed52090f0b0199d39109a' "$file"
          done
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq 'NEXT: horizontal queue-position/progress truth audit across cleaning, storage import and deployment test' docs/CODEX_CURRENT_STATE.md
      - name: Commit authority docs and remove sync assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-sync-video-queue-truth-docs.yml scripts/_tmp_sync_video_queue_truth_docs.py
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git commit -m "docs: close video resource queue truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
