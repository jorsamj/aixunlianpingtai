name: Sync ZIP 10k Closed Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_zip10k_closed_handoff.py
      - .github/workflows/sync-zip10k-closed-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize authority docs
        run: python tools/sync_zip10k_closed_handoff.py
      - name: Verify authority docs and release boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('AGENTS.md'),
              Path('docs/TECH_DEBT_CLOSURE_V42_25.md'),
              Path('docs/CODEX_CURRENT_STATE.md'),
              Path('docs/frontend-legacy-audit.md'),
              Path('docs/FRONTEND_OWNER_MAP_V42_25.md'),
          ]
          required = [
              '60305921402204e77b8e7ed4ec8e576d9f857c4b',
              'b4875ada5ff084fd4e21d7c5f026f5b09128033b',
              '34731027723',
              '1,370,177 bytes',
              '10,000 image members',
              '33/33 PASS (53.9s)',
              '34733035761',
              'ZIP 10k processing-phase scalability audit',
              '42.25.95',
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              for value in required:
                  assert value in text, (path, value)
          PY
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit synchronized handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git diff --cached --check
          git commit -m "docs: close ZIP 10k import scalability handoff"
          git push origin HEAD:refactor/frontend-runtime-stabilization
