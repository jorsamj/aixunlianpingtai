name: Temporary Deployment Queue Truth Migration

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-patch-deployment-queue-truth.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Apply exact deployment truth patch
        run: python .github/scripts/_tmp_patch_deployment_queue_truth.py
      - name: Syntax guard
        run: |
          python -m py_compile app.py
          node --check static/app.js
          node --check static/main.mjs
          node --check static/modules/deployment-tests.js
      - name: Focused deployment API contracts
        run: python -m pytest -q tests/api/test_deployment_test_runtime.py tests/api/test_unified_task_runtime.py
      - name: Focused deployment frontend contracts
        run: node --test tests/frontend/deployment-runtime-source.test.mjs tests/frontend/deployment-task-view.test.mjs
      - name: Related durable runtime regressions
        run: python -m pytest -q tests/unit/task_runtime/test_public_projection.py tests/unit/test_deployment_inference_process_fencing.py
      - name: Full frontend unit regression
        run: node --test tests/frontend/*.test.mjs
      - name: Product wiring guard
        run: |
          grep -q 'truth = task_to_public(task, repository)' app.py
          grep -q 'PlatformCore?.deployment?.deploymentTaskView' static/app.js
          grep -q 'PlatformCore?.taskPoller?.isTaskActive' static/app.js
          grep -q '/api/v62/projects/${pid()}/tasks/${taskId}' static/app.js
          if grep -Fq "['QUEUED','RUNNING','CANCEL_REQUESTED'].includes(task.status)" static/app.js; then
            echo 'legacy deployment active-state loop remains'
            exit 1
          fi
          test "$(cat VERSION.txt)" = '42.24.0'
      - name: Commit product files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/app.js static/index.html static/main.mjs static/modules/deployment-tests.js tests/frontend/deployment-task-view.test.mjs
          git diff --cached --check
          git commit -m "fix(deployment): preserve durable queue and progress truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
