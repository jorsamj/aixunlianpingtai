name: Prune Unreachable TrainingLabel 423 425 Binds

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/prune_unreachable_training_label_425_binds.py
      - .github/workflows/prune-unreachable-training-label-425-binds.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded historical-bind retirement
        run: python tools/prune_unreachable_training_label_425_binds.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: >-
          node --check static/modules/training-labels.js &&
          node --check static/main.mjs &&
          node --check tests/frontend/training-labels.test.mjs
      - name: Assert historical binds are gone
        run: |
          for token in startAlgorithmTraining423 openTrain425 trainCounts425; do
            if grep -n "wrap('$token'" static/modules/training-labels.js; then
              echo "$token remains wrapped by TrainingLabelRuntime" >&2
              exit 1
            fi
          done
      - name: Run focused training-label tests
        run: >-
          node --test
          tests/frontend/training-labels.test.mjs
          tests/frontend/training-draft-runtime.test.mjs
          tests/frontend/training-submit.test.mjs
      - name: Commit retirement
        run: |
          if git diff --quiet -- static/modules/training-labels.js static/main.mjs static/index.html tests/frontend/training-labels.test.mjs; then
            echo 'No retirement change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/modules/training-labels.js static/main.mjs static/index.html tests/frontend/training-labels.test.mjs
          git commit -m 'refactor(ui): retire unreachable TrainingLabel 423 425 binds'
          git push origin HEAD:refactor/frontend-runtime-stabilization
