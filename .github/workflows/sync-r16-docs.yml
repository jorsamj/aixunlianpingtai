name: Sync R16 Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r16_docs.py
      - .github/workflows/sync-r16-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize R16 handoff ledgers
        run: python tools/sync_r16_docs.py
      - name: Validate docs and formal version
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
          python - <<'PY'
          from pathlib import Path
          for p in [
              'docs/CODEX_CURRENT_STATE.md',
              'docs/frontend-legacy-audit.md',
              'docs/FRONTEND_OWNER_MAP_V42_25.md',
              'docs/TECH_DEBT_CLOSURE_V42_25.md',
          ]:
              text=Path(p).read_text(encoding='utf-8')
              assert '34668702371' in text, p
              assert '540c0944f45030ea198af2be153c1505f71e62f0' in text, p
              assert '19/19' in text, p
              assert '<<<<<<<' not in text and '>>>>>>>' not in text, p
          PY
      - name: Commit R16 ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md
          git diff --cached --quiet && { echo 'No docs changes'; exit 1; }
          git commit -m 'docs(ui): close R16 lifecycle debt'
          git push origin HEAD:refactor/frontend-runtime-stabilization
