name: Temporary Training JPEG Normalization Fix

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply controlled P0 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          POLICY = "ultralytics_jpeg_repair_v1"

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch anchor missing in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path, marker, addition):
              path = Path(path)
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  return
              path.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          # training_tasks.py: deterministic trainer-input normalization + dual source/training identity.
          replace_once(
              "platform_core/training_tasks.py",
              "import yaml\n\nfrom .annotations import atomic_write_json",
              "import yaml\nfrom PIL import Image, ImageOps, UnidentifiedImageError\n\nfrom .annotations import atomic_write_json",
          )
          replace_once(
              "platform_core/training_tasks.py",
              "TRAINING_COMPLETION_GRACE_SECONDS = 5.0\n_SUCCESSFUL_TRAINING_OUTCOMES = {",
              f'TRAINING_COMPLETION_GRACE_SECONDS = 5.0\nTRAINING_INPUT_POLICY = "{POLICY}"\n_JPEG_SUFFIXES = {{".jpg", ".jpeg", ".jpe", ".jfif"}}\n_SUCCESSFUL_TRAINING_OUTCOMES = {{',
          )
          normalize_function = r'''
          def _normalize_training_image(
              destination: Path,
              source_content_sha256: str,
              source_size_bytes: int,
          ) -> dict[str, Any]:
              """Normalize only the task-local trainer input; never rewrite the source material."""
              identity = {
                  "source_content_sha256": str(source_content_sha256),
                  "source_size_bytes": int(source_size_bytes),
                  "training_content_sha256": str(source_content_sha256),
                  "training_size_bytes": int(source_size_bytes),
                  "training_input_policy": TRAINING_INPUT_POLICY,
                  "normalized": False,
                  "normalization_reason": None,
              }
              if destination.suffix.lower() not in _JPEG_SUFFIXES:
                  return identity
              current_size = destination.stat().st_size
              if current_size < 2:
                  raise ValueError(
                      f"TRAINING_IMAGE_INVALID: filename={destination.name}; "
                      "reason=jpeg_too_small"
                  )
              with destination.open("rb") as stream:
                  stream.seek(-2, os.SEEK_END)
                  if stream.read(2) == b"\xff\xd9":
                      return identity

              temporary = destination.with_name(
                  f".{destination.name}.{uuid.uuid4().hex}.normalize.tmp"
              )
              try:
                  try:
                      with Image.open(destination) as image:
                          repaired = ImageOps.exif_transpose(image)
                          try:
                              repaired.save(
                                  temporary,
                                  format="JPEG",
                                  subsampling=0,
                                  quality=100,
                              )
                          finally:
                              if repaired is not image:
                                  repaired.close()
                  except (OSError, UnidentifiedImageError) as error:
                      raise ValueError(
                          f"TRAINING_IMAGE_INVALID: filename={destination.name}; "
                          f"reason=jpeg_missing_eoi_repair_failed; detail={error}"
                      ) from error
                  if not temporary.is_file() or temporary.stat().st_size <= 0:
                      raise ValueError(
                          f"TRAINING_IMAGE_INVALID: filename={destination.name}; "
                          "reason=jpeg_repair_empty_output"
                      )
                  with temporary.open("rb") as stream:
                      stream.seek(-2, os.SEEK_END)
                      if stream.read(2) != b"\xff\xd9":
                          raise ValueError(
                              f"TRAINING_IMAGE_INVALID: filename={destination.name}; "
                              "reason=jpeg_repair_missing_eoi"
                          )
                  os.replace(temporary, destination)
              finally:
                  temporary.unlink(missing_ok=True)

              identity.update(
                  training_content_sha256=_sha256(destination),
                  training_size_bytes=destination.stat().st_size,
                  normalized=True,
                  normalization_reason="jpeg_missing_eoi",
              )
              return identity
          '''
          replace_once(
              "platform_core/training_tasks.py",
              "\n\ndef _process_is_running(process_id: int) -> bool:",
              "\n\n" + normalize_function.strip("\n") + "\n\ndef _process_is_running(process_id: int) -> bool:",
          )
          replace_once(
              "platform_core/training_tasks.py",
              "    remaining_bytes = total_size_bytes\n    total_items = len(planned)\n",
              "    remaining_bytes = total_size_bytes\n    training_total_size_bytes = 0\n    total_items = len(planned)\n",
          )
          replace_once(
              "platform_core/training_tasks.py",
              "        _copy_verified_isolated(\n            source_path, destination, expected_hash, bundle_root=root, durable=False\n        )\n        remaining_bytes -= size_bytes\n        lines = []\n",
              "        _copy_verified_isolated(\n            source_path, destination, expected_hash, bundle_root=root, durable=False\n        )\n        image_identity = _normalize_training_image(\n            destination, expected_hash, size_bytes\n        )\n        training_hash = str(image_identity[\"training_content_sha256\"])\n        training_size_bytes = int(image_identity[\"training_size_bytes\"])\n        training_total_size_bytes += training_size_bytes\n        remaining_bytes -= size_bytes\n        lines = []\n",
          )
          replace_once(
              "platform_core/training_tasks.py",
              '                "content_sha256": expected_hash,\n                "size_bytes": size_bytes,\n                "label_sha256": _sha256(label_path),\n',
              '                "source_content_sha256": expected_hash,\n                "source_size_bytes": size_bytes,\n                "content_sha256": training_hash,\n                "size_bytes": training_size_bytes,\n                "training_input_policy": TRAINING_INPUT_POLICY,\n                "normalized": bool(image_identity["normalized"]),\n                "normalization_reason": image_identity["normalization_reason"],\n                "label_sha256": _sha256(label_path),\n',
          )
          replace_once(
              "platform_core/training_tasks.py",
              '        "schema_version": 2,\n        "snapshot_id": str(snapshot.get("snapshot_id") or ""),\n',
              '        "schema_version": 3,\n        "snapshot_id": str(snapshot.get("snapshot_id") or ""),\n        "training_input_policy": TRAINING_INPUT_POLICY,\n',
          )
          replace_once(
              "platform_core/training_tasks.py",
              '        "total_size_bytes": total_size_bytes,\n',
              '        "total_size_bytes": training_total_size_bytes,\n',
          )
          replace_once(
              "platform_core/training_tasks.py",
              '            "image_integrity": "sha256_verified_during_materialization",\n',
              '            "image_integrity": "source_sha256_verified_then_training_input_normalized",\n            "training_input_policy": TRAINING_INPUT_POLICY,\n',
          )
          replace_once(
              "platform_core/training_tasks.py",
              '            if not image_path.is_file() or _sha256(image_path) != str(member.get("content_sha256") or ""):\n                raise ValueError(f"portable image SHA256 mismatch: {member.get(\'image_id\')}")\n',
              '            expected_training_sha = str(member.get("content_sha256") or "")\n            actual_training_sha = _sha256(image_path) if image_path.is_file() else ""\n            if not image_path.is_file() or actual_training_sha != expected_training_sha:\n                raise ValueError(\n                    "TRAINING_BUNDLE_IMAGE_MUTATED: portable image SHA256 mismatch; "\n                    f"image_id={member.get(\'image_id\')}; "\n                    f"expected_training_sha256={expected_training_sha or \'<missing>\'}; "\n                    f"actual_sha256={actual_training_sha or \'<missing>\'}; "\n                    f"source_sha256={member.get(\'source_content_sha256\') or expected_training_sha or \'<missing>\'}; "\n                    f"normalization_policy={member.get(\'training_input_policy\') or manifest.get(\'training_input_policy\') or \'<missing>\'}"\n                )\n',
          )

          # snapshots.py: make normalization policy part of immutable Snapshot identity.
          replace_once(
              "platform_core/snapshots.py",
              "from .training_splits import SplitManifest\n\n\ndef _canonical",
              f'from .training_splits import SplitManifest\n\n\nTRAINING_INPUT_POLICY = "{POLICY}"\n\n\ndef _canonical',
          )
          replace_once(
              "platform_core/snapshots.py",
              '    payload = {\n        "seed": int(seed),\n        "train_image_ids": train_ids,\n',
              '    payload = {\n        "seed": int(seed),\n        "training_input_policy": TRAINING_INPUT_POLICY,\n        "train_image_ids": train_ids,\n',
          )
          replace_once(
              "platform_core/snapshots.py",
              '    payload = {\n        "schema_version": 3,\n        "mode": manifest.mode.value,\n',
              '    payload = {\n        "schema_version": 3,\n        "training_input_policy": TRAINING_INPUT_POLICY,\n        "mode": manifest.mode.value,\n',
          )

          # training_bundle_cache.py: invalidate old unsafe cache and never hardlink trainer-writable images.
          replace_once(
              "platform_core/training_bundle_cache.py",
              "CACHE_SCHEMA_VERSION = 2",
              "CACHE_SCHEMA_VERSION = 3",
          )
          replace_once(
              "platform_core/training_bundle_cache.py",
              '''            try:\n                os.link(source_image, destination_image)\n                hardlinked_images += 1\n                hardlinked_image_bytes += expected_size\n            except OSError:\n                shutil.copy2(source_image, destination_image)\n                copied_images += 1\n                copied_image_bytes += expected_size\n''',
              '''            # The task bundle is trainer-writable. A hardlink here would let\n            # Ultralytics image repair mutate the persistent cache inode. Always\n            # materialize an isolated task copy; future reflink/CoW support may\n            # optimize this without sharing writable file identity.\n            shutil.copy2(source_image, destination_image)\n            copied_images += 1\n            copied_image_bytes += expected_size\n''',
          )

          # Cache regression tests: isolated copies are now the contract.
          replace_once(
              "tests/unit/test_training_bundle_cache.py",
              '''def test_verified_bundle_cache_publishes_and_restores_with_image_hardlinks(tmp_path):\n    snapshot_id = "a" * 64\n    source_bundle = _write_bundle(tmp_path / "source", snapshot_id=snapshot_id)\n    cache = TrainingBundleCache(tmp_path / "data", "project-a", max_bytes=0, ttl_seconds=0)\n\n    entry, published = cache.publish_verified(\n        source_bundle,\n        snapshot_id,\n        verified_files=2,\n    )\n    assert published["published"] is True\n    assert published["verified_files"] == 2\n    assert published["bundle_bytes"] == entry.bundle_bytes\n    assert published["maintenance"]["evicted_entries"] == 0\n\n    resolved = cache.resolve(snapshot_id)\n    assert resolved is not None\n    restored, stats = cache.restore(resolved, tmp_path / "task-work")\n\n    cache_image = entry.bundle / "dataset/images/train/img-1.jpg"\n    restored_image = restored / "dataset/images/train/img-1.jpg"\n    cache_label = entry.bundle / "dataset/labels/train/img-1.txt"\n    restored_label = restored / "dataset/labels/train/img-1.txt"\n    assert restored_image.read_bytes() == b"train-image-bytes"\n    assert stats["hardlinked_images"] == 2\n    assert stats["hardlinked_image_bytes"] == len(b"train-image-bytes") + len(b"test-image-bytes")\n    assert stats["copied_images"] == 0\n    assert stats["copied_image_bytes"] == 0\n    assert stats["cache_bundle_bytes"] == entry.bundle_bytes\n    assert stats["cache_last_access_ns"] > 0\n    assert os.path.samefile(cache_image, restored_image)\n    assert not os.path.samefile(cache_label, restored_label)\n''',
              '''def test_verified_bundle_cache_restores_isolated_trainer_writable_images(tmp_path):\n    snapshot_id = "a" * 64\n    source_bundle = _write_bundle(tmp_path / "source", snapshot_id=snapshot_id)\n    cache = TrainingBundleCache(tmp_path / "data", "project-a", max_bytes=0, ttl_seconds=0)\n\n    entry, published = cache.publish_verified(\n        source_bundle,\n        snapshot_id,\n        verified_files=2,\n    )\n    assert published["published"] is True\n    assert published["verified_files"] == 2\n    assert published["bundle_bytes"] == entry.bundle_bytes\n    assert published["maintenance"]["evicted_entries"] == 0\n\n    resolved = cache.resolve(snapshot_id)\n    assert resolved is not None\n    restored, stats = cache.restore(resolved, tmp_path / "task-work")\n\n    cache_image = entry.bundle / "dataset/images/train/img-1.jpg"\n    restored_image = restored / "dataset/images/train/img-1.jpg"\n    cache_label = entry.bundle / "dataset/labels/train/img-1.txt"\n    restored_label = restored / "dataset/labels/train/img-1.txt"\n    assert restored_image.read_bytes() == b"train-image-bytes"\n    assert stats["hardlinked_images"] == 0\n    assert stats["hardlinked_image_bytes"] == 0\n    assert stats["copied_images"] == 2\n    assert stats["copied_image_bytes"] == len(b"train-image-bytes") + len(b"test-image-bytes")\n    assert stats["cache_bundle_bytes"] == entry.bundle_bytes\n    assert stats["cache_last_access_ns"] > 0\n    assert not os.path.samefile(cache_image, restored_image)\n    assert not os.path.samefile(cache_label, restored_label)\n\n    restored_image.write_bytes(b"rewritten-by-trainer")\n    assert cache_image.read_bytes() == b"train-image-bytes"\n''',
          )
          replace_once(
              "tests/unit/test_training_bundle_cache.py",
              '''def test_cache_restore_falls_back_to_copy_when_hardlink_is_unavailable(monkeypatch, tmp_path):\n    snapshot_id = "c" * 64\n    source_bundle = _write_bundle(tmp_path / "source", snapshot_id=snapshot_id)\n    cache = TrainingBundleCache(tmp_path / "data", "project-c", max_bytes=0, ttl_seconds=0)\n    entry, _ = cache.publish_verified(source_bundle, snapshot_id, verified_files=2)\n\n    monkeypatch.setattr(\n        training_bundle_cache.os,\n        "link",\n        lambda *_args, **_kwargs: (_ for _ in ()).throw(OSError(errno.EXDEV, "cross-device")),\n    )\n    restored, stats = cache.restore(entry, tmp_path / "task-work")\n    assert stats["hardlinked_images"] == 0\n    assert stats["hardlinked_image_bytes"] == 0\n    assert stats["copied_images"] == 2\n    assert stats["copied_image_bytes"] == len(b"train-image-bytes") + len(b"test-image-bytes")\n    assert (restored / "dataset/images/test/img-2.jpg").read_bytes() == b"test-image-bytes"\n''',
              '''def test_cache_restore_never_attempts_image_hardlinks(monkeypatch, tmp_path):\n    snapshot_id = "c" * 64\n    source_bundle = _write_bundle(tmp_path / "source", snapshot_id=snapshot_id)\n    cache = TrainingBundleCache(tmp_path / "data", "project-c", max_bytes=0, ttl_seconds=0)\n    entry, _ = cache.publish_verified(source_bundle, snapshot_id, verified_files=2)\n\n    monkeypatch.setattr(\n        training_bundle_cache.os,\n        "link",\n        lambda *_args, **_kwargs: (_ for _ in ()).throw(AssertionError("hardlink must not be used")),\n    )\n    restored, stats = cache.restore(entry, tmp_path / "task-work")\n    assert stats["hardlinked_images"] == 0\n    assert stats["copied_images"] == 2\n    assert (restored / "dataset/images/test/img-2.jpg").read_bytes() == b"test-image-bytes"\n''',
          )
          append_once(
              "tests/unit/test_training_bundle_cache.py",
              "def test_cache_schema_v2_is_rejected_after_writable_hardlink_fix",
              '''def test_cache_schema_v2_is_rejected_after_writable_hardlink_fix(tmp_path):\n    snapshot_id = "0" * 64\n    source_bundle = _write_bundle(tmp_path / "source-schema", snapshot_id=snapshot_id)\n    cache = TrainingBundleCache(tmp_path / "data", "project-schema", max_bytes=0, ttl_seconds=0)\n    entry, _ = cache.publish_verified(source_bundle, snapshot_id, verified_files=2)\n    marker_path = entry.root / "cache.json"\n    marker = json.loads(marker_path.read_text(encoding="utf-8"))\n    marker["schema_version"] = 2\n    marker_path.write_text(json.dumps(marker, sort_keys=True), encoding="utf-8")\n\n    assert cache.resolve(snapshot_id) is None\n''',
          )

          # Materialization regression tests reproduce the D-Fire missing-EOI failure mode.
          replace_once(
              "tests/unit/test_training_bundle_isolation.py",
              "import hashlib\nimport os\nimport time\n",
              "import hashlib\nimport json\nimport os\nimport time\n",
          )
          replace_once(
              "tests/unit/test_training_bundle_isolation.py",
              "import pytest\n\nfrom platform_core import training_tasks\n",
              "import pytest\nfrom PIL import Image\n\nfrom platform_core import training_tasks\n",
          )
          append_once(
              "tests/unit/test_training_bundle_isolation.py",
              "def test_missing_jpeg_eoi_is_normalized_before_ultralytics_without_mutating_source",
              '''def test_missing_jpeg_eoi_is_normalized_before_ultralytics_without_mutating_source(tmp_path: Path):\n    source = tmp_path / "WEB07552.jpg"\n    Image.new("RGB", (8, 8), (120, 30, 10)).save(source, format="JPEG")\n    valid = source.read_bytes()\n    assert valid[-2:] == b"\\xff\\xd9"\n    broken = valid[:-2] + b"t\\n"\n    source.write_bytes(broken)\n    source_sha = hashlib.sha256(broken).hexdigest()\n    source_size = len(broken)\n\n    bundle = _materialize(tmp_path / "task-jpeg-repair", source)\n    destination = bundle / "dataset/images/train/image-one.jpg"\n    manifest = json.loads((bundle / "manifest.json").read_text(encoding="utf-8"))\n    member = manifest["splits"]["train"][0]\n\n    assert source.read_bytes() == broken\n    assert source.stat().st_size == source_size\n    assert hashlib.sha256(source.read_bytes()).hexdigest() == source_sha\n    assert destination.read_bytes()[-2:] == b"\\xff\\xd9"\n    assert member["source_content_sha256"] == source_sha\n    assert member["source_size_bytes"] == source_size\n    assert member["content_sha256"] == hashlib.sha256(destination.read_bytes()).hexdigest()\n    assert member["size_bytes"] == destination.stat().st_size\n    assert member["normalized"] is True\n    assert member["normalization_reason"] == "jpeg_missing_eoi"\n    assert member["training_input_policy"] == "ultralytics_jpeg_repair_v1"\n    assert manifest["training_input_policy"] == "ultralytics_jpeg_repair_v1"\n    assert training_tasks.verify_portable_dataset(bundle / "manifest.json")["verified_files"] == 1\n\n\ndef test_standard_jpeg_keeps_exact_training_bytes(tmp_path: Path):\n    source = tmp_path / "normal.jpg"\n    Image.new("RGB", (8, 8), (20, 40, 60)).save(source, format="JPEG")\n    original = source.read_bytes()\n    bundle = _materialize(tmp_path / "task-jpeg-normal", source)\n    destination = bundle / "dataset/images/train/image-one.jpg"\n    manifest = json.loads((bundle / "manifest.json").read_text(encoding="utf-8"))\n    member = manifest["splits"]["train"][0]\n\n    assert destination.read_bytes() == original\n    assert member["source_content_sha256"] == member["content_sha256"]\n    assert member["source_size_bytes"] == member["size_bytes"]\n    assert member["normalized"] is False\n    assert member["normalization_reason"] is None\n\n\ndef test_training_bundle_mutation_error_reports_image_id_and_expected_actual_sha(tmp_path: Path):\n    source = tmp_path / "normal-error.jpg"\n    Image.new("RGB", (8, 8), (1, 2, 3)).save(source, format="JPEG")\n    bundle = _materialize(tmp_path / "task-jpeg-error", source)\n    destination = bundle / "dataset/images/train/image-one.jpg"\n    destination.write_bytes(b"mutated-after-materialization")\n\n    with pytest.raises(ValueError) as error:\n        training_tasks.verify_portable_dataset(bundle / "manifest.json")\n    message = str(error.value)\n    assert "TRAINING_BUNDLE_IMAGE_MUTATED" in message\n    assert "image_id=image-one" in message\n    assert "expected_training_sha256=" in message\n    assert "actual_sha256=" in message\n''',
          )

          replace_once(
              "tests/unit/test_snapshots.py",
              '    assert first["schema_version"] == 3\n',
              '    assert first["schema_version"] == 3\n    assert first["training_input_policy"] == "ultralytics_jpeg_repair_v1"\n',
          )

          # Permanent CI guard must encode the new safe contract instead of the old hardlink contract.
          workflow = Path(".github/workflows/training-final-validation-hardening.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              "      - platform_core/training_tasks.py\n      - platform_core/training_bundle_cache.py\n",
              "      - platform_core/training_tasks.py\n      - platform_core/training_bundle_cache.py\n      - platform_core/snapshots.py\n",
              1,
          )
          text = text.replace(
              "      - tests/unit/test_training_bundle_isolation.py\n",
              "      - tests/unit/test_training_bundle_isolation.py\n      - tests/unit/test_snapshots.py\n",
              1,
          )
          text = text.replace(
              "          platform_core/training_bundle_cache.py\n          platform_core/training_metrics.py\n",
              "          platform_core/training_bundle_cache.py\n          platform_core/snapshots.py\n          platform_core/training_metrics.py\n",
              1,
          )
          text = text.replace(
              "          tests/unit/test_training_bundle_isolation.py\n          tests/unit/task_runtime/test_process_control.py\n",
              "          tests/unit/test_training_bundle_isolation.py\n          tests/unit/test_snapshots.py\n          tests/unit/task_runtime/test_process_control.py\n",
              1,
          )
          text = text.replace("grep -Fq 'CACHE_SCHEMA_VERSION = 2'", "grep -Fq 'CACHE_SCHEMA_VERSION = 3'", 1)
          text = text.replace(
              "          grep -Fq 'os.link' platform_core/training_bundle_cache.py\n          grep -Fq 'test_verified_bundle_cache_publishes_and_restores_with_image_hardlinks' tests/unit/test_training_bundle_cache.py\n",
              "          if grep -Fq 'os.link(source_image, destination_image)' platform_core/training_bundle_cache.py; then echo 'trainer-writable cache restore must not hardlink images' >&2; exit 1; fi\n          grep -Fq 'test_verified_bundle_cache_restores_isolated_trainer_writable_images' tests/unit/test_training_bundle_cache.py\n          grep -Fq 'test_cache_restore_never_attempts_image_hardlinks' tests/unit/test_training_bundle_cache.py\n          grep -Fq 'test_cache_schema_v2_is_rejected_after_writable_hardlink_fix' tests/unit/test_training_bundle_cache.py\n          grep -Fq 'TRAINING_INPUT_POLICY = \"ultralytics_jpeg_repair_v1\"' platform_core/training_tasks.py\n          grep -Fq 'source_content_sha256' platform_core/training_tasks.py\n          grep -Fq 'TRAINING_BUNDLE_IMAGE_MUTATED' platform_core/training_tasks.py\n          grep -Fq 'test_missing_jpeg_eoi_is_normalized_before_ultralytics_without_mutating_source' tests/unit/test_training_bundle_isolation.py\n          grep -Fq 'training_input_policy' platform_core/snapshots.py\n",
              1,
          )
          workflow.write_text(text, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Compile changed runtime
        run: |
          python -m py_compile platform_core/training_tasks.py platform_core/training_bundle_cache.py platform_core/snapshots.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/unit/test_training_bundle_isolation.py tests/unit/test_training_bundle_cache.py tests/unit/test_portable_dataset.py tests/unit/test_snapshots.py tests/unit/test_training_startup_performance_contract.py

      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/training_tasks.py platform_core/training_bundle_cache.py platform_core/snapshots.py tests/unit/test_training_bundle_isolation.py tests/unit/test_training_bundle_cache.py tests/unit/test_snapshots.py .github/workflows/training-final-validation-hardening.yml
          git diff --cached --check
          git commit -m "fix(training): normalize trainer jpeg inputs safely"
          git push origin "HEAD:${GITHUB_REF_NAME}"
