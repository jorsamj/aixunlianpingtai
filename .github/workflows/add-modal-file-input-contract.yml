name: Add Modal File Input Contract

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_modal_file_input_contract.py
      - .github/workflows/add-modal-file-input-contract.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser-test backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Add browser behavior contract
        run: python tools/add_modal_file_input_contract.py
      - name: Verify current modal owner satisfies the contract
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep "modal file input beautification survives modal lifecycle ownership"
      - name: Commit permanent browser contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/navigation-stability.spec.mjs
          git commit -m 'test(ui): lock modal file input beautification behavior'
          git push
