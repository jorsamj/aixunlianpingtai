name: Consolidate Lifecycle Event Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/consolidate_lifecycle_event_owners.py
      - .github/workflows/consolidate-lifecycle-event-owners.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded lifecycle migration
        run: python tools/consolidate_lifecycle_event_owners.py
      - name: Verify static and unit contracts
        run: |
          node --check static/app.js
          node --check static/main.mjs
          node --test tests/frontend/lifecycle-event-ownership.test.mjs tests/frontend/material-pagination-runtime.test.mjs tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/file-input-beautification-owner.test.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Verify ZIP completion behavior
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "ZIP import completion surfaces review action and auto-opens review"
      - name: Verify training refresh isolation repeatedly
        run: npx playwright test tests/browser/training-task-performance.spec.mjs --repeat-each=5
      - name: Commit lifecycle consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/main.mjs static/index.html static/modules/material-pagination-runtime.js tests/frontend/lifecycle-event-ownership.test.mjs
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'refactor(ui): consolidate lifecycle event owners'
          git push origin HEAD:refactor/frontend-runtime-stabilization
