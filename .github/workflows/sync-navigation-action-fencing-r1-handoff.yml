name: Sync Navigation Action Fencing R1 Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_navigation_action_fencing_r1_handoff.py
      - .github/workflows/sync-navigation-action-fencing-r1-handoff.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded R1 handoff synchronization
        run: python tools/sync_navigation_action_fencing_r1_handoff.py
      - name: Verify release boundary and R1 scope
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq 'R1 is closed; global stale-async zero-point is not' docs/frontend-legacy-audit.md
          grep -Fq 'overall action fencing IN PROGRESS' docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -Fq 'R2：最终 Model Config / AI 清洗与 modal mutation completion' AGENTS.md
      - name: Commit authority docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/CODEX_CURRENT_STATE.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md
          git diff --cached --quiet && { echo 'No handoff changes'; exit 1; }
          git commit -m "docs: synchronize Navigation Action Fencing R1 acceptance"
          git push origin HEAD:refactor/frontend-runtime-stabilization
