name: Fix R20b Publish Baseline Assertion

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/fix_r20b_publish_baseline_assertion.py
      - .github/workflows/fix-r20b-publish-baseline-assertion.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Correct baseline assertion
        run: python tools/fix_r20b_publish_baseline_assertion.py
      - name: Verify old publish behavior baseline
        run: npx playwright test tests/browser/algorithm-list-performance.spec.mjs --grep "publishing a pending model as an algorithm version keeps the live publish flow functional"
      - name: Commit corrected permanent baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/algorithm-list-performance.spec.mjs
          git diff --cached --quiet && { echo 'No baseline changes'; exit 1; }
          git commit -m 'test(ui): correct model version publish baseline semantics'
          git push origin HEAD:refactor/frontend-runtime-stabilization
