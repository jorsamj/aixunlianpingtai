name: Retire Bootstrap setPage

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_bootstrap_setpage.py
      - .github/workflows/retire-bootstrap-setpage.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded bootstrap retirement
        run: python tools/retire_bootstrap_setpage.py
      - name: Verify focused navigation contracts
        run: |
          node --check static/app.js
          node --check static/modules/navigation-stability.js
          node --check static/main.mjs
          node --test tests/frontend/navigation-stability.test.mjs tests/frontend/navigation-persistence.test.mjs tests/frontend/ui-state.test.mjs tests/frontend/retired-sidebar-setpage-guard.test.mjs tests/frontend/retired-pre-v424-setpage-guard.test.mjs
          if grep -Fq 'function setPage(p){state.page=p;render()} window.setPage=setPage;' static/app.js; then
            echo 'initial bootstrap setPage remains' >&2
            exit 1
          fi
          grep -Fq 'performNavigation' static/modules/navigation-stability.js
          grep -Fq 'performNavigation: page =>' static/main.mjs
          grep -Fq '/static/app.js?v=42.25.57' static/index.html
          grep -Fq '/static/main.mjs?v=42.25.59' static/index.html
      - name: Commit retired bootstrap owner
        run: |
          if git diff --quiet -- static/app.js static/index.html tests/frontend/retired-sidebar-setpage-guard.test.mjs; then
            echo 'no bootstrap retirement changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/retired-sidebar-setpage-guard.test.mjs
          git commit -m 'refactor(ui): retire initial bootstrap setPage owner'
          git push
