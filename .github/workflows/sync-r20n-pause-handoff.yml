name: Sync R20n Pause Handoff

on:
  push:
    branches: [refactor/frontend-runtime-stabilization]
    paths: [.github/workflows/sync-r20n-pause-handoff.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize R20n and pause handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ACCEPT='b83b2bf360b891265157e602f622d409d1d2332f'
          PRODUCT='9acaa534e596464a1ebe129e435916ed7dd9cdf2'
          CLEANUP='fce8034a861e1f9c5c0d37568891717309845794'
          RUN='34725907423'
          ACTION='34725907404'
          CACHE='42.25.93'

          def one(s,a,b,label):
              if s.count(a)!=1: raise SystemExit(f'{label}: expected 1 anchor, found {s.count(a)}')
              return s.replace(a,b,1)

          section=f'''### R20n — shadowed Model Config generations retirement CLOSED / 技术债主线暂停

Source-order 与删除前/后的同一套 M4 Real Chrome 合同证明：旧 v35 / v426 / v427 `openModelConfigModalV35 → saveModelConfigV35/saveModelConfig426/saveModelConfig427` generations 已被最终 M4 owner 覆盖，运行时不可达。R20n 仅物理删除这 3 套历史 modal/save generation；最终 `saveVisionModelM4`、`testModelConfigV35`、M4 capture/final activation、模型配置字段与 API 语义均保持不变。

```text
baseline + migration run: 34725790087
product:                  {PRODUCT}
cleanup:                  {CLEANUP}
contract alignment / accepted HEAD: {ACCEPT}
Frontend Runtime:         {RUN}
full Real Chrome:         33/33 PASS
Navigation Action Fencing:{ACTION} PASS
formal VERSION.txt:       42.24.0 unchanged
app.js cache:             {CACHE}
main.mjs cache:           42.25.89
```

永久 source contract：`tests/frontend/shadowed-model-config-generations-r20n.test.mjs`；最终 M4 行为继续由 `tests/browser/navigation-action-fencing-r2.spec.mjs` 与现有 Action Fencing workflow 覆盖。一次性 R20n migration helper/workflow 已物理删除。

**按用户要求，从 R20n 起技术债清理主线 PAUSED。** 剩余 R20 global reload/request zero-point、stale-async final scan、cache-busting、历史 dead code、命名/结构归一化、Resource Lifecycle production soak 等均保持 OPEN/DEFERRED，不宣称 CLOSED；除非出现真实功能故障、明显性能问题、数据完整性风险或发布验收阻断，否则不得为了“代码更干净”继续展开技术债批次。

'''

          # AGENTS
          p=Path('AGENTS.md'); s=p.read_text(encoding='utf-8')
          s=one(s,'latest full code acceptance: 40a87bf70402dccfc0387950b6856a561ce1ebe1\nFrontend Runtime run:        34724354775',f'latest full code acceptance: {ACCEPT}\nFrontend Runtime run:        {RUN}','agents acceptance')
          s=one(s,'app.js cache:                42.25.92',f'app.js cache:                {CACHE}','agents cache')
          s=one(s,'`34724354775` 已通过 syntax、永久 owner/navigation guards、全量 frontend unit tests、Real Chrome runtime regressions；Real Chrome 33/33。Navigation Action Fencing 永久 workflow `34724354790` 全绿；',f'`{RUN}` 已通过 syntax、永久 owner/navigation guards、全量 frontend unit tests、Real Chrome runtime regressions；Real Chrome 33/33。Navigation Action Fencing 永久 workflow `{ACTION}` 全绿；','agents runs')
          s=one(s,'**仍是技术债优先阶段；A800 RC 暂缓。**','**技术债清理主线已按用户要求暂停；后续优先真实功能、性能、数据完整性与生产验收。A800 RC 是否推进由后续任务决定。**','agents policy')
          s=one(s,'## 下一批准确范围：R20 final global reload/request zero-point\n\n','## 当前边界：技术债清理 PAUSED\n\n除非出现真实功能故障、明显性能问题、数据完整性风险或发布验收阻断，不再继续 dead-code / zero-point / 命名 / cache-busting 类清理。剩余债务保留为 OPEN/DEFERRED，不影响当前功能使用时不主动扩展。\n\n'+section,'agents scope')
          s=s.replace('1. R20 final global reload/request zero-point\n2. Unified Task Progress + Durable Queue Runtime productionization\n3. Navigation Action Fencing final scan (upload/ZIP/deployment/timer-callback completions)','1. 技术债清理 PAUSED；仅在真实功能/性能/数据/发布阻断时恢复\n2. Unified Task Progress + Durable Queue Runtime productionization（按后续产品任务推进）\n3. Navigation Action Fencing final scan — DEFERRED，除非出现真实 stale-async 故障')
          p.write_text(s,encoding='utf-8')

          # CODEX
          p=Path('docs/CODEX_CURRENT_STATE.md'); s=p.read_text(encoding='utf-8')
          s=one(s,'latest full code acceptance: 40a87bf70402dccfc0387950b6856a561ce1ebe1\nFrontend Runtime run:        34724354775',f'latest full code acceptance: {ACCEPT}\nFrontend Runtime run:        {RUN}','codex acceptance')
          s=one(s,'app.js cache:                42.25.92',f'app.js cache:                {CACHE}','codex cache')
          s=one(s,'Run `34724354775` passed syntax, all permanent owner guards, all frontend unit tests and Real Chrome runtime regressions after R20m shadowed-owner retirement and migration-artifact cleanup. Browser navigation runs **33 tests and passed 33/33**. Permanent Action Fencing workflow `34724354790` is green;',f'Run `{RUN}` passed syntax, all permanent owner guards, all frontend unit tests and Real Chrome runtime regressions after final R20n shadowed Model Config retirement. Browser navigation runs **33 tests and passed 33/33**. Permanent Action Fencing workflow `{ACTION}` is green;','codex run')
          s=one(s,'```text\nR20 final global reload/request zero-point\n→ Unified Task Progress + Durable Queue Runtime productionization\n→ Navigation Action Fencing final scan (upload/ZIP/deployment/timer-callback completions)','```text\nTECH-DEBT CLEANUP PAUSED BY USER REQUEST\n→ resume only for real functional/performance/data-integrity/release-blocking evidence\n→ Unified Task Progress + Durable Queue Runtime productionization (product work, when requested)\n→ Navigation Action Fencing final scan DEFERRED unless a real stale-async defect appears','codex priority')
          s=one(s,'A800 RC remains deferred.\n\n### R20m','A800 RC remains deferred unless the next product/acceptance task explicitly resumes it.\n\n'+section+'### R20m','codex insert')
          p.write_text(s,encoding='utf-8')

          # TECH
          p=Path('docs/TECH_DEBT_CLOSURE_V42_25.md'); s=p.read_text(encoding='utf-8')
          s=one(s,'> **状态：ACTIVE / 技术债优先阶段**  \n','> **状态：PAUSED / 非阻断技术债清理按用户要求暂停**\n','tech status')
          s=one(s,'> **最近完整代码验收点：`40a87bf70402dccfc0387950b6856a561ce1ebe1`**',f'> **最近完整代码验收点：`{ACCEPT}`**','tech acceptance')
          s=one(s,'> **Frontend Runtime Stabilization：run `34724354775`，frontend + Real Chrome 全绿，Real Chrome 33/33 passed；Navigation Action Fencing 永久 run `34724354790` 全绿；',f'> **Frontend Runtime Stabilization：run `{RUN}`，frontend + Real Chrome 全绿，Real Chrome 33/33 passed；Navigation Action Fencing 永久 run `{ACTION}` 全绿；','tech run')
          s=one(s,'当前优先级仍是技术债关闭；A800 RC 暂缓。','技术债清理主线已按用户要求暂停。剩余非阻断债务保持 OPEN/DEFERRED；只有真实功能、性能、数据完整性或发布验收问题才恢复对应清理。','tech policy')
          s=one(s,'v423 shadowed `openNewAlgorithm423(async)/saveNewAlgorithm423/editAlgorithm423(old modal)/saveEditAlgorithm423` create/edit generation\n','v423 shadowed `openNewAlgorithm423(async)/saveNewAlgorithm423/editAlgorithm423(old modal)/saveEditAlgorithm423` create/edit generation\nshadowed Model Config v35/v426/v427 modal/save generations (`saveModelConfigV35/saveModelConfig426/saveModelConfig427`)\n','tech surface')
          s=one(s,'| source-import terminal completion broad refresh | labels + current paged materials only | **CLOSED (R20l)** |','| source-import terminal completion broad refresh | labels + current paged materials only | **CLOSED (R20l)** |\n| shadowed v35/v426/v427 Model Config generations | final M4 `saveVisionModelM4` + capture/final activation | **CLOSED (R20n)** |','tech table')
          s=s.replace('| Navigation Action Fencing remaining upload/deployment/timer/callback completions | final async-action zero-point | **IN PROGRESS** |','| Navigation Action Fencing remaining upload/deployment/timer/callback completions | final async-action zero-point | **OPEN / DEFERRED** |')
          s=s.replace('| global reload / duplicate request | scoped refresh / zero-point proof | **IN PROGRESS (R20)** |','| global reload / duplicate request | scoped refresh / zero-point proof | **OPEN / PAUSED (R20)** |')
          s=one(s,'## 2.0a Navigation Action Fencing R1',section+'## 2.0a Navigation Action Fencing R1','tech insert')
          p.write_text(s,encoding='utf-8')

          # OWNER MAP
          p=Path('docs/FRONTEND_OWNER_MAP_V42_25.md'); s=p.read_text(encoding='utf-8')
          s=one(s,'> Status: ACTIVE AUDIT  \n','> Status: PAUSED AUDIT — non-blocking technical-debt cleanup deferred by user request\n','owner status')
          s=one(s,'> Latest fully accepted code point: `40a87bf70402dccfc0387950b6856a561ce1ebe1` / run `34724354775`',f'> Latest fully accepted code point: `{ACCEPT}` / run `{RUN}`','owner acceptance')
          s=one(s,'Navigation ownership is already outside the classic `setPage` family. Current cleanup target is the remaining render/post-render chain and lifecycle debt.','Navigation ownership is already outside the classic `setPage` family. Further non-blocking cleanup is PAUSED; resume this audit only for real functional/performance/data-integrity/release-blocking evidence.','owner policy')
          s=one(s,'| R20m | shadowed v423 algorithm create/edit generation physically retired; stable 414 CRUD remains final | `40a87bf704...` / `34724354775` (33/33) |',f'| R20m | shadowed v423 algorithm create/edit generation physically retired; stable 414 CRUD remains final | `40a87bf704...` / `34724354775` (33/33) |\n| R20n | shadowed v35/v426/v427 Model Config modal/save generations retired; final M4 owner preserved | `{ACCEPT[:10]}...` / `{RUN}` (33/33) |','owner row')
          s=one(s,'R20h product:',f'R20n product: `{PRODUCT}`; cleanup `{CLEANUP}`; final accepted contract `{ACCEPT}` / Frontend Runtime `{RUN}`; Real Chrome **33/33 passed**; Action Fencing `{ACTION}` PASS. The final M4 `openModelConfigModalV35 → saveVisionModelM4` owner, M4 capture/final activation and model-config API semantics remain unchanged. One-shot R20n migration artifacts are physically deleted. Further non-blocking owner cleanup is PAUSED by user request.\n\nR20h product:','owner detail')
          p.write_text(s,encoding='utf-8')

          # LEGACY AUDIT
          p=Path('docs/frontend-legacy-audit.md'); s=p.read_text(encoding='utf-8')
          s=one(s,'commit:       40a87bf70402dccfc0387950b6856a561ce1ebe1\nrun:          34724354775',f'commit:       {ACCEPT}\nrun:          {RUN}','legacy acceptance')
          s=one(s,'app.js                    42.25.92',f'app.js                    {CACHE}','legacy cache')
          s=one(s,'zero-reference uploadImages / autoSplit / buildYolo / checkDatasetQuality / setImageSplit owners\n','zero-reference uploadImages / autoSplit / buildYolo / checkDatasetQuality / setImageSplit owners\nshadowed v35/v426/v427 Model Config modal/save generations\n','legacy surface')
          anchor='\n\nCross-cutting checkpoint after R20k:'
          pos=s.find(anchor)
          if pos<0: raise SystemExit('legacy insertion anchor missing')
          note=f'''\n\nR20n retired the three shadowed Model Config modal/save generations (`saveModelConfigV35`, `saveModelConfig426`, `saveModelConfig427`) after source-order proof plus the same M4 Real Chrome contract passed before and after deletion. Final M4 `saveVisionModelM4` and `testModelConfigV35` remain authoritative and action-fenced. Product `{PRODUCT}`, cleanup `{CLEANUP}`, final accepted HEAD `{ACCEPT}` / Frontend Runtime `{RUN}`, Real Chrome **33/33**, Action Fencing `{ACTION}` PASS; app cache `{CACHE}`. One-shot migration artifacts are deleted. **Further non-blocking legacy cleanup is PAUSED by user request; remaining debt stays OPEN/DEFERRED unless it blocks real use, performance, data integrity or release acceptance.**'''
          s=s[:pos]+note+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify paused accepted state
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          grep -q '/static/app.js?v=42.25.93' static/index.html
          grep -q 'b83b2bf360b891265157e602f622d409d1d2332f' AGENTS.md
          grep -q 'TECH-DEBT CLEANUP PAUSED BY USER REQUEST' docs/CODEX_CURRENT_STATE.md
          grep -q 'R20n' docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -q 'R20n' docs/frontend-legacy-audit.md
          grep -q 'R20n' docs/FRONTEND_OWNER_MAP_V42_25.md
          test -f tests/frontend/shadowed-model-config-generations-r20n.test.mjs
          test ! -f tools/migrate_shadowed_model_config_r20n.py
          test ! -f .github/workflows/migrate-shadowed-model-config-r20n.yml
          git diff --check
      - name: Remove one-shot docs workflow and commit handoff
        shell: bash
        run: |
          git rm .github/workflows/sync-r20n-pause-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git diff --cached --check
          git commit -m "docs: close R20n and pause non-blocking technical debt"
          git push origin HEAD:refactor/frontend-runtime-stabilization
