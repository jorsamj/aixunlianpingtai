name: Close R20h Legacy Algorithm CRUD Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-r20h-legacy-algorithm-crud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install permanent R20h guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/frontend-runtime-stabilization.yml')
          text = path.read_text(encoding='utf-8')
          if 'Retired legacy algorithm CRUD owner guard' in text:
              raise SystemExit('R20h permanent guard already present unexpectedly')

          unit_anchor = '      - name: Frontend unit tests\n        run: node --test tests/frontend/*.test.mjs\n'
          if text.count(unit_anchor) != 1:
              raise SystemExit('frontend unit-test anchor changed unexpectedly')

          guard = '''      - name: Retired legacy algorithm CRUD owner guard
            run: |
              for token in \\
                'window.newAlgorithm=' \\
                'window.saveAlgorithm=' \\
                'window.editAlgorithm=' \\
                'window.saveEditAlgorithm=' \\
                'window.viewAlgorithm=' \\
                'const oldRenderAlgorithms = window.renderAlgorithms;' \\
                'oldViewAlgoV39' \\
                'window.renderAlgorithms422=' \\
                'window.openNewAlgorithm422=' \\
                'window.saveNewAlgorithm422='; do
                if grep -F -n "$token" static/app.js; then
                  echo "retired algorithm CRUD/render owner was reintroduced: $token" >&2
                  exit 1
                fi
              done
              grep -Fq 'function renderAlgorithms(){return window.renderAlgorithms423?.()}' static/app.js
              grep -Fq "registerAction('algorithm.create'" static/main.mjs
              grep -Fq 'window.saveNewAlgorithm414=async function()' static/app.js
              grep -Fq 'window.saveEditAlgorithm414=async id=>' static/app.js
              grep -Fq 'window.delAlgorithm=async id=>' static/app.js
          '''
          text = text.replace(unit_anchor, guard + unit_anchor, 1)

          browser_anchor = '          tests/browser/algorithm-list-performance.spec.mjs\n'
          if text.count(browser_anchor) != 1:
              raise SystemExit('algorithm browser-test anchor changed unexpectedly')
          text = text.replace(
              browser_anchor,
              browser_anchor + '          tests/browser/algorithm-crud-owner.spec.mjs\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify R20h product and formal version
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          test -f tests/frontend/legacy-algorithm-crud-owner.test.mjs
          test -f tests/browser/algorithm-crud-owner.spec.mjs
          grep -Fq 'app.js?v=42.25.84' static/index.html
          grep -Fq 'Retired legacy algorithm CRUD owner guard' .github/workflows/frontend-runtime-stabilization.yml
          grep -Fq 'tests/browser/algorithm-crud-owner.spec.mjs' .github/workflows/frontend-runtime-stabilization.yml
      - name: Remove one-shot R20h migration artifacts
        run: |
          rm -f tools/migrate_r20h_legacy_algorithm_crud.py
          rm -f .github/workflows/migrate-r20h-legacy-algorithm-crud.yml
      - name: Commit permanent validation surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/frontend-runtime-stabilization.yml .github/workflows/migrate-r20h-legacy-algorithm-crud.yml tools/migrate_r20h_legacy_algorithm_crud.py
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-status
          git commit -m 'chore(ui): install R20h permanent guards'
          git push
