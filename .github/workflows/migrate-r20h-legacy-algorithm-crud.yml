name: Migrate R20h Legacy Algorithm CRUD Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_r20h_legacy_algorithm_crud.py
      - .github/workflows/migrate-r20h-legacy-algorithm-crud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded R20h migration
        run: python tools/migrate_r20h_legacy_algorithm_crud.py
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Install frontend dependencies
        run: npm ci
      - name: Syntax check
        run: node --check static/app.js && node --check static/main.mjs
      - name: Run all frontend unit tests
        run: node --test tests/frontend/*.test.mjs
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Focused Real Chrome algorithm regressions
        run: >-
          npx playwright test
          tests/browser/algorithm-crud-owner.spec.mjs
          tests/browser/algorithm-list-performance.spec.mjs
      - name: Verify retired owners absent
        run: |
          for token in \
            'window.newAlgorithm=' \
            'window.saveAlgorithm=' \
            'window.editAlgorithm=' \
            'window.saveEditAlgorithm=' \
            'window.viewAlgorithm=' \
            'window.showReport=' \
            'const oldRenderAlgorithms = window.renderAlgorithms;' \
            'window.renderAlgorithms422=' \
            'window.openNewAlgorithm422=' \
            'window.saveNewAlgorithm422='; do
            if grep -F -n "$token" static/app.js; then
              echo "retired algorithm owner survived: $token" >&2
              exit 1
            fi
          done
          grep -Fq 'function renderAlgorithms(){return window.renderAlgorithms423?.()}' static/app.js
          grep -Fq 'app.js?v=42.25.84' static/index.html
      - name: Commit product migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/legacy-algorithm-crud-owner.test.mjs tests/browser/algorithm-crud-owner.spec.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'refactor(ui): retire legacy algorithm CRUD owners'
          git push
