name: Harden A800 RC acceptance verifier

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/harden_a800_rc_acceptance.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Apply guarded hardening patch
        run: python scripts/harden_a800_rc_acceptance.py
      - name: Verify scoped diff
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' a800_rc_acceptance.py tests/unit/test_a800_rc_acceptance.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Syntax and focused verifier tests
        run: |
          python -m py_compile a800_rc_acceptance.py
          python -m pytest --noconftest -q tests/unit/test_a800_rc_acceptance.py
      - name: Commit hardened verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a800_rc_acceptance.py tests/unit/test_a800_rc_acceptance.py
          git commit -m "feat(rc): harden A800 artifact and iteration verification"
          git push origin HEAD:refactor/frontend-runtime-stabilization
