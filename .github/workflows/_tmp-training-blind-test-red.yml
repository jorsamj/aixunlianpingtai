name: Temporary Training Blind Test RED

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-training-blind-test-red.yml
      - tests/unit/test_training_blind_test_contract.py

jobs:
  blind-test-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml pillow psutil filelock
      - name: Blind independent test contract
        run: python -m pytest --noconftest -q tests/unit/test_training_blind_test_contract.py
      - name: Version guard
        if: always()
        run: test "$(cat VERSION.txt)" = "42.24.0"
