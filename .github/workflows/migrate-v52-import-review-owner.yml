name: Migrate v52 Import Review Owner

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-v52-import-review-owner.yml
      - tools/migrate_v52_import_review_owner.py
      - tests/api/test_v52_import_review_owner.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2

      - name: Historical v52 review owner contract must be RED
        run: |
          set +e
          python -m pytest -q tests/api/test_v52_import_review_owner.py > /tmp/v52-review-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/v52-review-red.log
          test "$rc" = "1"
          grep -Eq "FAILED|TypeError|Response.*not iterable" /tmp/v52-review-red.log

      - name: Apply precise live-owner migration
        run: python tools/migrate_v52_import_review_owner.py

      - name: Syntax and diff hygiene
        run: |
          python -m py_compile app.py tools/migrate_v52_import_review_owner.py tests/api/test_v52_import_review_owner.py
          git diff --check

      - name: Focused v52 review owner contract
        run: python -m pytest -q tests/api/test_v52_import_review_owner.py

      - name: Import and material regressions
        run: >-
          python -m pytest -q
          tests/api/test_v19_import_failure_rollback.py
          tests/api/test_v19_job_atomic_persistence.py
          tests/api/test_v19_import_scalability.py
          tests/api/test_annotation_flow.py
          tests/api/test_material_batching.py
          tests/api/test_zip_processing_p1.py
          tests/api/test_zip_processing_p2a_annotation_connections.py
          tests/api/test_zip_processing_p2b_single_final_annotation.py
          tests/api/test_zip_processing_p2c_structured_single_final_annotation.py

      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check

      - name: Commit validated product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git commit -m "fix(import): use material repository in v52 import review"
          git push origin HEAD:refactor/frontend-runtime-stabilization
