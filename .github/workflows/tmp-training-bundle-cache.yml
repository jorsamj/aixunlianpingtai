name: Temporary Training Bundle Cache Patch

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-training-bundle-cache.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact bundle-cache patch
        run: python .github/tmp_training_bundle_cache_patch.py

      - name: Install project test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify bundle-cache implementation
        run: |
          python -m py_compile platform_core/training_bundle_cache.py platform_core/training_tasks.py
          python -m pytest -q \
            tests/unit/test_training_bundle_cache.py \
            tests/unit/test_training_startup_performance_contract.py \
            tests/unit/test_portable_dataset.py \
            tests/unit/test_training_bundle_isolation.py

      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-training-bundle-cache.yml
          git add \
            platform_core/training_bundle_cache.py \
            platform_core/training_tasks.py \
            tests/unit/test_training_bundle_cache.py \
            .github/workflows/training-final-validation-hardening.yml
          git commit -m "perf(training): reuse verified snapshot bundles"
          echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record closure and remove temporary helpers
        run: |
          python .github/tmp_training_bundle_cache_docs.py
          git rm .github/tmp_training_bundle_cache_patch.py .github/tmp_training_bundle_cache_docs.py
          git add docs/CODEX_CURRENT_STATE.md
          git commit -m "docs(training): record bundle cache closure"

      - name: Push verified commits
        run: git push origin HEAD:refactor/frontend-runtime-stabilization
