name: Retire Duplicate Sidebar SetPage

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_duplicate_sidebar_setpage.py
      - .github/workflows/retire-duplicate-sidebar-setpage.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/retire_duplicate_sidebar_setpage.py
      - name: Verify focused navigation contracts
        run: |
          node --check static/app.js
          node --check static/modules/navigation-stability.js
          node --test tests/frontend/navigation-stability.test.mjs tests/frontend/poll-registry.test.mjs
          if grep -F -n 'const baseSetPage=window.setPage;' static/app.js; then
            echo 'duplicate V37 sidebar setPage base capture remains' >&2
            exit 1
          fi
          if grep -F -n 'window.setPage=function(page){toggleMobileSidebarV37(false);baseSetPage(page)};' static/app.js; then
            echo 'duplicate V37 sidebar setPage wrapper remains' >&2
            exit 1
          fi
          grep -Fq 'const baseSetPage417=window.setPage;' static/app.js
          grep -Fq 'window.setPage=function(page){window.toggleMobileSidebarV37?.(false);return baseSetPage417?.(page)};' static/app.js
          grep -Fq '/static/app.js?v=42.25.51' static/index.html
      - name: Commit migrated files
        run: |
          if git diff --quiet -- static/app.js static/index.html; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html
          git commit -m 'refactor(ui): retire duplicate sidebar setPage wrapper'
          git push
