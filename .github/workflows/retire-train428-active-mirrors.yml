name: Retire train428 Active Mirrors

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_train428_active_mirrors.py
      - .github/workflows/retire-train428-active-mirrors.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded migration
        run: python tools/retire_train428_active_mirrors.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check app.js
        run: node --check static/app.js
      - name: Assert active train428 mirrors are gone from app.js
        run: |
          for token in train428AlgorithmId train428Config; do
            if grep -n "$token" static/app.js; then
              echo "$token remains in active app.js" >&2
              exit 1
            fi
          done
      - name: Run canonical training tests
        run: node --test tests/frontend/training-draft-runtime.test.mjs tests/frontend/training-draft-controls.test.mjs tests/frontend/training-submit.test.mjs tests/frontend/training-labels.test.mjs
      - name: Commit migrated app.js
        run: |
          if git diff --quiet -- static/app.js; then
            echo 'No migration change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js
          git commit -m 'refactor(ui): retire train428 active mirrors from classic app'
          git push origin HEAD:refactor/frontend-runtime-stabilization
