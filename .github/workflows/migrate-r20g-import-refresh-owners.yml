name: Migrate R20g Import Refresh Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_r20g_import_refresh_owners.py
      - .github/workflows/migrate-r20g-import-refresh-owners.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded R20g migration
        run: python tools/migrate_r20g_import_refresh_owners.py
      - name: Syntax check
        run: node --check static/app.js
      - name: Frontend owner tests
        run: node --test tests/frontend/*.test.mjs
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run focused R20g Chrome contracts
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep 'ZIP import completion uses scoped label and material refresh|server storage import confirmation avoids broad related refresh'
      - name: Commit accepted R20g product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/import-refresh-owner.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'refactor(ui): scope import completion refreshes'
          git push
