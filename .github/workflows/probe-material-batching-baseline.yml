name: Probe Material Batching Baseline

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/probe-material-batching-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest httpx
      - name: Run unchanged baseline regression
        run: python -m pytest -q tests/api/test_material_batching.py::test_image_batch_rejects_dataset_deleted_before_commit
