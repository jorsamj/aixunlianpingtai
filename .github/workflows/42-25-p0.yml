name: 42.25 P0 checks

on:
  push:
    branches:
      - feat/42.25.0
  pull_request:
    branches:
      - main

jobs:
  targeted-p0:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install targeted test dependencies
        run: >-
          python -m pip install
          pytest psutil pyyaml pillow
          fastapi httpx python-multipart requests
          keyring filelock boto3 oss2 opencv-python-headless
      - name: Compile changed P0 modules
        run: >-
          python -m py_compile
          task_worker.py
          platform_core/task_runtime/repository.py
          platform_core/task_runtime/audited_repository.py
          platform_core/annotation_task_service.py
          platform_core/training_splits.py
          platform_core/training_labels.py
          platform_core/training_preflight.py
          platform_core/annotation_repository.py
          platform_core/algorithms.py
          platform_core/training_tasks.py
          platform_core/deployment/conversion_tasks.py
          platform_core/deployment/inference_tasks.py
      - name: Run targeted P0 tests
        run: >-
          python -m pytest
          tests/unit/task_runtime/test_repository.py
          tests/unit/task_runtime/test_retry_audit.py
          tests/unit/test_annotation_task_service.py
          tests/unit/test_training_splits.py
          tests/unit/test_training_labels.py
          tests/unit/test_task_worker.py
          tests/unit/test_annotation_repository.py
          tests/unit/test_algorithms.py
          tests/unit/test_algorithm_artifact_manifest.py
          tests/unit/test_conversion_tasks.py
          tests/unit/test_deployment_inference_tasks.py
          -q
