name: Consolidate Page Normalization Owner

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/consolidate_page_normalization_owner.py
      - .github/workflows/consolidate-page-normalization-owner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded page normalization migration
        run: python tools/consolidate_page_normalization_owner.py
      - name: Verify static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/file-input-beautification-owner.test.mjs tests/frontend/lifecycle-event-ownership.test.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Verify page and modal normalization behavior
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "file input beautification survives page render lifecycle ownership|storage configuration route is rendered by the final storage owner|modal file input beautification survives modal lifecycle ownership|modal table wrapping and first-field focus survive normalization ownership"
      - name: Commit page normalization owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/file-input-beautification-owner.test.mjs
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'refactor(ui): consolidate final page normalization owner'
          git push origin HEAD:refactor/frontend-runtime-stabilization
