name: Temporary Cleaning Frontend Truth Docs Sync

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-sync-clean-frontend-truth-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync authority docs
        run: python .github/scripts/_tmp_sync_clean_frontend_truth_docs.py
      - name: Verify only authority docs changed
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/CODEX_CURRENT_STATE.md \
            docs/FRONTEND_OWNER_MAP_V42_25.md \
            docs/TECH_DEBT_CLOSURE_V42_25.md \
            docs/frontend-legacy-audit.md | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "unexpected docs-sync change set"
            printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi
          grep -q 'Cleaning frontend queue/progress truth CLOSED' docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -q '736b2acdbf2560be657011035de173cde67517d0' docs/CODEX_CURRENT_STATE.md
          grep -q '34793457920' docs/frontend-legacy-audit.md
          grep -q 'storage import and deployment-test queue/progress truth' docs/FRONTEND_OWNER_MAP_V42_25.md
          test "$(cat VERSION.txt)" = '42.24.0'
      - name: Commit authority docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/TECH_DEBT_CLOSURE_V42_25.md \
            docs/CODEX_CURRENT_STATE.md \
            docs/frontend-legacy-audit.md \
            docs/FRONTEND_OWNER_MAP_V42_25.md
          git diff --cached --check
          git commit -m "docs: close cleaning frontend queue truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
