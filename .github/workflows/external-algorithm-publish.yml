name: External Algorithm Publish

# Focused contract: platform model-asset storage, idempotent remote registration, and UI wiring.
on:
  pull_request:
    paths:
      - app.py
      - platform_core/external_algorithm_publish.py
      - platform_core/model_artifacts.py
      - platform_core/integration_audit.py
      - static/main.mjs
      - static/index.html
      - static/modules/external-algorithm-publish.js
      - static/modules/model-artifact-runtime.js
      - static/modules/algorithm-list-runtime.js
      - tests/unit/test_external_algorithm_publish.py
      - tests/unit/test_model_artifacts.py
      - tests/unit/test_integration_audit.py
      - tests/frontend/external-algorithm-publish.test.mjs
      - tests/frontend/model-artifact-runtime.test.mjs
      - .github/workflows/external-algorithm-publish.yml
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - app.py
      - platform_core/external_algorithm_publish.py
      - platform_core/model_artifacts.py
      - platform_core/integration_audit.py
      - static/main.mjs
      - static/index.html
      - static/modules/external-algorithm-publish.js
      - static/modules/model-artifact-runtime.js
      - static/modules/algorithm-list-runtime.js
      - tests/unit/test_external_algorithm_publish.py
      - tests/unit/test_model_artifacts.py
      - tests/unit/test_integration_audit.py
      - tests/frontend/external-algorithm-publish.test.mjs
      - tests/frontend/model-artifact-runtime.test.mjs
      - .github/workflows/external-algorithm-publish.yml

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring
      - name: Backend external-publish and model-asset contracts
        run: |
          PYTHONPATH=. pytest -q --confcutdir=tests/unit \
            tests/unit/test_external_algorithm_publish.py \
            tests/unit/test_model_artifacts.py \
            tests/unit/test_integration_audit.py
      - name: Frontend external-publish contracts
        run: |
          node --test \
            tests/frontend/external-algorithm-publish.test.mjs \
            tests/frontend/model-artifact-runtime.test.mjs
      - name: Syntax and wiring guards
        run: |
          python -m py_compile app.py platform_core/external_algorithm_publish.py platform_core/model_artifacts.py platform_core/integration_audit.py
          node --check static/modules/external-algorithm-publish.js
          node --check static/modules/model-artifact-runtime.js
          node --check static/modules/algorithm-list-runtime.js
          grep -q "external_algorithm_publish_router" app.py
          grep -q "request_external_auto_publish_if_enabled" app.py
          grep -q "installExternalAlgorithmPublishRuntime" static/main.mjs
          grep -q "installModelArtifactRuntime" static/main.mjs
          grep -q "external-algorithm-auto-publish" platform_core/external_algorithm_publish.py
          grep -q "auto-upload-worker" platform_core/external_algorithm_publish.py
          grep -q "external_version_publications" platform_core/external_algorithm_publish.py
          grep -q "_remote_version_analysis_id" platform_core/external_algorithm_publish.py
          grep -q "_assert_current_compute_platform" platform_core/external_algorithm_publish.py
          grep -q "EXTERNAL_COMPUTE_PLATFORM_MAPPING_STALE" platform_core/external_algorithm_publish.py
          grep -q "test_publish_config_rejects_stale_compute_platform_mapping" tests/unit/test_external_algorithm_publish.py
          grep -q "test_publish_fails_closed_if_compute_platform_mapping_becomes_stale_after_save" tests/unit/test_external_algorithm_publish.py
          grep -q 'data-external-publish-automation="1"' static/modules/external-algorithm-publish.js
          grep -q "算力环境来自最近一次新畅联主数据同步" static/modules/external-algorithm-publish.js
          grep -q "require_analysis_identity" platform_core/external_algorithm_publish.py
          grep -q "_canonical_chip_code(discovered.get(\"chip_code\") or mapping.get(\"chip_code\") or \"\")" platform_core/external_algorithm_publish.py
          grep -q "test_multi_analysis_version_recovery_matches_analysis_identity" tests/unit/test_external_algorithm_publish.py
          grep -q "test_multi_analysis_timeout_does_not_recover_version_without_analysis_identity" tests/unit/test_external_algorithm_publish.py
          grep -q "test_multiple_rockchip_artifacts_keep_each_conversion_chip_identity" tests/unit/test_external_algorithm_publish.py
          grep -q "chip_identity = _canonical_chip_code(chip)" platform_core/external_algorithm_publish.py
          grep -q "key = (target, chip_identity, digest)" platform_core/external_algorithm_publish.py
          grep -Fq 'len({row["source_sha256"] for row in artifacts}) == 1' tests/unit/test_external_algorithm_publish.py
          grep -Fq 'chip_code TEXT NOT NULL DEFAULT' platform_core/model_artifacts.py
          grep -Fq 'ON model_artifacts(' platform_core/model_artifacts.py
          grep -Fq 'project_id, algorithm_id, version_id, target, chip_code, sha256' platform_core/model_artifacts.py
          grep -Fq 'identity = (target, chip_code, digest)' platform_core/model_artifacts.py
          grep -Fq 'test_same_sha_rockchip_artifacts_remain_distinct_by_chip' tests/unit/test_model_artifacts.py
          grep -Fq 'test_repository_migrates_legacy_identity_index_to_chip_scope' tests/unit/test_model_artifacts.py
          grep -q "芯片编码（转换产物优先）" static/modules/external-algorithm-publish.js
          grep -q "model_artifacts" platform_core/model_artifacts.py
          grep -q "storage-test" platform_core/external_algorithm_publish.py
          grep -q "run-auto" platform_core/external_algorithm_publish.py
          grep -q "registerDecorator('external-algorithm-publish'" static/modules/external-algorithm-publish.js
          grep -q "模型资产存储" static/modules/model-artifact-runtime.js
          grep -q "畅联云交互日志" static/modules/model-artifact-runtime.js
          if grep -q "window.renderAlg412 =" static/modules/external-algorithm-publish.js; then echo "external publish must not wrap renderAlg412" >&2; exit 1; fi
          test ! -e tools/_one_shot_model_asset_integration.py
          test ! -e .github/workflows/_one_shot_model_asset_integration.yml
          test "$(cat VERSION.txt)" = "42.24.0"
