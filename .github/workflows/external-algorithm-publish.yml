name: External Algorithm Publish

# Focused contract: platform model-asset storage, idempotent remote registration, and UI wiring.
on:
  pull_request:
    paths:
      - app.py
      - platform_core/external_algorithm_publish.py
      - platform_core/algorithms.py
      - platform_core/algorithm_sql_store.py
      - platform_core/training_tasks.py
      - platform_core/model_artifacts.py
      - platform_core/integration_audit.py
      - static/main.mjs
      - static/index.html
      - static/modules/external-algorithm-publish.js
      - static/modules/model-artifact-runtime.js
      - static/modules/algorithm-list-runtime.js
      - tests/unit/test_external_algorithm_publish.py
      - tests/unit/test_algorithm_sql_store.py
      - tests/integration/test_training_task_worker.py
      - tests/unit/test_algorithms.py
      - tests/unit/test_model_artifacts.py
      - tests/unit/test_integration_audit.py
      - tests/frontend/external-algorithm-publish.test.mjs
      - tests/browser/external-algorithm-publish.spec.mjs
      - tests/frontend/model-artifact-runtime.test.mjs
      - .github/workflows/external-algorithm-publish.yml
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - app.py
      - platform_core/external_algorithm_publish.py
      - platform_core/algorithms.py
      - platform_core/algorithm_sql_store.py
      - platform_core/training_tasks.py
      - platform_core/model_artifacts.py
      - platform_core/integration_audit.py
      - static/main.mjs
      - static/index.html
      - static/modules/external-algorithm-publish.js
      - static/modules/model-artifact-runtime.js
      - static/modules/algorithm-list-runtime.js
      - tests/unit/test_external_algorithm_publish.py
      - tests/unit/test_algorithm_sql_store.py
      - tests/integration/test_training_task_worker.py
      - tests/unit/test_algorithms.py
      - tests/unit/test_model_artifacts.py
      - tests/unit/test_integration_audit.py
      - tests/frontend/external-algorithm-publish.test.mjs
      - tests/browser/external-algorithm-publish.spec.mjs
      - tests/frontend/model-artifact-runtime.test.mjs
      - .github/workflows/external-algorithm-publish.yml

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring
      - name: Backend external-publish and model-asset contracts
        run: |
          PYTHONPATH=. pytest -q --confcutdir=tests/unit \
            tests/unit/test_external_algorithm_publish.py \
            tests/unit/test_algorithms.py \
            tests/unit/test_model_artifacts.py \
            tests/unit/test_integration_audit.py \
            tests/unit/test_algorithms.py
      - name: Frontend external-publish contracts
        run: |
          node --test \
            tests/frontend/external-algorithm-publish.test.mjs \
            tests/frontend/model-artifact-runtime.test.mjs
      - name: Artifact storage capability contract guard
        run: |
          grep -Fq 'def test_artifact_storage(' platform_core/model_artifacts.py
          grep -Fq 'service.model_assets.test_artifact_storage(' platform_core/external_algorithm_publish.py
          grep -Fq ').test_storage(source_id)' app.py
          grep -Fq 'self.bucket.get_bucket_info()' platform_core/storage/oss.py
          if grep -Fq 'list_buckets' platform_core/model_artifacts.py; then
            echo 'artifact storage test must not require ListBuckets' >&2
            exit 1
          fi
          grep -Fq 'test_artifact_storage_allows_bucket_info_access_denied_after_object_roundtrip' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_treats_non_accessdenied_bucket_metadata_failure_as_diagnostic' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_metadata_failure_does_not_hide_put_failure' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_put_403_reports_write_permission' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_stat_403_reports_read_permission' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_get_403_reports_read_permission' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_delete_403_reports_delete_permission' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_public_url_403_fails_changlian_filepath' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_storage_full_bucket_and_object_permissions_pass' tests/unit/test_model_artifacts.py
          grep -Fq 'test_generic_storage_health_contract_still_blocks_bucket_metadata_access_denied' tests/unit/test_model_artifacts.py
          grep -Fq 'def save_artifact_oss_config(' platform_core/model_artifacts.py
          grep -Fq 'ARTIFACT_OSS_SOURCE_ID = "model_artifact_oss"' platform_core/model_artifacts.py
          grep -Fq '@router.put("/api/v64/model-artifacts/oss-config")' platform_core/external_algorithm_publish.py
          grep -Fq 'test_artifact_oss_config_is_standalone_from_material_storage' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_oss_config_blank_credentials_preserve_existing_secret' tests/unit/test_model_artifacts.py
          grep -Fq 'test_artifact_oss_first_save_requires_own_credentials_without_legacy_oss' tests/unit/test_model_artifacts.py
          grep -Fq 'test_purge_algorithm_deletes_remote_objects_and_canonical_rows' tests/unit/test_model_artifacts.py
          grep -Fq 'def purge_algorithm(self, project_id: str, algorithm_id: str)' platform_core/model_artifacts.py
          grep -Fq "usage||'')!=='model_artifact'" static/app.js
      - name: Syntax and wiring guards
        run: |
          python -m py_compile app.py platform_core/external_algorithm_publish.py platform_core/algorithms.py platform_core/model_artifacts.py platform_core/integration_audit.py
          node --check static/modules/external-algorithm-publish.js
          node --check static/modules/model-artifact-runtime.js
          node --check static/modules/algorithm-list-runtime.js
          grep -q "external_algorithm_publish_router" app.py
          grep -q "request_external_auto_publish_if_enabled" app.py
          grep -q "installExternalAlgorithmPublishRuntime" static/main.mjs
          grep -q "installModelArtifactRuntime" static/main.mjs
          grep -q "external-algorithm-auto-publish" platform_core/external_algorithm_publish.py
          grep -q "auto-upload-worker" platform_core/external_algorithm_publish.py
          grep -q "external_version_publications" platform_core/external_algorithm_publish.py
          grep -q "_remote_version_analysis_id" platform_core/external_algorithm_publish.py
          grep -q "_assert_current_external_identity" platform_core/external_algorithm_publish.py
          grep -q "EXTERNAL_VERSION_ANALYSIS_STALE" platform_core/external_algorithm_publish.py
          grep -q '"identity_ready": bool(identity\["ready"\])' platform_core/external_algorithm_publish.py
          grep -q "test_publication_status_blocks_stale_changlian_master_data" tests/unit/test_external_algorithm_publish.py
          grep -q "test_publish_endpoint_defaults_and_legacy_config_use_internal_algorithm_namespace" tests/unit/test_external_algorithm_publish.py
          grep -q "test_remote_id_accepts_official_scalar_data_ids" tests/unit/test_external_algorithm_publish.py
          grep -Fq 'test_publication_repository_delete_algorithm_cascades_version_and_weight_mappings' tests/unit/test_external_algorithm_publish.py
          grep -Fq 'def delete_algorithm(' platform_core/external_algorithm_publish.py
          grep -Fq 'return self.version_create(payload)' platform_core/external_algorithm_publish.py
          grep -Fq 'return self.version_list_by_product(product_id)' platform_core/external_algorithm_publish.py
          grep -Fq 'return self.weight_create(payload)' platform_core/external_algorithm_publish.py
          grep -Fq 'return self.weight_list_by_version(algo_version_id)' platform_core/external_algorithm_publish.py
          grep -Fq '"/internal/algorithm/algorithm-version/listByProduct/{productId}"' platform_core/external_algorithm_publish.py
          grep -Fq '"/internal/algorithm/algorithm-weight/listByVersion/{algoVersionId}"' platform_core/external_algorithm_publish.py
          grep -q "test_publish_blocks_when_historical_version_analysis_is_no_longer_current" tests/unit/test_external_algorithm_publish.py
