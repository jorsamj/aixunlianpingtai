name: Storage Cache Governance

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - 'platform_core/storage/**'
      - 'static/modules/storage.js'
      - 'static/modules/storage-cache-runtime.js'
      - 'static/index.html'
      - 'tests/unit/storage/**'
      - 'tests/frontend/storage-*.test.mjs'
      - '.github/workflows/storage-cache-governance.yml'
      - 'docs/STORAGE_CACHE_AND_OBJECT_IMMUTABILITY.md'
  pull_request:
    paths:
      - 'platform_core/storage/**'
      - 'static/modules/storage.js'
      - 'static/modules/storage-cache-runtime.js'
      - 'static/index.html'
      - 'tests/unit/storage/**'
      - 'tests/frontend/storage-*.test.mjs'
      - '.github/workflows/storage-cache-governance.yml'
      - 'docs/STORAGE_CACHE_AND_OBJECT_IMMUTABILITY.md'

jobs:
  storage-cache-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest filelock boto3 oss2 requests pyyaml pillow keyring

      - name: Run storage cache and object-store unit guards
        run: >-
          python -m pytest -q
          tests/unit/storage/test_material_cache.py
          tests/unit/storage/test_material_cache_lifecycle.py
          tests/unit/storage/test_optional_providers.py
          tests/unit/storage/test_object_store_immutability.py
          tests/unit/storage/test_source_repository.py

      - name: Run storage frontend guards
        run: >-
          node --test
          tests/frontend/storage-source-ui.test.mjs
          tests/frontend/storage-policy-payload.test.mjs
          tests/frontend/storage-cache-runtime.test.mjs

      - name: Guard cache lifecycle and immutable object contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MATERIAL_CACHE_MAX_BYTES' platform_core/storage/cache.py
          grep -q 'MATERIAL_CACHE_TTL_SECONDS' platform_core/storage/cache.py
          grep -q 'status.json' platform_core/storage/cache.py
          grep -q 'protect_existing_objects' platform_core/storage/oss.py
          grep -q 'x-oss-forbid-overwrite' platform_core/storage/oss.py
          grep -q 'IfNoneMatch="\*"' platform_core/storage/s3.py
          grep -q 'storage-cache-runtime.js?v=422525' static/index.html
          grep -q '外部变更需重新扫描' static/modules/storage-cache-runtime.js
          grep -q '当前节点素材内容缓存' static/modules/storage-cache-runtime.js
          test "$(tr -d '\r\n' < VERSION.txt)" = '42.24.0'
