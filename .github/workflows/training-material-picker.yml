name: Training Material Picker

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - 'platform_core/training_material_picker_api.py'
      - 'platform_core/training_recovery_api.py'
      - 'platform_core/material_repository.py'
      - 'static/modules/training-material-picker-runtime.js'
      - 'static/modules/training-material-summary-runtime.js'
      - 'static/modules/training-labels.js'
      - 'static/main.mjs'
      - 'tests/api/test_training_material_picker_api.py'
      - 'tests/api/test_training_material_selection_summary_api.py'
      - 'tests/frontend/training-material-picker-runtime.test.mjs'
      - 'tests/frontend/training-material-summary-runtime.test.mjs'
      - 'tests/frontend/training-labels.test.mjs'
      - 'tests/browser/training-material-picker-performance.spec.mjs'
      - 'tests/browser/training-page-material-summary.spec.mjs'
      - '.github/workflows/training-material-picker.yml'
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi httpx uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest
      - name: Compile picker backend
        run: python -m py_compile platform_core/training_material_picker_api.py platform_core/training_recovery_api.py
      - name: Backend paging thumbnail and summary contracts
        run: >-
          python -m pytest -q
          tests/api/test_training_material_picker_api.py
          tests/api/test_training_material_selection_summary_api.py
      - name: Frontend syntax and contracts
        run: >-
          node --check static/modules/training-material-picker-runtime.js &&
          node --check static/modules/training-material-summary-runtime.js &&
          node --check static/modules/training-labels.js &&
          node --check static/main.mjs &&
          node --test
          tests/frontend/training-material-picker-runtime.test.mjs
          tests/frontend/training-material-summary-runtime.test.mjs
          tests/frontend/training-labels.test.mjs
      - name: Permanent picker guards
        run: |
          grep -Fq 'DEFAULT_PAGE_SIZE = 60' static/modules/training-material-picker-runtime.js
          grep -Fq 'THUMBNAIL_EAGER_COUNT = 15' static/modules/training-material-picker-runtime.js
          grep -Fq 'THUMBNAIL_PRELOAD_MARGIN = 120' static/modules/training-material-picker-runtime.js
          grep -Fq 'repeat(5,minmax(0,1fr))' static/modules/training-material-picker-runtime.js
          grep -Fq 'aspect-ratio:4/3' static/modules/training-material-picker-runtime.js
          grep -Fq 'height:clamp(420px,60vh,620px)' static/modules/training-material-picker-runtime.js
          grep -Fq 'overflow-y:auto!important' static/modules/training-material-picker-runtime.js
          grep -Fq 'getBoundingClientRect()' static/modules/training-material-picker-runtime.js
          grep -Fq 'requestAnimationFrame' static/modules/training-material-picker-runtime.js
          grep -Fq "addEventListener('scroll', scheduleVisibleThumbnailWindow" static/modules/training-material-picker-runtime.js
          grep -Fq 'data-src="${esc(thumbnail)}"' static/modules/training-material-picker-runtime.js
          grep -Fq '/training-materials/bulk-selection' static/modules/training-material-picker-runtime.js
          grep -Fq "bulkSelectionOwner: 'server'" static/modules/training-material-picker-runtime.js
          grep -Fq 'trainingMaterialSelectionPatch' static/modules/training-material-picker-runtime.js
          grep -Fq 'trainingDraftRuntime.update(patch)' static/modules/training-material-picker-runtime.js
          if grep -Fq 'legacyConfirm' static/modules/training-material-picker-runtime.js; then
            echo 'training material picker must not wrap the legacy confirm owner' >&2
            exit 1
          fi
          if grep -Fq 'IntersectionObserver' static/modules/training-material-picker-runtime.js; then
            echo 'training picker must use deterministic bounded-scroll thumbnail loading' >&2
            exit 1
          fi
          grep -Fq '/training-materials/selection-summary' static/modules/training-material-summary-runtime.js
          grep -Fq "FULL_MATERIAL_PAGES.delete('训练任务')" static/main.mjs
          grep -Fq 'materialSummaryRuntime: trainingMaterialSummaryRuntime' static/main.mjs
          grep -Fq 'materialSummaryRuntime.summaryReadyFor' static/modules/training-labels.js
          if grep -Fq '/api/projects/${' static/modules/training-material-picker-runtime.js && grep -Fq '/images' static/modules/training-material-picker-runtime.js; then
            echo 'training picker must not restore whole-pool /images hydration' >&2
            exit 1
          fi
          grep -Fq 'DEFAULT_PAGE_SIZE = 60' platform_core/training_material_picker_api.py
          grep -Fq 'DEFAULT_THUMBNAIL_SIZE = 192' platform_core/training_material_picker_api.py
          grep -Fq '@lru_cache(maxsize=128)' platform_core/training_material_picker_api.py
          grep -Fq '@router.post("/bulk-selection")' platform_core/training_material_picker_api.py
          grep -Fq 'include_total=first' platform_core/training_material_picker_api.py
          grep -Fq 'annotated=True' platform_core/training_material_picker_api.py
          grep -Fq 'repository.list_page' platform_core/training_material_picker_api.py
          grep -Fq 'repository.iter_filtered_ids' platform_core/training_material_picker_api.py
          grep -Fq 'requested_training_material_ids' platform_core/training_material_picker_api.py

  real-chrome-picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome paged training material truth
        run: >-
          npx playwright test
          tests/browser/training-material-picker-performance.spec.mjs
          tests/browser/training-page-material-summary.spec.mjs
