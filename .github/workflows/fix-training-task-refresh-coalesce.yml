name: Fix training task refresh coalescing

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/fix_training_task_refresh_coalesce.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded refresh coalescing patch
        run: python scripts/fix_training_task_refresh_coalesce.py
      - name: Verify scoped diff
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            static/index.html \
            static/main.mjs \
            static/modules/poll-registry.js \
            static/modules/training-task-runtime.js \
            tests/browser/training-task-performance.spec.mjs \
            tests/frontend/training-task-runtime.test.mjs | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Syntax and focused unit tests
        run: |
          node --check static/modules/training-task-runtime.js
          node --check static/modules/poll-registry.js
          node --check static/main.mjs
          node --test tests/frontend/training-task-runtime.test.mjs tests/frontend/poll-registry.test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/index.html static/main.mjs static/modules/poll-registry.js static/modules/training-task-runtime.js tests/browser/training-task-performance.spec.mjs tests/frontend/training-task-runtime.test.mjs
          git commit -m "fix(ui): coalesce training task refresh races"
          git push origin HEAD:refactor/frontend-runtime-stabilization
