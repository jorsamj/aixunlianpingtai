name: Algorithm SQL CRUD One Shot

on:
  push:
    branches:
      - feature/external-algorithm-publishing-sql-crud
    paths:
      - tools/migrate_algorithm_sql_row_crud.py
      - tools/fix_algorithm_sql_row_crud.py
      - .github/workflows/algorithm-sql-crud-one-shot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply row-level SQL CRUD migration
        run: |
          python tools/migrate_algorithm_sql_row_crud.py
          python tools/fix_algorithm_sql_row_crud.py
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring pillow
      - name: Syntax checks
        run: |
          python -m py_compile platform_core/algorithm_sql_store.py platform_core/algorithms.py platform_core/external_algorithm_platform.py platform_core/external_algorithm_publish.py
          node --check static/modules/external-algorithm-platform.js
          node --check static/modules/external-algorithm-publish.js
      - name: Algorithm SQL and mutation contracts
        run: |
          PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_algorithm_sql_store.py tests/unit/test_algorithms.py
      - name: External platform contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_platform.py
      - name: External publish contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_publish.py
      - name: Frontend contracts
        run: |
          node --test tests/frontend/external-algorithm-platform.test.mjs
          node --test tests/frontend/external-algorithm-publish.test.mjs
      - name: Invariants
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -q 'def attach_version(self, algorithm_id' platform_core/algorithm_sql_store.py
          grep -q 'sync_external_algorithms' platform_core/algorithm_sql_store.py
          grep -q 'AlgorithmSqlStore(Path(path)).attach_version' platform_core/algorithms.py
          grep -q 'merged\["id"\] = algorithm_id' platform_core/algorithm_sql_store.py
          ! grep -q 'save_algorithms(algorithms_path, algorithms)' platform_core/external_algorithm_platform.py
      - name: Commit permanent code only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform_core/algorithm_sql_store.py platform_core/algorithms.py platform_core/external_algorithm_platform.py tests/unit/test_algorithm_sql_store.py tests/unit/test_algorithms.py
          git diff --cached --quiet && { echo 'no CRUD diff produced' >&2; exit 1; }
          git commit -m 'refactor(algorithms): use row-level SQL transactions'
          git push
