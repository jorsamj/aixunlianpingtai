name: Retire Setup Page Polling Shells

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_setup_page_polling_shells.py
      - .github/workflows/retire-setup-page-polling-shells.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/retire_setup_page_polling_shells.py
      - name: Verify focused polling contracts
        run: |
          node --check static/app.js
          node --check static/modules/poll-registry.js
          node --check static/modules/navigation-stability.js
          node --test tests/frontend/poll-registry.test.mjs tests/frontend/training-task-runtime.test.mjs tests/frontend/navigation-stability.test.mjs
          if grep -F -n 'setupPagePolling' static/app.js; then
            echo 'setupPagePolling shell remains in active app.js' >&2
            exit 1
          fi
          if grep -F -n 'jobPollTimer' static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js; then
            echo 'retired training timer compatibility returned' >&2
            exit 1
          fi
          grep -Fq 'window.PollRegistryRuntime?.replaceTrainingJobTimer?.()' static/app.js
          grep -Fq 'Training PollRegistry direct owner guard' .github/workflows/frontend-runtime-stabilization.yml
          grep -Fq '/static/app.js?v=42.25.49' static/index.html
      - name: Commit migrated files
        run: |
          if git diff --quiet -- static/app.js static/index.html .github/workflows/frontend-runtime-stabilization.yml; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html .github/workflows/frontend-runtime-stabilization.yml
          git commit -m 'refactor(ui): retire setupPagePolling shells'
          git push
