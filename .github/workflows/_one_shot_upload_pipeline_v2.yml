name: One Shot Upload Pipeline V2

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'tools/_one_shot_upload_pipeline_v2.py'
      - 'tools/_one_shot_upload_pipeline_v2_fix.py'
      - '.github/workflows/_one_shot_upload_pipeline_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-algorithm-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest filelock
      - name: Correct helper patch scope
        run: python tools/_one_shot_upload_pipeline_v2_fix.py
      - name: Apply precise patch
        run: python tools/_one_shot_upload_pipeline_v2.py
      - name: Syntax checks
        run: |
          python -m py_compile app.py platform_core/zip_multipart.py platform_core/storage/import_tasks.py
          node --check static/app.js
          node --check static/main.mjs
          node --check static/modules/upload-task-center.js
          node --check static/modules/zip-import-runtime.js
          node --check static/modules/material-upload-runtime.js
          node --check static/modules/storage-import-progress.js
          node --check static/modules/training-submit.js
      - name: Backend focused contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_zip_multipart.py
      - name: Frontend focused contracts
        run: |
          node --test \
            tests/frontend/upload-task-center.test.mjs \
            tests/frontend/zip-import-durable-runtime.test.mjs \
            tests/frontend/zip-multipart-upload.test.mjs \
            tests/frontend/storage-import-progress.test.mjs \
            tests/frontend/training-task-identity.test.mjs \
            tests/frontend/training-submit.test.mjs \
            tests/frontend/material-upload-runtime.test.mjs
      - name: Guard requested behavior
        shell: bash
        run: |
          grep -q 'class V19MultipartUploadReq' app.py
          grep -q 'ZipMultipartRepository' app.py
          grep -q 'INDEX_BATCH_SIZE = 50' platform_core/storage/import_tasks.py
          grep -q 'uploadZipMultipartJob' static/modules/zip-import-runtime.js
          grep -q 'UploadTaskCenterRuntime' static/modules/storage-import-progress.js
          grep -q 'id="tr429TaskId"' static/app.js
          grep -q 'payload.task_id = plannedTaskId' static/modules/training-submit.js
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app.py \
            platform_core/zip_multipart.py \
            platform_core/storage/import_tasks.py \
            static/app.js \
            static/main.mjs \
            static/modules/upload-task-center.js \
            static/modules/zip-import-runtime.js \
            static/modules/material-upload-runtime.js \
            static/modules/storage-import-progress.js \
            static/modules/training-submit.js \
            tests/unit/test_zip_multipart.py \
            tests/frontend/upload-task-center.test.mjs \
            tests/frontend/zip-multipart-upload.test.mjs \
            tests/frontend/training-task-identity.test.mjs
          if git diff --cached --quiet; then
            echo "No production patch to commit"
          else
            git commit -m "feat: accelerate ZIP upload and expose durable task progress"
            git push origin HEAD:feature/external-algorithm-publishing
          fi
