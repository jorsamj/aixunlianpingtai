name: Upgrade Training Progress V2

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/upgrade_training_progress_v2.py
      - .github/workflows/upgrade-training-progress-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Training Progress v2
        run: python tools/upgrade_training_progress_v2.py
      - name: Syntax
        run: |
          python -m py_compile platform_core/training_metrics.py train_worker.py tests/unit/test_training_progress_v2.py
          node --check static/modules/training-task-runtime.js
          node --check static/main.mjs
          node --check tests/frontend/training-progress-v2.test.mjs
      - name: Frontend training progress contracts
        run: node --test tests/frontend/training-task-runtime.test.mjs tests/frontend/training-progress-v2.test.mjs
      - name: Install focused Python test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Training metrics and worker progress contracts
        run: python -m pytest -q tests/unit/test_training_progress_v2.py tests/unit/test_training_metrics_fd.py tests/unit/test_training_resource_contract.py
      - name: Verify release and cache boundaries
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          grep -F "training-task-runtime.js?v=422505" static/main.mjs
          grep -F "/static/main.mjs?v=42.25.92" static/index.html
          git diff --check
      - name: Commit validated product slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/training_metrics.py train_worker.py static/modules/training-task-runtime.js static/main.mjs static/index.html tests/unit/test_training_progress_v2.py tests/frontend/training-progress-v2.test.mjs
          git diff --cached --check
          git commit -m "feat(training): expose truthful epoch progress"
          git push origin HEAD:refactor/frontend-runtime-stabilization
