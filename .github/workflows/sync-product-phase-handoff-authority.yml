name: Sync Product Phase Handoff Authority

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_product_phase_handoff_authority.py
      - .github/workflows/sync-product-phase-handoff-authority.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Align five authority handoff docs
        run: python tools/sync_product_phase_handoff_authority.py
      - name: Verify authority markers and release boundary
        run: |
          grep -q "Unified Task Progress Phase 1" AGENTS.md
          grep -q "Unified Task Progress Phase 1" docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -q "Unified Task Progress Phase 1" docs/CODEX_CURRENT_STATE.md
          grep -q "Unified Task Progress Phase 1" docs/frontend-legacy-audit.md
          grep -q "Unified Task Progress Phase 1" docs/FRONTEND_OWNER_MAP_V42_25.md
          grep -q "Phase 2" AGENTS.md
          grep -q "Phase 2" docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -q "Phase 2" docs/CODEX_CURRENT_STATE.md
          grep -q "Phase 2" docs/frontend-legacy-audit.md
          grep -q "Phase 2" docs/FRONTEND_OWNER_MAP_V42_25.md
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit docs and remove one-shot sync artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git rm tools/sync_product_phase_handoff_authority.py .github/workflows/sync-product-phase-handoff-authority.yml
          git diff --cached --check
          git commit -m "docs: align product phase handoff authority"
          git push origin HEAD:refactor/frontend-runtime-stabilization
