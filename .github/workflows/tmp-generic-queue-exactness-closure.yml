name: Temporary Generic Queue Exactness Closure

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/tmp_generic_queue_exactness_patch.py
      - .github/workflows/tmp-generic-queue-exactness-closure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-generic-queue-exactness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml filelock requests psutil
      - name: Apply generic queue exactness patch
        run: python scripts/tmp_generic_queue_exactness_patch.py
      - name: Compile backend contract
        run: >-
          python -m py_compile
          platform_core/task_runtime/public.py
          platform_core/material_batches.py
          app.py
          tests/unit/task_runtime/test_public_projection.py
      - name: Backend queue truth guards
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/task_runtime/test_public_projection.py
          tests/unit/test_training_job_projection.py
      - name: Frontend queue truth guards
        run: >-
          node --test
          tests/frontend/task-runtime-truth.test.mjs
          tests/frontend/task-poller.test.mjs
          tests/frontend/training-task-runtime.test.mjs
          tests/frontend/annotation-task-view.test.mjs
          tests/frontend/phase2-task-truth.test.mjs
          tests/frontend/storage-import-progress.test.mjs
          tests/frontend/server-material-import.test.mjs
          tests/frontend/video-tasks.test.mjs
          tests/frontend/deployment-task-view.test.mjs
          tests/frontend/resource-discovery-runtime-truth.test.mjs
      - name: Diff safety check
        run: git diff --check
      - name: Commit product closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app.py \
            platform_core/task_runtime/public.py \
            platform_core/material_batches.py \
            static/modules/annotation-task-view.js \
            static/modules/material-batches.js \
            tests/unit/task_runtime/test_public_projection.py \
            tests/frontend/annotation-task-view.test.mjs \
            tests/frontend/phase2-task-truth.test.mjs \
            docs/CODEX_HANDOFF_2026-09-16_GENERIC_QUEUE_EXACTNESS.md
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix(runtime): prove generic durable queue positions"
          git push origin HEAD:refactor/frontend-runtime-stabilization
