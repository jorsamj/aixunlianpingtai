name: Temporary Training Startup Phase2 Patch

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-training-startup-phase2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode and apply exact patch
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/startup_phase2_patch.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64'])))
          PY
          python /tmp/startup_phase2_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify startup phase2
        run: |
          python -m py_compile train_worker.py platform_core/training_tasks.py platform_core/training_hardened_tasks.py
          python -m pytest -q tests/unit/test_training_startup_performance_contract.py tests/unit/test_portable_dataset.py tests/unit/test_training_bundle_isolation.py tests/unit/test_training_final_validation_oom_hardening.py

      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(training): reduce bundle startup io and expose worker stages"
          git push origin HEAD:refactor/frontend-runtime-stabilization
