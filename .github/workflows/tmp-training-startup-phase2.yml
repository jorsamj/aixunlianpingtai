name: Temporary Training Startup Phase2 Patch

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-training-startup-phase2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply startup phase2 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              Path(path).write_text(text.replace(old, new, 1), encoding='utf-8')

          training_tasks = Path('platform_core/training_tasks.py')
          train_worker = Path('train_worker.py')
          hardened = Path('platform_core/training_hardened_tasks.py')
          tests = Path('tests/unit/test_training_startup_performance_contract.py')

          replace_once(training_tasks,
          '''def _atomic_text(path: Path, text: str) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    descriptor, name = tempfile.mkstemp(dir=path.parent, prefix=f".{path.name}.", suffix=".tmp")\n    temporary = Path(name)\n    try:\n        with os.fdopen(descriptor, "w", encoding="utf-8", newline="") as stream:\n            stream.write(text)\n            stream.flush()\n            os.fsync(stream.fileno())\n        os.replace(temporary, path)\n    finally:\n        temporary.unlink(missing_ok=True)\n''',
          '''def _atomic_text(path: Path, text: str, *, durable: bool = True) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    descriptor, name = tempfile.mkstemp(dir=path.parent, prefix=f".{path.name}.", suffix=".tmp")\n    temporary = Path(name)\n    try:\n        with os.fdopen(descriptor, "w", encoding="utf-8", newline="") as stream:\n            stream.write(text)\n            stream.flush()\n            if durable:\n                os.fsync(stream.fileno())\n        os.replace(temporary, path)\n    finally:\n        temporary.unlink(missing_ok=True)\n''')

          replace_once(training_tasks,
          '''    *,\n    bundle_root: Path | None = None,\n) -> None:\n''',
          '''    *,\n    bundle_root: Path | None = None,\n    durable: bool = True,\n) -> None:\n''')

          replace_once(training_tasks,
