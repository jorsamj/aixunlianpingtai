          replace_once(train_worker,
          '''        del allocation\n        train_args["device"] = args.device\n''',
          '''        del allocation\n        publish_startup_stage(job_file, "runtime_device_validated", "训练设备校验完成", 23)\n        train_args["device"] = args.device\n''')

          replace_once(train_worker,
          '''        model = YOLO(actual_model)\n        resolved = resolve_resources({**train_args, "device": runtime_device, "resource_strategy": args.resource_strategy}, resource_context, model, torch)\n''',
          '''        publish_startup_stage(job_file, "loading_model", "加载训练模型", 24)\n        model = YOLO(actual_model)\n        publish_startup_stage(job_file, "resolving_resources", "计算 Batch / Workers / Cache", 25)\n        resolved = resolve_resources({**train_args, "device": runtime_device, "resource_strategy": args.resource_strategy}, resource_context, model, torch)\n''')

          replace_once(train_worker,
          '''        telemetry.start()\n        gate_events=[]\n''',
          '''        telemetry.start()\n        publish_startup_stage(job_file, "initializing_trainer", "初始化训练器与数据加载器", 26)\n        gate_events=[]\n''')

          replace_once(train_worker,
          '''        def attach_resource_callbacks(target, effective_args=None):\n            runtime_args = dict(effective_args or train_args)\n            def verify_runtime(trainer):\n                telemetry.on_train_start(trainer)\n                if str(trainer.device) != runtime_device:\n                    raise RuntimeError(f"TRAINING_DEVICE_RUNTIME_MISMATCH: expected={runtime_device}; actual={trainer.device}")\n                evidence.update(runtime_device=str(trainer.device), effective_args=dict(runtime_args))\n                update_job(job_file, actual_device=assigned, device_evidence=evidence, actual_train_params=runtime_args)\n            target.add_callback("on_train_start", verify_runtime)\n            target.add_callback("on_train_epoch_start", telemetry.on_epoch_start)\n''',
          '''        def attach_resource_callbacks(target, effective_args=None):\n            runtime_args = dict(effective_args or train_args)\n            first_batch_seen = False\n\n            def pretrain_start(_trainer):\n                publish_startup_stage(job_file, "initializing_dataloader", "初始化训练数据加载器", 27)\n\n            def verify_runtime(trainer):\n                telemetry.on_train_start(trainer)\n                if str(trainer.device) != runtime_device:\n                    raise RuntimeError(f"TRAINING_DEVICE_RUNTIME_MISMATCH: expected={runtime_device}; actual={trainer.device}")\n                evidence.update(runtime_device=str(trainer.device), effective_args=dict(runtime_args))\n                publish_startup_stage(\n                    job_file,\n                    "trainer_ready",\n                    "训练器初始化完成，等待首个 Batch",\n                    28,\n                    actual_device=assigned,\n                    device_evidence=evidence,\n                    actual_train_params=runtime_args,\n                )\n\n            def first_batch(_trainer):\n                nonlocal first_batch_seen\n                if first_batch_seen:\n                    return\n                first_batch_seen = True\n                publish_startup_stage(\n                    job_file,\n                    "first_batch",\n                    "首个 Batch 已开始",\n                    29,\n                    training_started=True,\n                    first_batch_at=now_iso(),\n                )\n\n            target.add_callback("on_pretrain_routine_start", pretrain_start)\n            target.add_callback("on_train_start", verify_runtime)\n            target.add_callback("on_train_batch_start", first_batch)\n            target.add_callback("on_train_epoch_start", telemetry.on_epoch_start)\n''')

          replace_once(train_worker,
          '''                train_args["batch"] = max(1, train_args["batch"] // 2)\n                train_args["workers"] = min(train_args["workers"], train_args["batch"])\n                resolved.update(resolved_batch=train_args["batch"], resolved_workers=train_args["workers"], oom_retries=retries)\n                resolved["reasons"].append(f"CUDA OOM retry {retries}/6: batch stepped down to {train_args['batch']}; same assigned GPU")\n''',
          '''                next_batch, next_workers = next_oom_retry_resources(\n                    train_args["batch"], train_args["workers"]\n                )\n                train_args["batch"] = next_batch\n                train_args["workers"] = next_workers\n                resolved.update(resolved_batch=train_args["batch"], resolved_workers=train_args["workers"], oom_retries=retries)\n                resolved["reasons"].append(\n                    f"CUDA OOM retry {retries}/6: batch stepped down to {train_args['batch']}; "\n                    f"workers retained at {train_args['workers']}; same assigned GPU"\n                )\n''')

          # Parent base runner: first batch is the boundary between startup and training.
          replace_once(training_tasks,
          '''                training_started = bool(job.get("current_epoch") or job.get("training_progress"))\n''',
          '''                training_started = bool(\n                    job.get("training_started") or job.get("current_epoch") or job.get("training_progress")\n                )\n''')

          # Production hardened runner previously reported all child startup as training.
          replace_once(hardened,
          '''                progress = float(job.get("progress_percent") or 20)\n                current = str(job.get("current_item") or job.get("current_epoch") or "") or None\n                context.repository.heartbeat(\n                    context.task.task_id,\n                    context.lease.lease_token,\n                    progress=max(20, min(95, progress)),\n                    stage="training",\n                    current_item=current,\n                )\n''',
          '''                progress = float(job.get("progress_percent") or 20)\n                current = str(job.get("current_item") or job.get("message") or job.get("current_epoch") or "") or None\n                training_started = bool(\n                    job.get("training_started") or job.get("current_epoch") or job.get("training_progress")\n                )\n                context.repository.heartbeat(\n                    context.task.task_id,\n                    context.lease.lease_token,\n                    progress=max(20, min(95, progress)),\n                    stage="training" if training_started else "trainer_startup",\n                    current_item=current,\n                )\n''')

          test_addition = r'''


def test_rebuildable_bundle_copy_can_defer_per_file_fsync(monkeypatch, tmp_path):
    source = tmp_path / "source.jpg"
    destination = tmp_path / "bundle" / "image.jpg"
    destination.parent.mkdir()
    payload = b"rebuildable-bundle" * 4096
    source.write_bytes(payload)

    import hashlib
    expected = hashlib.sha256(payload).hexdigest()
    monkeypatch.setattr(
        training_tasks.os,
        "fsync",
        lambda _fd: pytest.fail("rebuildable bundle copy should not fsync each image"),
    )

    training_tasks._copy_verified_isolated(
        source,
        destination,
        expected,
        durable=False,
    )
    assert destination.read_bytes() == payload


def test_materialization_uses_construction_evidence_instead_of_full_image_rehash(monkeypatch, tmp_path):
    source = tmp_path / "source.jpg"
    payload = b"image-payload" * 2048
    source.write_bytes(payload)

    import hashlib
    expected = hashlib.sha256(payload).hexdigest()
    snapshot = {
        "snapshot_id": "snapshot-startup-performance",
        "label_schema": [{"code": "smoke", "class_id": 0}],
        "images": [{"image_id": "img-1", "content_sha256": expected}],
        "ids": {"train": ["img-1"], "validation": [], "test": []},
    }
    row = {
        "id": "img-1",
        "filename": "source.jpg",
        "width": 100,
        "height": 100,
        "boxes": [{"label": "smoke", "x1": 10, "y1": 10, "x2": 40, "y2": 40}],
    }
    original_sha256 = training_tasks._sha256
    hashed_paths = []

    def tracked_sha256(path):
        resolved = Path(path).resolve()
        hashed_paths.append(resolved)
        return original_sha256(resolved)

    monkeypatch.setattr(training_tasks, "_sha256", tracked_sha256)
    root = training_tasks.materialize_portable_dataset(
        tmp_path / "work",
        snapshot,
        [row],
        lambda _row: source,
        safety_reserve_bytes=0,
    )

    bundle_image = (root / "dataset/images/train/img-1.jpg").resolve()
    assert bundle_image.is_file()
    assert bundle_image not in hashed_paths
    manifest = training_tasks._json(root / "manifest.json", {})
    assert manifest["construction_verification"]["image_integrity"] == "sha256_verified_during_materialization"


def test_oom_retry_keeps_workers_independent_from_batch():
    from train_worker import next_oom_retry_resources

    assert next_oom_retry_resources(8, 8) == (4, 8)
    assert next_oom_retry_resources(4, 8) == (2, 8)
    assert next_oom_retry_resources(2, 3) == (1, 3)


def test_startup_stage_contract_persists_first_batch_truth(tmp_path):
    from train_worker import publish_startup_stage, read_json

    job_file = tmp_path / "job.json"
    job_file.write_text("{}", encoding="utf-8")
    publish_startup_stage(
        job_file,
        "first_batch",
        "首个 Batch 已开始",
        29,
        training_started=True,
    )
    job = read_json(job_file, {})
    assert job["startup_stage"] == "first_batch"
    assert job["training_started"] is True
    assert job["current_item"] == "首个 Batch 已开始"
'''
          text = tests.read_text(encoding='utf-8')
          if 'test_rebuildable_bundle_copy_can_defer_per_file_fsync' in text:
              raise SystemExit('startup phase2 tests already present')
          tests.write_text(text + test_addition, encoding='utf-8')

          Path('.github/workflows/tmp-training-startup-phase2.yml').unlink()
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify startup phase2
        run: |
          python -m py_compile train_worker.py platform_core/training_tasks.py platform_core/training_hardened_tasks.py
          python -m pytest -q tests/unit/test_training_startup_performance_contract.py tests/unit/test_portable_dataset.py tests/unit/test_training_bundle_isolation.py tests/unit/test_training_final_validation_oom_hardening.py

      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(training): reduce bundle startup io and expose worker stages"
          git push origin HEAD:refactor/frontend-runtime-stabilization
