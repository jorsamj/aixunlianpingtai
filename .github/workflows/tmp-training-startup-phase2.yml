          '''def parse_cache(v):\n    text = str(v).strip()\n    low = text.lower()\n    if low in {"false", "0", "no", "off", "none", ""}:\n        return False\n    if low in {"true", "1", "yes", "on"}:\n        return True\n    if low in {"ram", "disk"}:\n        return low\n    raise ValueError("cache 只支持 False / True / ram / disk")\n\n\n''',
