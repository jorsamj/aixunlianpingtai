name: Fix Navigation Action Fencing R1 Paddle Render

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/fix_navigation_action_fencing_r1_paddle_render.py
      - .github/workflows/fix-navigation-action-fencing-r1-paddle-render.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focused test dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2

      - name: Apply guarded same-page follow-up
        run: python tools/fix_navigation_action_fencing_r1_paddle_render.py

      - name: Syntax check
        run: node --check static/app.js

      - name: Focused unit contracts
        run: node --test tests/frontend/navigation-action-fencing.test.mjs tests/frontend/training-server-refresh-owner.test.mjs

      - name: Existing Paddle Real Chrome contract
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "paddle environment activation keeps manual and quick-detect behavior"

      - name: Stale mutation Real Chrome contract
        run: npx playwright test tests/browser/navigation-action-fencing.spec.mjs

      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"

      - name: Commit product follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m "fix(navigation): keep Paddle activation on its current page"
          git push origin HEAD:refactor/frontend-runtime-stabilization
