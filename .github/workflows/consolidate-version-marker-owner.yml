name: Consolidate Version Marker Owner

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/consolidate_version_marker_owner.py
      - .github/workflows/consolidate-version-marker-owner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded version marker ownership consolidation
        run: python tools/consolidate_version_marker_owner.py
      - name: Verify focused version-marker contracts
        run: |
          node --check static/app.js
          node --check static/main.mjs
          node --check tests/frontend/version-marker-owner.test.mjs
          node --test tests/frontend/version-marker-owner.test.mjs tests/frontend/render-owner-retirement.test.mjs tests/frontend/navigation-stability.test.mjs tests/frontend/navigation-persistence.test.mjs
          if grep -F -n 'baseRender417' static/app.js; then
            echo 'baseRender417 remains' >&2
            exit 1
          fi
          if grep -F -n 'applyBuildVersion' static/main.mjs; then
            echo 'main.mjs visible build-version writer remains' >&2
            exit 1
          fi
          grep -Fq '<span id="versionBadge" class="version-badge">v42.24.0</span>' static/index.html
          grep -Fq '/static/app.js?v=42.25.66' static/index.html
          grep -Fq '/static/main.mjs?v=42.25.69' static/index.html
      - name: Commit version marker owner consolidation
        run: |
          if git diff --quiet -- static/app.js static/main.mjs static/index.html tests/frontend/version-marker-owner.test.mjs .github/workflows/frontend-runtime-stabilization.yml; then
            echo 'no version marker ownership changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/main.mjs static/index.html tests/frontend/version-marker-owner.test.mjs .github/workflows/frontend-runtime-stabilization.yml
          git commit -m 'refactor(ui): consolidate visible version marker owners'
          git push
