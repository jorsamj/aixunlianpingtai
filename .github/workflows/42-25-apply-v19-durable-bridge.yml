name: Apply 42.25 v19 durable bridge

on:
  push:
    branches:
      - feat/42.25.0
    paths:
      - .github/workflows/42-25-apply-v19-durable-bridge.yml
      - scripts/apply_v19_durable_bridge_patch.py

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/42.25.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install pytest pillow filelock psutil
      - name: Apply fail-closed compatibility patch
        run: python scripts/apply_v19_durable_bridge_patch.py
      - name: Compile bridge and app
        run: >-
          python -m py_compile
          app.py
          platform_core/storage/browser_v19_bridge.py
          platform_core/storage/browser_v19_entry.py
          platform_core/storage/optimized_import_tasks.py
      - name: Run browser bridge tests
        run: python -m pytest tests/unit/storage/test_browser_v19_bridge.py -q
      - name: Commit audited app change
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "perf: route browser yolo zip through durable worker"
          git push origin HEAD:feat/42.25.0
