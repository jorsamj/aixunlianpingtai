name: Add Unified Task Public Runtime

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_unified_task_public_runtime.py
      - .github/workflows/add-unified-task-public-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply unified task public runtime
        run: python tools/add_unified_task_public_runtime.py
      - name: Compile changed runtime
        run: |
          python -m py_compile platform_core/task_runtime/models.py platform_core/task_runtime/repository.py platform_core/task_runtime/public.py app.py
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest httpx
      - name: Task runtime unit contract
        run: python -m pytest -q tests/unit/task_runtime/test_repository.py tests/unit/task_runtime/test_public_projection.py
      - name: Unified task API contract
        run: python -m pytest -q tests/api/test_unified_task_runtime.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated product slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/task_runtime/models.py platform_core/task_runtime/repository.py platform_core/task_runtime/public.py platform_core/task_runtime/__init__.py app.py tests/unit/task_runtime/test_public_projection.py tests/api/test_unified_task_runtime.py
          git diff --cached --check
          git commit -m "feat(tasks): expose unified durable task truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
