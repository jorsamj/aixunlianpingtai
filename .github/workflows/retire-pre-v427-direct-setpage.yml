name: Retire Pre-v42.7 Direct setPage Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_pre_v427_direct_setpage.py
      - .github/workflows/retire-pre-v427-direct-setpage.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded retirement
        run: python tools/retire_pre_v427_direct_setpage.py
      - name: Verify syntax and focused navigation contracts
        run: |
          node --check static/app.js
          node --check static/main.mjs
          node --test tests/frontend/navigation-stability.test.mjs tests/frontend/navigation-persistence.test.mjs tests/frontend/ui-state.test.mjs tests/frontend/retired-sidebar-setpage-guard.test.mjs tests/frontend/retired-pre-v424-setpage-guard.test.mjs
          grep -Fq "window.setPage=function(p){state.page=p==='自动标注'?'自动标注及清洗':p;render()};try{setPage=window.setPage}catch(e){}" static/app.js
          grep -Fq 'window.setPage=async function(page){if(!state.uiReady&&window.__v53InitPromise)await window.__v53InitPromise;return setPageReady414(page)}' static/app.js
          grep -Fq 'window.setPage=function(page){window.toggleMobileSidebarV37?.(false);return baseSetPage417?.(page)}' static/app.js
          if grep -Fq 'window.setPage=function(p){state.page=p;render()};' static/app.js; then
            echo 'plain pre-v42.7 direct setPage owner remains' >&2
            exit 1
          fi
          if grep -Fq $'window.setPage=function(p){\n    state.page=p;\n    saveUiState();\n    render();\n  };' static/app.js; then
            echo 'v34 persistence setPage owner remains' >&2
            exit 1
          fi
          grep -Fq '/static/app.js?v=42.25.53' static/index.html
      - name: Commit retired owners
        run: |
          if git diff --quiet -- static/app.js static/index.html; then
            echo 'no retirement changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html
          git commit -m 'refactor(ui): retire pre-v42.7 direct setPage owners'
          git push
