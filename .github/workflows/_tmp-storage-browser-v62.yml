name: Temporary Storage Import Browser V62

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-storage-browser-v62.yml
      - .github/scripts/_tmp_patch_storage_browser_v62.py

permissions:
  contents: write

jobs:
  patch-and-browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact Real Chrome v62 fixture patch
        run: python .github/scripts/_tmp_patch_storage_browser_v62.py
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Focused Real Chrome storage import confirmation
        run: npx playwright test tests/browser/navigation-stability.spec.mjs -g "server storage import confirmation avoids broad related refresh"
      - name: Storage import unit contracts
        run: node --test tests/frontend/server-material-import.test.mjs tests/frontend/storage-import-progress.test.mjs
      - name: Version guard
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit permanent browser regression update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/navigation-stability.spec.mjs
          git diff --cached --check
          git commit -m "test(browser): follow durable storage import task truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
