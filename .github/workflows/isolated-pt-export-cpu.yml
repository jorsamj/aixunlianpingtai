name: Isolated Trusted PT to ONNX CPU Export

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'platform_core/os_supervisor_pt_export_cpu_systemd_pilot.py'
      - 'platform_core/os_supervisor_pt_official_source.py'
      - 'platform_core/os_supervisor_pt_export_rechecked_bridge.py'
      - 'tests/unit/test_os_supervisor_pt_export_cpu_systemd_pilot.py'
      - 'tests/unit/test_os_supervisor_pt_official_source.py'
      - 'tests/unit/test_os_supervisor_pt_export_rechecked_bridge.py'
      - 'tests/integration/test_os_supervisor_pt_export_cpu_systemd_live.py'
      - 'tests/integration/test_os_supervisor_pt_export_rechecked_bridge_live.py'
      - '.github/workflows/isolated-pt-export-cpu.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'platform_core/os_supervisor_pt_export_cpu_systemd_pilot.py'
      - 'platform_core/os_supervisor_pt_official_source.py'
      - 'platform_core/os_supervisor_pt_export_rechecked_bridge.py'
      - 'tests/unit/test_os_supervisor_pt_export_cpu_systemd_pilot.py'
      - 'tests/unit/test_os_supervisor_pt_official_source.py'
      - 'tests/unit/test_os_supervisor_pt_export_rechecked_bridge.py'
      - 'tests/integration/test_os_supervisor_pt_export_cpu_systemd_live.py'
      - 'tests/integration/test_os_supervisor_pt_export_rechecked_bridge_live.py'
      - '.github/workflows/isolated-pt-export-cpu.yml'

# This workflow is entirely separate from production task dispatch.
# It runs only in an ephemeral Ubuntu 24.04 GitHub-hosted VM.
permissions:
  contents: read

jobs:
  pt-export-cpu-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin CPU-only PyTorch and production-compatible Ultralytics
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'torch==2.5.0+cpu' 'torchvision==0.20.0+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            'ultralytics==8.4.127' 'numpy==2.2.6' \
            'onnx==1.19.0' 'onnxruntime==1.22.1' \
            'pytest' 'python-multipart' 'cryptography' 'fastapi' 'httpx' 'filelock' \
            'psutil' 'requests' 'keyring' 'pydantic' 'pyyaml'
          python - <<'PY'
          import torch, torchvision, ultralytics, onnx, onnxruntime, numpy
          assert torch.__version__ == '2.5.0+cpu', torch.__version__
          assert ultralytics.__version__ == '8.4.127'
          assert onnx.__version__ == '1.19.0'
          assert onnxruntime.__version__ == '1.22.1'
          assert numpy.__version__ == '2.2.6'
          assert not torch.cuda.is_available()
          print('TRUSTED_CPU_RUNTIME_PINNED', torch.__version__, ultralytics.__version__)
          PY
      - name: Install immutable root-owned isolated CPU runtime
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -d /run/systemd/system
          test -x /usr/bin/systemd-run
          test "$(id -u)" != '0'
          systemctl --version | head -1
          sudo -n install -d -o root -g root -m 0755 \
            /var/lib/changlian-pt-export-cpu-pilot
          sudo -n /usr/bin/python3 -m venv --without-pip \
            /var/lib/changlian-pt-export-cpu-pilot/venv
          source_site="$(python -c 'import site; print(site.getsitepackages()[0])')"
          runtime_site="/var/lib/changlian-pt-export-cpu-pilot/venv/lib/python3.12/site-packages"
          sudo -n cp -a "$source_site/." "$runtime_site/"
          sudo -n chown -R root:root /var/lib/changlian-pt-export-cpu-pilot
          sudo -n chmod -R go-w /var/lib/changlian-pt-export-cpu-pilot
          sudo -n /var/lib/changlian-pt-export-cpu-pilot/venv/bin/python3 -I -c \
            'import ultralytics,torch,onnx,onnxruntime,numpy; assert ultralytics.__version__=="8.4.127"; assert torch.__version__=="2.5.0+cpu"'
      - name: Offline fixed-argv contracts and forged evidence rejection
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m py_compile \
            platform_core/os_supervisor_pt_export_cpu_systemd_pilot.py \
            platform_core/os_supervisor_pt_official_source.py \
            platform_core/os_supervisor_pt_export_rechecked_bridge.py \
            tests/unit/test_os_supervisor_pt_export_cpu_systemd_pilot.py \
            tests/unit/test_os_supervisor_pt_official_source.py \
            tests/unit/test_os_supervisor_pt_export_rechecked_bridge.py \
            tests/integration/test_os_supervisor_pt_export_cpu_systemd_live.py \
            tests/integration/test_os_supervisor_pt_export_rechecked_bridge_live.py
          python -m pytest -q --maxfail=1 --confcutdir=tests/unit \
            tests/unit/test_os_supervisor_pt_export_cpu_systemd_pilot.py \
            tests/unit/test_os_supervisor_pt_export_rechecked_bridge.py \
            tests/unit/test_os_supervisor_pt_official_source.py
      - name: Retrieve exact code-pinned official YOLO11n checkpoint without loading PT
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-pinned-model
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 120 \
            --output /tmp/ci-pinned-model/yolo11n.pt \
            https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt
          python - <<'PY'
          from pathlib import Path
          from platform_core.mother_model_assets import _OFFICIAL_YOLO11_DETECT
          from platform_core.os_supervisor_pt_official_source import verify_local_pinned_official_pt
          length, sha = _OFFICIAL_YOLO11_DETECT["yolo11n.pt"]
          result = verify_local_pinned_official_pt(
              Path("/tmp/ci-pinned-model/yolo11n.pt"),
              source_name="yolo11n.pt", source_sha256=sha,
              source_size_bytes=length,
          )
          assert result.launch_authorized is False
          assert result.result_publish_allowed is False
          print("CI_PINNED_OFFICIAL_PT_VERIFIED", result.source_sha256, result.size_bytes)
          PY
          echo "CHANGLIAN_CI_PINNED_OFFICIAL_YOLO11N=/tmp/ci-pinned-model/yolo11n.pt" >> "$GITHUB_ENV"
      - name: Real trusted YOLO11n PT to ONNX in systemd DynamicUser
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo -n env CHANGLIAN_CI_PINNED_OFFICIAL_YOLO11N="${CHANGLIAN_CI_PINNED_OFFICIAL_YOLO11N:?}" \
            "$(command -v python)" -m pytest -vv --maxfail=1 \
            --confcutdir=tests/integration \
            tests/integration/test_os_supervisor_pt_export_cpu_systemd_live.py \
            tests/integration/test_os_supervisor_pt_export_rechecked_bridge_live.py \
            -s
