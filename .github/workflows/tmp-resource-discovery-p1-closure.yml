name: Temporary Resource Discovery P1 Closure

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-resource-discovery-p1-closure.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest filelock psutil

      - name: Apply exact product patch
        run: python scripts/tmp_resource_discovery_p1_patch.py

      - name: Compile discovery contract
        run: >-
          python -m py_compile
          app.py
          platform_core/resource_discovery/request_scope.py
          platform_core/resource_discovery/scanner.py
          platform_core/resource_discovery/tasks.py
          tests/unit/test_resource_discovery_scope_contract.py

      - name: Run focused backend contracts
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_resource_discovery_scope_contract.py
          tests/unit/test_resource_discovery_sqlite_lifecycle.py
          --junitxml=/tmp/resource-discovery-pytest.xml

      - name: Run focused frontend contract
        shell: bash
        run: |
          set -o pipefail
          node --test tests/frontend/resource-discovery-runtime-truth.test.mjs | tee /tmp/resource-discovery-node.tap

      - name: Record exact focused test counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          xml_root = ET.parse('/tmp/resource-discovery-pytest.xml').getroot()
          suite = xml_root if xml_root.tag == 'testsuite' else xml_root.find('testsuite')
          tests = int(suite.attrib.get('tests', 0))
          failures = int(suite.attrib.get('failures', 0))
          errors = int(suite.attrib.get('errors', 0))
          skipped = int(suite.attrib.get('skipped', 0))
          passed = tests - failures - errors - skipped

          tap = Path('/tmp/resource-discovery-node.tap').read_text(encoding='utf-8')
          def tap_count(name):
              match = re.search(rf'^# {name} (\d+)$', tap, re.MULTILINE)
              return int(match.group(1)) if match else -1

          node_tests = tap_count('tests')
          node_pass = tap_count('pass')
          node_fail = tap_count('fail')
          handoff = Path('docs/CODEX_HANDOFF_2026-09-16_RESOURCE_DISCOVERY_JPEG_NORMALIZATION_CLOSURE.md')
          with handoff.open('a', encoding='utf-8') as handle:
              handle.write(f'\n- Focused pytest: `{passed} passed`, `{skipped} skipped`, `{failures + errors} failed` (`{tests}` collected).\n')
              handle.write(f'- Focused frontend Node test: `{node_pass} passed`, `{node_fail} failed` (`{node_tests}` tests).\n')
          PY

      - name: Verify invariants and commit product patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          test ! -e scripts/tmp_resource_discovery_p1_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(discovery): expose frozen scan scope safely"
          git push origin HEAD:refactor/frontend-runtime-stabilization
