name: Migrate Deployment Queued Position Truth

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tests/frontend/conversion-unified-task-truth.test.mjs
      - tools/migrate_deployment_queued_position_truth.py
      - .github/workflows/migrate-deployment-queued-position-truth.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove old product is RED
        run: |
          set +e
          node --test tests/frontend/conversion-unified-task-truth.test.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Expected queued conversion position contract to fail before migration.'
            exit 1
          fi
          echo "Baseline RED proven with exit code $code."
      - name: Apply precise migration
        run: |
          python tools/migrate_deployment_queued_position_truth.py
          grep -q "\['queued','waiting_resource'\].includes(j.status)" static/app.js
      - name: Syntax and diff checks
        run: |
          node --check static/app.js
          git diff --check
      - name: Focused deployment GREEN
        run: >-
          node --test
          tests/frontend/conversion-unified-task-truth.test.mjs
          tests/frontend/deployment-artifact-refresh.test.mjs
          tests/frontend/deployment-runtime-source.test.mjs
      - name: Formal version boundary
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit product migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js
          git diff --cached --check
          git commit -m 'fix(deploy): show queued resource position truth'
          git push origin HEAD:refactor/frontend-runtime-stabilization
