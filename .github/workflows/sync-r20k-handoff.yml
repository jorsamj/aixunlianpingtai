name: Sync R20k Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20k_handoff.py
      - .github/workflows/sync-r20k-handoff.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded R20k handoff synchronization
        run: python tools/sync_r20k_handoff.py
      - name: Verify release boundary and accepted state
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq 'f51d44c089b6342398c14bd38c8669747adad48b' AGENTS.md
          grep -Fq '34700252041' docs/CODEX_CURRENT_STATE.md
          grep -Fq '32/32' docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -Fq 'Resource Discovery SQLite / FD' docs/frontend-legacy-audit.md || true
      - name: Commit authority docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/CODEX_CURRENT_STATE.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md
          git diff --cached --quiet && { echo 'No docs changes'; exit 1; }
          git commit -m "docs: synchronize R20k accepted handoff"
          git push origin HEAD:refactor/frontend-runtime-stabilization
