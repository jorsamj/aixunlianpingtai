name: Retire Shadowed renderBase424 Routes

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_shadowed_render424_routes.py
      - .github/workflows/retire-shadowed-render424-routes.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded renderBase424 branch retirement
        run: python tools/retire_shadowed_render424_routes.py
      - name: Verify focused render contracts
        run: |
          node --check static/app.js
          node --check tests/frontend/render-owner-retirement.test.mjs
          node --test tests/frontend/render-owner-retirement.test.mjs tests/frontend/render-alias-restore.test.mjs tests/frontend/navigation-stability.test.mjs tests/frontend/navigation-persistence.test.mjs
          python - <<'PY'
          from pathlib import Path
          app = Path('static/app.js').read_text(encoding='utf-8')
          live = """  const renderBase424=render;
            render=function(){
              renderNav();renderTop();renderSummary();
              if(state.page==='质量中心'){renderQualityCenter424();return}
              if(state.page==='视频切帧'){renderVideo424();return}
              // algorithm/data/training routes are owned by later stable wrappers.
              renderBase424();
            };
          """
          if live not in app:
              raise SystemExit('reduced live renderBase424 wrapper missing')
          required = [
              "render=function(){renderNav();renderTop();renderSummary();if(state.page==='算法列表'){renderAlgorithms423();return}if(state.page==='数据集'){renderDatasets424();return}oldRender412()};",
              "render=function(){if(state.page==='训练任务'){renderNav();renderTop();renderSummary();renderTraining423();return}renderBase428()};",
          ]
          for owner in required:
              if owner not in app:
                  raise SystemExit(f'later route owner missing: {owner[:64]}')
          PY
          grep -Fq '/static/app.js?v=42.25.64' static/index.html
      - name: Commit retired renderBase424 branches
        run: |
          if git diff --quiet -- static/app.js static/index.html tests/frontend/render-owner-retirement.test.mjs; then
            echo 'no renderBase424 branch retirement changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/render-owner-retirement.test.mjs
          git commit -m 'refactor(ui): retire shadowed render424 routes'
          git push
