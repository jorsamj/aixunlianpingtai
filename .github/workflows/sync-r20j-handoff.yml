name: Sync R20j Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20j_handoff.py
      - .github/workflows/sync-r20j-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded R20j handoff synchronization
        run: python tools/sync_r20j_handoff.py
      - name: Verify release boundary and accepted state
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq '9c7a3497b9acf69364d83e5cf778ec4139bdbc69' AGENTS.md
          grep -Fq '34699599796' docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -Fq '42.25.86' docs/CODEX_CURRENT_STATE.md
          grep -Fq 'R20j' docs/frontend-legacy-audit.md
          grep -Fq 'R20j' docs/FRONTEND_OWNER_MAP_V42_25.md
          grep -Fq 'R20k' docs/CODEX_CURRENT_STATE.md
      - name: Commit authority docs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --name-status
          git commit -m 'docs: synchronize R20j accepted handoff'
          git push
