name: Temporary Training Terminal RED

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-training-terminal-red.yml
      - tests/api/test_training_terminal_runtime.py
      - tests/unit/test_training_early_stopping_reason.py
      - tests/frontend/training-terminal-completion.test.mjs

jobs:
  training-terminal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Terminal elapsed and durable-state RED
        id: runtime
        continue-on-error: true
        run: python -m pytest --noconftest -q tests/api/test_training_terminal_runtime.py
      - name: Explicit patience stop-reason RED
        id: reason
        continue-on-error: true
        run: python -m pytest --noconftest -q tests/unit/test_training_early_stopping_reason.py
      - name: Terminal frontend RED
        id: frontend
        continue-on-error: true
        run: node --test tests/frontend/training-terminal-completion.test.mjs
      - name: Confirm RED coverage
        run: |
          echo "runtime=${{ steps.runtime.outcome }} reason=${{ steps.reason.outcome }} frontend=${{ steps.frontend.outcome }}"
          test "${{ steps.runtime.outcome }}" = "failure"
          test "${{ steps.reason.outcome }}" = "failure"
          test "${{ steps.frontend.outcome }}" = "failure"
      - name: Version guard
        if: always()
        run: test "$(cat VERSION.txt)" = "42.24.0"
