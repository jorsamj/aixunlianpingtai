name: Temporary Completed Deployment Recovery RED

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-completed-deployment-recovery-red.yml

jobs:
  recovery-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest psutil
      - name: Reproduce completed deployment recovery gap
        run: python -m pytest --noconftest -q tests/integration/test_completed_deployment_recovery.py
