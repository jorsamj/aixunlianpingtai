name: Temporary Completed Deployment Recovery GREEN

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-completed-deployment-recovery-red.yml

jobs:
  recovery-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest psutil filelock pyyaml
      - name: Syntax check
        run: python -m py_compile platform_core/deployment/conversion_tasks.py platform_core/deployment/inference_tasks.py
      - name: Completed deployment recovery contracts
        run: python -m pytest --noconftest -q tests/integration/test_completed_deployment_recovery.py
      - name: Formal version guard
        run: test "$(cat VERSION.txt)" = "42.24.0"
