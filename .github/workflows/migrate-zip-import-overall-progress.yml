name: Migrate ZIP Import Overall Progress

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-zip-import-overall-progress.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove legacy ZIP progress is RED
        run: |
          if node --test tests/frontend/zip-import-overall-progress.test.mjs; then
            echo 'legacy product unexpectedly satisfies ZIP overall progress contract' >&2
            exit 1
          fi
      - name: Apply precise progress migration
        run: python tools/migrate_zip_import_overall_progress.py
      - name: Syntax and focused GREEN
        run: |
          node --check static/app.js
          node --test tests/frontend/zip-import-overall-progress.test.mjs
      - name: Full frontend unit regression
        run: node --test tests/frontend/*.test.mjs
      - name: Formal version boundary
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit product migration
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js
          if git diff --cached --quiet; then
            echo 'No product migration to commit.'
            exit 0
          fi
          git commit -m 'fix(import): keep ZIP progress monotonic across phases'
          git push origin HEAD:refactor/frontend-runtime-stabilization
