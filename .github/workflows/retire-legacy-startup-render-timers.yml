name: Retire Legacy Startup Render Timers

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_legacy_startup_render_timers.py
      - .github/workflows/retire-legacy-startup-render-timers.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser-test backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded startup timer retirement
        run: python tools/retire_legacy_startup_render_timers.py
      - name: Verify focused static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/startup-render-owner.test.mjs tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/navigation-stability.test.mjs tests/frontend/version-marker-owner.test.mjs
          grep -Fq 'queueMicrotask(()=>{if(window.__clInit)window.__clInit()});' static/app.js
          grep -Fq 'window.__clInit=function(){if(window.__v53InitPromise)return window.__v53InitPromise;' static/app.js
          grep -Fq '/static/app.js?v=42.25.72' static/index.html
      - name: Verify startup and training request behavior
        run: |
          npx playwright test tests/browser/navigation-readiness.spec.mjs
          npx playwright test tests/browser/training-task-performance.spec.mjs --repeat-each=5
      - name: Commit startup timer retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/startup-render-owner.test.mjs
          git commit -m 'refactor(ui): retire legacy startup render timers'
          git push
