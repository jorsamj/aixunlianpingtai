name: Migrate Fenced Task Monotonic Progress

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-fenced-task-monotonic-progress.yml
      - tools/migrate_fenced_task_monotonic_progress.py
      - tests/unit/task_runtime/test_fenced_progress_monotonicity.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline production fenced progress contract must be RED
        run: |
          set +e
          python -m pytest -q tests/unit/task_runtime/test_fenced_progress_monotonicity.py > /tmp/fenced-progress-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/fenced-progress-red.log
          test "$rc" = "1"
          grep -Eq "FAILED|assert 55|55.0" /tmp/fenced-progress-red.log
      - name: Apply precise production heartbeat progress migration
        run: python tools/migrate_fenced_task_monotonic_progress.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile platform_core/task_runtime/fenced_repository.py tools/migrate_fenced_task_monotonic_progress.py tests/unit/task_runtime/test_fenced_progress_monotonicity.py
          git diff --check
      - name: Focused base and production monotonic progress contracts
        run: >-
          python -m pytest -q
          tests/unit/task_runtime/test_progress_monotonicity.py
          tests/unit/task_runtime/test_fenced_progress_monotonicity.py
      - name: Unified task and fencing regressions
        run: >-
          python -m pytest -q
          tests/unit/task_runtime/test_repository.py
          tests/unit/task_runtime/test_scheduler.py
          tests/unit/task_runtime/test_fencing.py
          tests/unit/task_runtime/test_resource_fencing.py
          tests/unit/task_runtime/test_gpu_recovery_fencing.py
          tests/api/test_unified_task_runtime.py
          tests/api/test_training_unified_task_overlay.py
          tests/api/test_annotation_unified_task_truth.py
          tests/api/test_conversion_unified_task_truth.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/task_runtime/fenced_repository.py
          git diff --cached --check
          git commit -m "fix(tasks): fence progress against stale heartbeats"
          git push origin HEAD:refactor/frontend-runtime-stabilization
