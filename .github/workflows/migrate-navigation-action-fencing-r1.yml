name: Migrate Navigation Action Fencing R1

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tests/frontend/navigation-action-fencing.test.mjs
      - tests/browser/navigation-action-fencing.spec.mjs
      - tools/migrate_navigation_action_fencing_r1.py
      - .github/workflows/migrate-navigation-action-fencing-r1.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install focused test dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2

      - name: Prove old code is red in unit contract
        shell: bash
        run: |
          test ! "$(grep -F -c 'action(ownerPage = currentState().page)' static/modules/navigation-stability.js || true)" -gt 0
          grep -Fq "state.page='训练资源'" static/app.js
          set +e
          node --test tests/frontend/navigation-action-fencing.test.mjs | tee /tmp/action-fence-unit-baseline.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0 || { echo 'Unit baseline unexpectedly green; migration proof invalid'; exit 1; }
          grep -Fq 'navigation action fence commits only while its owner page epoch is current' /tmp/action-fence-unit-baseline.log

      - name: Prove stale mutation in Real Chrome before migration
        shell: bash
        run: |
          set +e
          npx playwright test tests/browser/navigation-action-fencing.spec.mjs | tee /tmp/action-fence-browser-baseline.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0 || { echo 'Browser baseline unexpectedly green; stale mutation proof invalid'; exit 1; }
          grep -Fq 'stale save completion closed or rewrote the new-page modal' /tmp/action-fence-browser-baseline.log

      - name: Apply guarded action fencing migration
        run: python tools/migrate_navigation_action_fencing_r1.py

      - name: Compile migrated frontend
        run: >-
          node --check static/app.js &&
          node --check static/modules/navigation-stability.js &&
          node --check static/main.mjs

      - name: Focused unit contracts
        run: node --test tests/frontend/navigation-action-fencing.test.mjs tests/frontend/navigation-stability.test.mjs

      - name: Focused Real Chrome action and navigation contracts
        run: npx playwright test tests/browser/navigation-action-fencing.spec.mjs tests/browser/navigation-stability.spec.mjs

      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"

      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js static/modules/navigation-stability.js static/main.mjs static/index.html .github/workflows/frontend-runtime-stabilization.yml
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m "fix(navigation): fence stale resource mutation completions"
          git push origin HEAD:refactor/frontend-runtime-stabilization
