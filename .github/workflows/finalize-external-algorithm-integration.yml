name: Finalize External Algorithm Integration

on:
  push:
    branches:
      - feature/external-algorithm-publishing-refine3
    paths:
      - tools/finalize_external_algorithm_integration.py
      - .github/workflows/finalize-external-algorithm-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final refinements
        run: python tools/finalize_external_algorithm_integration.py
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring
      - name: Syntax checks
        run: |
          python -m py_compile platform_core/external_algorithm_publish.py
          node --check static/modules/external-algorithm-platform.js
      - name: Backend publish contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_publish.py
      - name: Frontend platform contracts
        run: node --test tests/frontend/external-algorithm-platform.test.mjs
      - name: Permanent guards
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -q 'externalAlgorithmMapping' static/modules/external-algorithm-platform.js
          grep -q 'data-external-algorithm-detail' static/modules/external-algorithm-platform.js
          grep -q "legacyIndustry.hidden = true" static/modules/external-algorithm-platform.js
          grep -q 'version.get("external_analysis_id")' platform_core/external_algorithm_publish.py
      - name: Commit final refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform_core/external_algorithm_publish.py static/modules/external-algorithm-platform.js \
            tests/frontend/external-algorithm-platform.test.mjs tests/unit/test_external_algorithm_publish.py
          git diff --cached --quiet && { echo 'no final refinement diff produced' >&2; exit 1; }
          git commit -m 'fix(external): finish category detail and analysis binding'
          git push
