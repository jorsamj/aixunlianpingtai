name: Migrate Annotation SQLite Dataset Delete Atomicity

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-annotation-sqlite-dataset-delete-atomicity.yml
      - tools/migrate_annotation_sqlite_dataset_delete_atomicity.py
      - tests/api/test_annotation_sqlite_dataset_delete_atomicity.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline new SQLite atomicity contract must be RED
        run: |
          set +e
          python -m pytest -q tests/api/test_annotation_sqlite_dataset_delete_atomicity.py > /tmp/annotation-sqlite-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/annotation-sqlite-red.log
          test "$rc" = "1"
          grep -Eq "AttributeError|assert not repository.exists|delete_backup_count" /tmp/annotation-sqlite-red.log
      - name: Baseline historical JSON-shaped guards are RED
        run: |
          set +e
          python -m pytest -q tests/api/test_material_batching.py::test_image_batch_rejects_dataset_deleted_before_commit > /tmp/batching-red.log 2>&1
          batching=$?
          python -m pytest -q tests/api/test_material_selection_atomicity.py::test_delete_dataset_file_lock_failure_keeps_dataset_and_material > /tmp/selection-red.log 2>&1
          selection=$?
          set -e
          cat /tmp/batching-red.log
          cat /tmp/selection-red.log
          test "$batching" = "1"
          test "$selection" = "1"
      - name: Apply precise SQLite annotation deletion migration
        run: python tools/migrate_annotation_sqlite_dataset_delete_atomicity.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile app.py platform_core/annotation_repository.py \
            tests/api/test_annotation_sqlite_dataset_delete_atomicity.py \
            tests/api/test_material_batching.py tests/api/test_material_selection_atomicity.py
          git diff --check
      - name: SQLite dataset delete atomicity contracts
        run: >-
          python -m pytest -q
          tests/api/test_annotation_sqlite_dataset_delete_atomicity.py
          tests/api/test_material_batching.py
          tests/api/test_material_selection_atomicity.py
      - name: Annotation and ZIP import regressions
        run: >-
          python -m pytest -q
          tests/api/test_annotation_flow.py
          tests/api/test_v19_import_scalability.py
          tests/api/test_zip_processing_p1.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py platform_core/annotation_repository.py \
            tests/api/test_material_batching.py tests/api/test_material_selection_atomicity.py
          git diff --cached --check
          git commit -m "fix(annotations): make dataset deletion atomic with SQLite truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
