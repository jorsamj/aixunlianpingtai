name: Retire Video Poll Bridge

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_video_poll_bridge.py
      - .github/workflows/retire-video-poll-bridge.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/retire_video_poll_bridge.py
      - name: Verify focused video lifecycle contracts
        run: |
          node --check static/app.js
          node --check static/modules/poll-registry.js
          node --test tests/frontend/poll-registry.test.mjs
          if grep -F -n 'setTimeout(refreshVideo424Delta,2000)' static/app.js; then
            echo 'classic video renderer still owns polling timer creation' >&2
            exit 1
          fi
          if grep -F -n 'clearTimeout(state.video424Timer)' static/app.js; then
            echo 'classic video renderer still owns polling timer clearing' >&2
            exit 1
          fi
          if [ "$(grep -F -o 'window.PollRegistryRuntime?.replaceVideo424Timer?.()' static/app.js | wc -l)" -ne 2 ]; then
            echo 'video renderer and delta refresh must both hand lifecycle explicitly to PollRegistry' >&2
            exit 1
          fi
          for token in installVideo424CreationBridge __pollRegistryVideoWrapped originalRenderVideo424 wrappedRenderVideo424 originalRefreshVideo424 wrappedRefreshVideo424; do
            if grep -F -n "$token" static/modules/poll-registry.js; then
              echo "PollRegistry video wrapper compatibility remains: $token" >&2
              exit 1
            fi
          done
          grep -Fq 'replaceVideo424Timer();' static/modules/poll-registry.js
      - name: Commit migrated files
        run: |
          if git diff --quiet -- static/app.js static/modules/poll-registry.js tests/frontend/poll-registry.test.mjs; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/modules/poll-registry.js tests/frontend/poll-registry.test.mjs
          git commit -m 'refactor(ui): retire video polling wrapper bridge'
          git push
