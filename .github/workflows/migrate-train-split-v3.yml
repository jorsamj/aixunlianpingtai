name: Retire train-v3 split mirror

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-train-split-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded runtime retirement
        run: python scripts/retire_train_split_runtime.py
      - name: Verify scoped diff and syntax
        run: |
          test "$(git diff --name-only)" = "static/modules/training-draft-runtime.js"
          node --check static/modules/training-draft-runtime.js
          node --check static/modules/training-draft.js
      - name: Canonical split smoke test
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createTrainingDraft, trainingDraftFromLegacyState, trainingDraftToRequest, trainingInheritanceFromAlgorithm} from './static/modules/training-draft.js';
          import {installTrainingDraftRuntime} from './static/modules/training-draft-runtime.js';

          globalThis.document = {addEventListener(){}, removeEventListener(){}, getElementById(){return null;}, querySelectorAll(){return [];}};
          globalThis.window = {fetch: async () => ({ok: true})};
          const state = {
            train428AlgorithmId: 'alg-1',
            train429Selected: new Set(['legacy-wrong']),
            trainSplitV3: {mode: 'random_test_from_training_pool', train: new Set(['legacy-wrong']), test: new Set(), experiment: 99, validation: 88},
            train428Config: {},
            algorithms: [{id: 'alg-1', versions: []}],
            trainingDraft: createTrainingDraft({
              algorithmId: 'alg-1',
              materialIds: ['a', 'b'],
              testMaterialIds: ['t'],
              splitMode: 'independent_test_set',
              validationPercent: 17,
              newLabelCodes: ['fire'],
            }),
          };
          const runtime = installTrainingDraftRuntime({getState: () => state, createTrainingDraft, trainingDraftFromLegacyState, trainingDraftToRequest, trainingInheritanceFromAlgorithm});
          const draft = runtime.sync();
          assert.equal(Object.hasOwn(state, 'trainSplitV3'), false);
          assert.equal(draft.splitMode, 'independent_test_set');
          assert.deepEqual(draft.materialIds, ['a', 'b']);
          assert.deepEqual(draft.testMaterialIds, ['t']);
          assert.equal(draft.validationPercent, 17);
          runtime.destroy();
          NODE
      - name: Commit retired runtime mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/modules/training-draft-runtime.js
          git commit -m "refactor(ui): retire trainSplitV3 compatibility mirror"
          git push origin HEAD:refactor/frontend-runtime-stabilization
