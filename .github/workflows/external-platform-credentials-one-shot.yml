name: External Platform Credentials One Shot

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - tools/finalize_external_platform_credentials_ui.py
      - tools/fix_external_platform_connectivity_result.py
      - .github/workflows/external-platform-credentials-one-shot.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-algorithm-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring pillow pyyaml
      - name: Apply exact patch
        run: |
          python tools/finalize_external_platform_credentials_ui.py
          python tools/fix_external_platform_connectivity_result.py
      - name: Verify backend and frontend contracts
        run: |
          python -m py_compile platform_core/external_algorithm_platform.py
          node --check static/modules/external-algorithm-platform.js
          PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_platform.py
          node --test tests/frontend/external-algorithm-platform.test.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit durable implementation
        run: |
          if git diff --quiet -- platform_core/external_algorithm_platform.py static/modules/external-algorithm-platform.js tests/unit/test_external_algorithm_platform.py tests/frontend/external-algorithm-platform.test.mjs; then
            echo "No durable changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/external_algorithm_platform.py static/modules/external-algorithm-platform.js tests/unit/test_external_algorithm_platform.py tests/frontend/external-algorithm-platform.test.mjs
          git commit -m "feat: make changlian credentials configurable and testable"
          git push origin HEAD:feature/external-algorithm-publishing
