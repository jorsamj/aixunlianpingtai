name: Sync Deployment Inference Fencing Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/append_deployment_inference_fencing_docs.py
      - .github/workflows/sync-deployment-inference-fencing-docs.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append closure evidence
        run: python tools/append_deployment_inference_fencing_docs.py
      - name: Verify formal version boundary
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit authority docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record deployment inference process fencing closure"
          git push origin HEAD:refactor/frontend-runtime-stabilization
