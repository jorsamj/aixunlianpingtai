name: Optimize ZIP Import 10k

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/optimize_zip_import_10k.py
      - .github/workflows/optimize-zip-import-10k.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest httpx
      - name: Baseline prove final data import still reaches sync v18 owner
        run: |
          node - <<'NODE'
          const fs=require('fs');const app=fs.readFileSync('static/app.js','utf8');
          const s=app.lastIndexOf('window.importData=function(){');
          const e=app.indexOf('window.showImportTabV36=',s);
          if(s<0||e<=s)throw new Error('final v36 import owner not found');
          const owner=app.slice(s,e);
          if(!owner.includes('onclick="doImportData()"'))throw new Error('baseline no longer reaches doImportData');
          const d=app.indexOf('window.doImportData=');
          const de=app.indexOf('window.manageLabels=',d);
          if(d<0||de<=d||!app.slice(d,de).includes('/api/v18/projects/'))throw new Error('baseline v18 synchronous endpoint not proven');
          console.log('BASELINE: final data-page ZIP action reaches synchronous /api/v18 import');
          NODE
      - name: Baseline prove 10k candidate list lives in hot job JSON
        env:
          MC_TRAIN_DATA_DIR: ${{ runner.temp }}/zip-baseline
          MC_PLATFORM_VERSION: test
        run: |
          python - <<'PY'
          import json
          import app
          images=[{'path':f'images/train/image_{i:05d}.jpg','name':f'image_{i:05d}.jpg','split':'train','size_kb':1.0} for i in range(10000)]
          job={'id':'baseline10k','project_id':'p','dataset_id':'default','status':'running','images':images,'image_count':len(images)}
          app.v19_write_job('p',job)
          path=app.v19_job_file('p','baseline10k')
          persisted=json.loads(path.read_text(encoding='utf-8'))
          assert len(persisted['images'])==10000
          assert path.stat().st_size>500000
          print('BASELINE: hot job.json bytes=',path.stat().st_size)
          PY
      - name: Apply ZIP 10k optimization
        run: python tools/optimize_zip_import_10k.py
      - name: Syntax
        run: |
          python -m py_compile app.py tests/api/test_v19_import_scalability.py
          node --check static/app.js
          node --check tests/frontend/zip-import-10k.test.mjs
      - name: Frontend live-owner contracts
        run: node --test tests/frontend/zip-import-10k.test.mjs
      - name: Real 10k-member ZIP API contract
        run: python -m pytest -q tests/api/test_v19_import_scalability.py
      - name: Existing import and material regressions
        run: python -m pytest -q tests/api/test_server_material_import.py tests/api/test_storage_upload.py
      - name: Verify release and cache boundaries
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          grep -F '/static/app.js?v=42.25.95' static/index.html
          git diff --check
      - name: Commit validated ZIP scalability slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/app.js static/index.html tests/api/test_v19_import_scalability.py tests/frontend/zip-import-10k.test.mjs
          git diff --cached --check
          git commit -m "perf(import): scale ZIP jobs to 10k candidates"
          git push origin HEAD:refactor/frontend-runtime-stabilization
