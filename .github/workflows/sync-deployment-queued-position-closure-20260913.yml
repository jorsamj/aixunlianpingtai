name: Sync Deployment Queued Position Closure 20260913

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/sync-deployment-queued-position-closure-20260913.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified closure evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "2026-09-13 — Deployment queued resource-position truth CLOSED"
          common = """
          - RED contract commit: `11b39b96ee28107e222bf9204ffd5f986e72e9fc`.
          - RED→GREEN workflow: `34758458780` — legacy RED proven, focused deployment GREEN, syntax/diff checks PASS, formal version boundary PASS.
          - Product commit: `46cc645ac6d47e0b02a3440c2a3000062b19ba05`; precise product diff is one `static/app.js` queue-meta condition replacement only.
          - One-shot migration assets removed by `f1e6dad93adee5a8ead763294c5d4aa6b27d147f`.
          - Permanentized clean HEAD: `caaeae70098fce7a90a5cd2fbfce481b6f84c332`; Release trigger boundary now includes `static/app.js` and the permanent conversion queue-truth frontend contract.
          - Release Regression `34758615703`: runtime-contracts PASS and training-data-contracts PASS.
          - Navigation Action Fencing `34758615733`: PASS including Real Chrome stale-mutation contract.
          - Frontend Runtime Stabilization `34758615696`: frontend unit tests PASS, including `conversion-unified-task-truth.test.mjs`, and full Real Chrome runtime regressions PASS.
          - Queue semantics remain server-owned and resource-scoped. Both `queued` and `waiting_resource` deployment conversion rows now display the live durable `resource_queue_position`; `resource_wait_reason` remains shown only for `waiting_resource`. Existing 1.8s full polling and backend ordering/claim semantics were not changed.
          - `VERSION.txt` remains exactly `42.24.0`; migration helper/workflow are physically absent; no main merge, tag, release, or A800 RC was performed.
          """.strip()

          blocks = {
              Path("docs/TECH_DEBT_CLOSURE_V42_25.md"): f"\n\n## {marker}\n\n{common}\n",
              Path("docs/CODEX_CURRENT_STATE.md"): f"\n\n### {marker}\n\n{common}\n",
              Path("docs/frontend-legacy-audit.md"): f"\n\n### {marker}\n\n{common}\n",
              Path("docs/FRONTEND_OWNER_MAP_V42_25.md"): f"\n\n### {marker}\n\n{common}\n",
          }
          for path, block in blocks.items():
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          PY
      - name: Verify authority marker and version boundary
        run: |
          for f in docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md; do
            grep -q 'Deployment queued resource-position truth CLOSED' "$f"
          done
          test "$(cat VERSION.txt)" = "42.24.0"
          test ! -e tools/migrate_deployment_queued_position_truth.py
          test ! -e .github/workflows/migrate-deployment-queued-position-truth.yml
          git diff --check
      - name: Commit authority doc sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          if git diff --cached --quiet; then
            echo 'Authority docs already synchronized.'
            exit 0
          fi
          git commit -m 'docs(v42.25): record deployment queued-position closure'
          git push origin HEAD:refactor/frontend-runtime-stabilization
