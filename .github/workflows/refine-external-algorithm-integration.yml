name: Refine External Algorithm Integration

on:
  push:
    branches:
      - feature/external-algorithm-publishing-refine3
    paths:
      - tools/refine_external_algorithm_integration.py
      - .github/workflows/refine-external-algorithm-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused refinement
        run: python tools/refine_external_algorithm_integration.py
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring
      - name: Syntax checks
        run: |
          python -m py_compile app.py platform_core/external_algorithm_platform.py platform_core/external_algorithm_publish.py
          node --check static/modules/algorithm-list-runtime.js
          node --check static/modules/external-algorithm-platform.js
          node --check static/modules/external-algorithm-publish.js
          node --check static/modules/training-submit.js
      - name: Backend contracts
        run: |
          PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_platform.py
          PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_publish.py
      - name: Frontend contracts
        run: |
          node --test tests/frontend/algorithm-list-runtime.test.mjs
          node --test tests/frontend/external-algorithm-platform.test.mjs
          node --test tests/frontend/external-algorithm-publish.test.mjs
      - name: Permanent source guards
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -q "registerDecorator('external-algorithm-platform'" static/modules/external-algorithm-platform.js
          grep -q "registerDecorator('external-algorithm-publish'" static/modules/external-algorithm-publish.js
          grep -q "resolve_external_training_analysis" app.py
          grep -q 'external_analysis_id' app.py
          grep -q 'def diagnose' platform_core/external_algorithm_platform.py
          ! grep -q 'window.renderAlg412 =' static/modules/external-algorithm-platform.js
          ! grep -q 'window.renderAlg412 =' static/modules/external-algorithm-publish.js
          ! grep -q '下一阶段' static/modules/external-algorithm-platform.js
      - name: Commit refined implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py platform_core/external_algorithm_platform.py platform_core/external_algorithm_publish.py \
            static/modules/algorithm-list-runtime.js static/modules/external-algorithm-platform.js \
            static/modules/external-algorithm-publish.js static/modules/training-submit.js static/main.mjs static/index.html \
            tests/unit/test_external_algorithm_platform.py tests/frontend/external-algorithm-platform.test.mjs \
            tests/frontend/algorithm-list-runtime.test.mjs
          git diff --cached --quiet && { echo 'no refinement diff produced' >&2; exit 1; }
          git commit -m 'refactor(external): harden master data and publishing integration'
          git push
