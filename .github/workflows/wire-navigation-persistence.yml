name: Wire Navigation Persistence

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/wire_navigation_persistence.py
      - .github/workflows/wire-navigation-persistence.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded wiring
        run: python tools/wire_navigation_persistence.py
      - name: Verify navigation persistence contracts
        run: |
          node --check static/modules/navigation-stability.js
          node --check static/modules/ui-state.js
          node --check static/main.mjs
          node --test tests/frontend/navigation-stability.test.mjs tests/frontend/navigation-persistence.test.mjs tests/frontend/ui-state.test.mjs tests/frontend/retired-sidebar-setpage-guard.test.mjs tests/frontend/retired-pre-v424-setpage-guard.test.mjs
          grep -Fq "import {persistUiState} from './modules/ui-state.js?v=422500';" static/main.mjs
          grep -Fq 'persistNavigationState: currentState => persistUiState(currentState),' static/main.mjs
          grep -Fq '/static/main.mjs?v=42.25.54' static/index.html
          if grep -Fq 'delayedUrl2' tests/browser/navigation-stability.spec.mjs; then
            echo 'redundant delayedUrl2 test code remains' >&2
            exit 1
          fi
      - name: Commit wired files
        run: |
          if git diff --quiet -- static/main.mjs static/index.html tests/browser/navigation-stability.spec.mjs; then
            echo 'no wiring changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/main.mjs static/index.html tests/browser/navigation-stability.spec.mjs
          git commit -m 'fix(ui): make final navigation persist UI state'
          git push
