name: One-shot Secret GC Docs Update

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'tools/_one_shot_secret_gc_docs.py'
      - '.github/workflows/_one_shot_secret_gc_docs.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update handoff and bug audit
        run: python tools/_one_shot_secret_gc_docs.py
      - name: Verify documentation truth
        shell: bash
        run: |
          grep -Fq 'CLOSED — Headless Linux Secret 持久化' docs/PROJECT_HANDOFF_CURRENT.md
          grep -Fq 'CLOSED — Multipart session TTL / GC' docs/PROJECT_HANDOFF_CURRENT.md
          grep -Fq 'MC_SECRET_MASTER_KEY' docs/PROJECT_HANDOFF_CURRENT.md
          grep -Fq 'CLOSED-04 — Headless Linux 新畅联 Secret 安全持久化' docs/BUG_AUDIT_2026-09-17.md
          grep -Fq 'CLOSED-05 — Multipart session TTL / GC' docs/BUG_AUDIT_2026-09-17.md
          if grep -Fq '### OPEN-01 — Headless Linux 新畅联 Secret' docs/BUG_AUDIT_2026-09-17.md; then exit 1; fi
          if grep -Fq '### OPEN-02 — 未完成 multipart session' docs/BUG_AUDIT_2026-09-17.md; then exit 1; fi
          git diff --check
      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'jorsamj'
          git config user.email '50445927+jorsamj@users.noreply.github.com'
          git add docs/PROJECT_HANDOFF_CURRENT.md docs/BUG_AUDIT_2026-09-17.md
          if git diff --cached --quiet; then
            echo 'No documentation changes'
            exit 0
          fi
          git commit -m 'docs: close headless secrets and multipart GC'
          git push origin HEAD:feature/external-algorithm-publishing
