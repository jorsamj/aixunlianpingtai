name: Temporary Task Runtime Truth V2 Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/tmp_task_runtime_truth_v2_patch.py
      - .github/workflows/tmp-task-runtime-truth-v2-closure.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh durable current state
        run: python scripts/tmp_task_runtime_truth_v2_patch.py
      - name: Validate handoff diff
        run: git diff --check
      - name: Commit durable handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CODEX_CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "No handoff changes to commit"
            exit 0
          fi
          git commit -m "docs(runtime): record task truth v2 closure"
          git push origin HEAD:refactor/frontend-runtime-stabilization
