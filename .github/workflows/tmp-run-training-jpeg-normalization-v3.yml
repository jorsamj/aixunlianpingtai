name: Temporary Run Training JPEG Normalization Patch V3

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct patch anchor
        run: python .github/scripts/fix_training_jpeg_normalization_patch_anchor.py
      - name: Apply controlled patch
        run: python .github/scripts/fix_training_jpeg_normalization.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile changed runtime
        run: python -m py_compile platform_core/training_tasks.py platform_core/training_bundle_cache.py platform_core/snapshots.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/unit/test_training_bundle_isolation.py tests/unit/test_training_bundle_cache.py tests/unit/test_portable_dataset.py tests/unit/test_snapshots.py tests/unit/test_training_startup_performance_contract.py
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/training_tasks.py platform_core/training_bundle_cache.py platform_core/snapshots.py tests/unit/test_training_bundle_isolation.py tests/unit/test_training_bundle_cache.py tests/unit/test_snapshots.py .github/workflows/training-final-validation-hardening.yml
          git diff --cached --check
          git commit -m "fix(training): normalize trainer jpeg inputs safely"
          git push origin "HEAD:${GITHUB_REF_NAME}"
