name: Migrate R20e Model Config Prompt Refresh

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_r20e_model_config_prompt_refresh.py
      - .github/workflows/migrate-r20e-model-config-prompt-refresh.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/migrate_r20e_model_config_prompt_refresh.py
      - name: Fix generated wiring guard escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/frontend/model-config-prompt-refresh-owner.test.mjs')
          s=p.read_text(encoding='utf-8')
          start=s.index("test('final model configuration renderer still reaches the migrated mutation owners'")
          end=s.index('\n});', start)+4
          block='''test('final model configuration renderer still reaches the migrated mutation owners', () => {
            const finalRenderer = app.slice(app.lastIndexOf('window.renderModelConfigPageV35=function()'));
            assert.match(finalRenderer, /deleteModelConfigV35/);
            assert.equal(app.includes('onclick="savePromptTemplateV35('), true);
            assert.equal(app.includes('onclick="deletePromptTemplateV35('), true);
          });'''
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          PY
      - name: Verify static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/model-config-prompt-refresh-owner.test.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Verify focused Chrome contracts
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "model config delete keeps model configuration page consistent|prompt template save appears immediately|prompt template delete disappears immediately"
      - name: Commit R20e product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/browser/navigation-stability.spec.mjs tests/frontend/model-config-prompt-refresh-owner.test.mjs
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'refactor(ui): scope model config prompt mutations'
          git push origin HEAD:refactor/frontend-runtime-stabilization
