name: Sync R14 R15 Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r14_r15_docs.py
      - .github/workflows/sync-r14-r15-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize handoff ledgers
        run: python tools/sync_r14_r15_docs.py
      - name: Validate documentation update
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
          python - <<'PY'
          from pathlib import Path
          paths = [
              'docs/CODEX_CURRENT_STATE.md',
              'docs/frontend-legacy-audit.md',
              'docs/FRONTEND_OWNER_MAP_V42_25.md',
              'docs/TECH_DEBT_CLOSURE_V42_25.md',
          ]
          for path in paths:
              text = Path(path).read_text(encoding='utf-8')
              assert '34667776611' in text, path
              assert 'b6edea36296ab9548037457a124b4369776f6f5e' in text, path
              assert '<<<<<<<' not in text and '>>>>>>>' not in text, path
          PY
      - name: Commit ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md
          git diff --cached --quiet && { echo 'No docs changes'; exit 1; }
          git commit -m 'docs(ui): close R14 and R15 lifecycle debt'
          git push origin HEAD:refactor/frontend-runtime-stabilization
