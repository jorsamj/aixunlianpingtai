name: Sync R20l Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20l_handoff.py
      - .github/workflows/sync-r20l-handoff.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize handoff docs
        run: python tools/sync_r20l_handoff.py
      - name: Normalize only R20l-generated Markdown lines
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('docs/TECH_DEBT_CLOSURE_V42_25.md'),
              Path('docs/FRONTEND_OWNER_MAP_V42_25.md'),
          ]
          needles = (
              'f8356bcf5ec1ea128fb38db2820df38146b48cfd',
              '> Real Chrome: 33/33 passed',
              'One-shot R20l migration artifacts are physically deleted.',
          )
          for path in targets:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              for line in lines:
                  if any(needle in line for needle in needles):
                      newline = '\n' if line.endswith('\n') else ''
                      line = line.rstrip('\r\n').rstrip(' \t') + newline
                  out.append(line)
              path.write_text(''.join(out), encoding='utf-8')
          PY
      - name: Verify formal release state and R20l permanent contracts
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq '/static/app.js?v=42.25.91' static/index.html
          grep -Fq '/static/main.mjs?v=42.25.89' static/index.html
          test -f tests/frontend/source-import-completion-scope.test.mjs
          test -f tests/browser/source-import-completion-scope.spec.mjs
          grep -Fq 'tests/browser/source-import-completion-scope.spec.mjs' .github/workflows/frontend-runtime-stabilization.yml
          test ! -e tools/migrate_source_import_completion_scope_r20l.py
          test ! -e .github/workflows/migrate-source-import-completion-scope-r20l.yml
          git diff --check
      - name: Remove one-shot handoff sync artifacts
        run: |
          rm tools/sync_r20l_handoff.py
          rm .github/workflows/sync-r20l-handoff.yml
      - name: Commit synchronized handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A AGENTS.md docs tools .github/workflows
          if git diff --cached --quiet; then
            echo 'R20l handoff synchronization produced no changes' >&2
            exit 1
          fi
          git commit -m 'docs: synchronize R20l accepted handoff'
          git push origin HEAD:refactor/frontend-runtime-stabilization
