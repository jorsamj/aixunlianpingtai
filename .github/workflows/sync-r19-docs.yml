name: Sync R19 Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r19_docs.py
      - tools/fix_r19_docs_sync_anchor.py
      - .github/workflows/sync-r19-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix R19 sync anchor
        run: python tools/fix_r19_docs_sync_anchor.py
      - name: Synchronize R19 ledgers
        run: python tools/sync_r19_docs.py
      - name: Validate R19 ledgers and formal version
        run: |
          for f in docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md; do
            grep -Fq '34670989473' "$f"
            grep -Fq 'R19' "$f"
            grep -Fq '20/20' "$f"
          done
          grep -Fq 'ModalContentRuntime' docs/CODEX_CURRENT_STATE.md
          grep -Fq 'global reload / loadAll / loadRelated duplicate-request ownership audit' docs/TECH_DEBT_CLOSURE_V42_25.md
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Commit R19 ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md
          git diff --cached --quiet && { echo 'No docs changes'; exit 1; }
          git commit -m 'docs(ui): close R19 modal content ownership debt'
          git push origin HEAD:refactor/frontend-runtime-stabilization
