name: Consolidate Modal Content Owner

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/consolidate_modal_content_owner.py
      - tools/align_r19_modal_owner_guards.py
      - .github/workflows/consolidate-modal-content-owner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded modal-content migration
        run: python tools/consolidate_modal_content_owner.py
      - name: Align permanent guards to semantic modal owner
        run: python tools/align_r19_modal_owner_guards.py
      - name: Verify static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/file-input-beautification-owner.test.mjs tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/startup-render-owner.test.mjs tests/frontend/modal-content-owner.test.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Verify modal behavior contracts
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "modal file input beautification survives modal lifecycle ownership|modal table wrapping and first-field focus survive normalization ownership|base modal post-open content refresh stays functional"
      - name: Commit modal content owner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/file-input-beautification-owner.test.mjs tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/startup-render-owner.test.mjs tests/frontend/modal-content-owner.test.mjs
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'refactor(ui): consolidate modal content owner'
          git push origin HEAD:refactor/frontend-runtime-stabilization
