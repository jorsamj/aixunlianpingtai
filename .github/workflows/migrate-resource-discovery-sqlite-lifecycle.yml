name: Migrate Resource Discovery SQLite Lifecycle

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_resource_discovery_sqlite_lifecycle.py
      - tests/unit/test_resource_discovery_sqlite_lifecycle.py
      - .github/workflows/migrate-resource-discovery-sqlite-lifecycle.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2

      - name: Prove baseline is red before migration
        shell: bash
        run: |
          set +e
          python -m pytest --confcutdir=tests/unit -vv tests/unit/test_resource_discovery_sqlite_lifecycle.py | tee /tmp/resource-discovery-baseline.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0 || { echo 'Baseline unexpectedly green; migration proof invalid'; exit 1; }
          grep -Fq 'FAILED tests/unit/test_resource_discovery_sqlite_lifecycle.py::test_reopening_cache_does_not_reassert_wal_or_schema' /tmp/resource-discovery-baseline.log
          grep -Fq 'FAILED tests/unit/test_resource_discovery_sqlite_lifecycle.py::test_model_manifest_explicitly_closes_every_sqlite_connection' /tmp/resource-discovery-baseline.log

      - name: Apply guarded SQLite lifecycle migration
        run: python tools/migrate_resource_discovery_sqlite_lifecycle.py

      - name: Compile migrated modules
        run: python -m py_compile platform_core/resource_discovery/cache.py platform_core/resource_discovery/tasks.py

      - name: Focused lifecycle tests
        run: python -m pytest --confcutdir=tests/unit -q tests/unit/test_resource_discovery_sqlite_lifecycle.py tests/unit/test_portable_resource_discovery.py

      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"

      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/resource_discovery/cache.py platform_core/resource_discovery/tasks.py
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m "fix(resource): fence SQLite init and close manifest connections"
          git push origin HEAD:refactor/frontend-runtime-stabilization
