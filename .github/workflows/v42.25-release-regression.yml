name: v42.25 Release Regression

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/v42.25-release-regression.yml
      - a800_rc_acceptance.py
      - app.py
      - platform_core/deployment/inference_tasks.py
      - platform_core/gpu_resources.py
      - platform_core/task_runtime/repository.py
      - platform_core/task_runtime/fenced_repository.py
      - platform_core/task_runtime/process_control.py
      - platform_core/task_runtime/public.py
      - platform_core/task_runtime/worker_instances.py
      - platform_core/training_metrics.py
      - platform_core/video_tasks.py
      - tests/api/test_durable_training_controls.py
      - tests/api/test_unified_task_process_cancel.py
      - tests/api/test_unified_task_paused_public_status.py
      - tests/integration/test_video_task_worker.py
      - tests/unit/test_deployment_inference_process_fencing.py
      - tests/unit/test_gpu_resource_connection_lifecycle.py
      - tests/unit/test_video_commit_fencing.py
      - tests/unit/task_runtime/test_connection_lifecycle.py
      - tests/unit/task_runtime/test_worker_instance_connection_lifecycle.py
      - tests/unit/task_runtime/test_progress_monotonicity.py
      - tests/unit/task_runtime/test_fenced_progress_monotonicity.py
      - tests/unit/task_runtime/test_control_stage_fencing.py
      - tests/unit/task_runtime/test_process_control.py
      - tests/unit/task_runtime/test_public_projection.py
      - tests/unit/test_a800_rc_acceptance.py
      - tests/unit/test_training_metrics_fd.py

# Durable public truth guard: RUNNING + phase=paused must project as PAUSED while persisted_status stays RUNNING.
# Durable control guard: once cancellation is durable truth, a late resume cannot revive the task stage/process.
# Deployment-test guard: inference runners must bind exact process identity and terminate the tree on execution fencing.
# Video-publish guard: cancellation or stale execution must stop frame fan-out before later material/result commits.
jobs:
  runtime-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Runtime, resource and conversion contracts
        run: >-
          python -m pytest -q
          tests/api/test_durable_training_controls.py
          tests/api/test_unified_task_process_cancel.py
          tests/api/test_unified_task_paused_public_status.py
          tests/integration/test_video_task_worker.py
          tests/unit/test_deployment_inference_process_fencing.py
          tests/unit/test_gpu_resource_connection_lifecycle.py
          tests/unit/test_video_commit_fencing.py
          tests/unit/task_runtime/test_repository.py
          tests/unit/task_runtime/test_connection_lifecycle.py
          tests/unit/task_runtime/test_worker_instance_connection_lifecycle.py
          tests/unit/task_runtime/test_progress_monotonicity.py
          tests/unit/task_runtime/test_fenced_progress_monotonicity.py
          tests/unit/task_runtime/test_control_stage_fencing.py
          tests/unit/task_runtime/test_scheduler.py
          tests/unit/task_runtime/test_process_control.py
          tests/unit/task_runtime/test_public_projection.py
          tests/unit/task_runtime/test_fencing.py
          tests/unit/task_runtime/test_resource_fencing.py
          tests/unit/task_runtime/test_gpu_recovery_fencing.py
          tests/unit/task_runtime/test_artifact_fencing.py
          tests/unit/test_conversion_tasks.py
          tests/unit/test_conversion_process_fencing.py
          tests/unit/test_training_resource_contract.py
          tests/unit/test_training_metrics_fd.py
      - name: Worker execution-fencing smoke check
        run: >-
          python task_worker.py --check --data-dir "${RUNNER_TEMP}/platform-data"

  training-data-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: A800 RC verifier syntax
        run: python -m py_compile a800_rc_acceptance.py
      - name: Training data, labels, snapshot and RC evidence contracts
        run: >-
          python -m pytest --noconftest -q
          tests/unit/test_training_label_contract.py
          tests/unit/test_negative_sample_contract.py
          tests/unit/test_annotation_repository_scope.py
          tests/unit/test_training_splits.py
          tests/unit/test_training_components.py
          tests/unit/test_snapshots.py
          tests/unit/test_portable_dataset.py
          tests/unit/test_training_resource_contract.py
          tests/unit/test_launcher_workers.py
          tests/unit/test_a800_rc_acceptance.py
          tests/integration/test_task_worker_without_web.py
