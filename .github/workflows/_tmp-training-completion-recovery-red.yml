name: Temporary Training Completion Recovery RED

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-training-completion-recovery-red.yml

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml psutil keyring filelock boto3 oss2
      - name: Completed training recovery RED
        run: python -m pytest --noconftest -q tests/integration/test_training_completed_job_recovery.py
