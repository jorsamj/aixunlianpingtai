name: Sync Product Phase Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_product_phase_handoff.py
      - .github/workflows/sync-product-phase-handoff.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize product handoff
        run: python tools/sync_product_phase_handoff.py
      - name: Verify handoff
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          grep -q 'Deployment Artifact E2E CLOSED' AGENTS.md
          grep -q 'Unified Task Progress Phase 2' docs/CODEX_CURRENT_STATE.md
          grep -q 'app.js cache:                42.25.94' AGENTS.md
          grep -q 'main.mjs cache:              42.25.91' AGENTS.md
          git diff --check
      - name: Commit handoff and remove one-shot artifacts
        run: |
          git rm tools/sync_product_phase_handoff.py .github/workflows/sync-product-phase-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/CODEX_CURRENT_STATE.md
          git diff --cached --check
          git commit -m "docs: record deployment and unified task phase one"
          git push origin HEAD:refactor/frontend-runtime-stabilization
