name: Portable Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'app.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/node_agent_executor_runtime.py'
      - 'platform_core/node_agent_deployment_runtime.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'node_agent.py'
      - 'predict_ultralytics_runner.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/storage/s3.py'
      - 'platform_core/storage/oss.py'
      - 'platform_core/training_recovery_api.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_agent_execution.py'
      - 'tests/unit/test_agent_result_upload.py'
      - 'tests/unit/test_node_agent_executor_runtime.py'
      - 'tests/unit/test_node_agent_deployment_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/storage/test_object_store_immutability.py'
      - 'tests/api/test_deployment_test_runtime.py'
      - 'tests/api/test_agent_result_upload_api.py'
      - 'tests/api/test_runtime_router_app_mount.py'
      - '.github/workflows/portable-deployment.yml'
  pull_request:
    branches:
      - main
      - refactor/frontend-runtime-stabilization
    paths:
      - 'app.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/node_agent_executor_runtime.py'
      - 'platform_core/node_agent_deployment_runtime.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'node_agent.py'
      - 'predict_ultralytics_runner.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/storage/s3.py'
      - 'platform_core/storage/oss.py'
      - 'platform_core/training_recovery_api.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_agent_execution.py'
      - 'tests/unit/test_agent_result_upload.py'
      - 'tests/unit/test_node_agent_executor_runtime.py'
      - 'tests/unit/test_node_agent_deployment_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/storage/test_object_store_immutability.py'
      - 'tests/api/test_deployment_test_runtime.py'
      - 'tests/api/test_agent_result_upload_api.py'
      - 'tests/api/test_runtime_router_app_mount.py'
      - '.github/workflows/portable-deployment.yml'

jobs:
  transport-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable transport dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest requests fastapi httpx psutil filelock keyring pillow
      - name: Compile portable transport chain
        run: >-
          python -m py_compile
          platform_core/agent_execution.py
          platform_core/node_agent_executor_runtime.py
          platform_core/node_agent_deployment_runtime.py
          platform_core/node_agent_executor_loop.py
          node_agent.py
          platform_core/remote_execution_transport.py
          predict_ultralytics_runner.py
          platform_core/training_recovery_api.py
          platform_core/storage/s3.py
          platform_core/storage/oss.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_agent_execution.py
          tests/unit/test_agent_result_upload.py
          tests/unit/test_node_agent_executor_runtime.py
          tests/unit/test_node_agent_deployment_runtime.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/api/test_runtime_router_app_mount.py
      - name: Portable transport and Agent execution contracts
        run: >-
          python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_agent_execution.py
          tests/unit/test_agent_result_upload.py
          tests/unit/test_node_agent_executor_runtime.py
          tests/unit/test_node_agent_deployment_runtime.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
      - name: Runtime router mount AST contract
        run: >-
          python -m pytest -q --confcutdir=tests/api
          tests/api/test_runtime_router_app_mount.py

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2
      - name: Compile production deployment API
        run: >-
          python -m py_compile
          app.py
          platform_core/agent_execution.py
          platform_core/remote_execution_transport.py
          platform_core/storage/s3.py
          platform_core/storage/oss.py
          tests/api/test_deployment_test_runtime.py
          tests/api/test_agent_result_upload_api.py
          tests/api/test_runtime_router_app_mount.py
          tests/unit/storage/test_object_store_immutability.py
      - name: Deployment creation, result publication, and storage evidence contracts
        run: >-
          python -m pytest -q
          tests/api/test_deployment_test_runtime.py
          tests/api/test_agent_result_upload_api.py
          tests/api/test_runtime_router_app_mount.py
          tests/unit/storage/test_object_store_immutability.py
      - name: Permanent portable deployment guards
        shell: bash
        run: |
          grep -Fq 'REMOTE_TRANSFER_TTL_SECONDS = 900' platform_core/remote_execution_transport.py
          grep -Fq 'StorageType.OSS, StorageType.S3' platform_core/remote_execution_transport.py
          grep -Fq 'REMOTE_UPLOAD_NOT_PROTECTED' platform_core/remote_execution_transport.py
          grep -Fq 'generation-{generation}' platform_core/remote_execution_transport.py
          grep -Fq 'metadata={"sha256": expected_sha}' platform_core/remote_execution_transport.py
          grep -Fq 'Content-Length' platform_core/storage/s3.py
          grep -Fq 'x-oss-meta-' platform_core/storage/oss.py
          grep -Fq 'result-upload/prepare' platform_core/agent_execution.py
          grep -Fq 'result-upload/confirm' platform_core/agent_execution.py
          grep -Fq 'REMOTE_RESULT_NOT_CONFIRMED' platform_core/agent_execution.py
          grep -Fq 'self.fenced.begin_finalization(' platform_core/agent_execution.py
          grep -Fq 'stage_deployment_test(' app.py
          grep -Fq 'agent_execution_payload_resolver=_resolve_agent_execution_payload' app.py
          grep -Fq 'agent_result_upload_preparer=_prepare_agent_result_upload' app.py
          grep -Fq 'agent_result_upload_confirmer=_confirm_agent_result_upload' app.py
          grep -Fq 'class AgentDeploymentRunner' platform_core/node_agent_deployment_runtime.py
          grep -Fq 'prepare-after-local-hash-v1' platform_core/node_agent_deployment_runtime.py
          grep -Fq 'parser.add_argument("--device", default="")' predict_ultralytics_runner.py
          ! grep -Fq 'sqlite3' platform_core/node_agent_deployment_runtime.py
          ! grep -Fq 'TaskRepository' platform_core/node_agent_deployment_runtime.py
          grep -Fq '"material-import",' platform_core/node_agent_executor_loop.py
          grep -Fq '"MATERIAL_IMPORT",' platform_core/node_agent_executor_loop.py
          grep -Fq '"MATERIAL_IMPORT": "material-import"' platform_core/node_agent_executor_loop.py
          grep -Fq 'def effective_capabilities' platform_core/node_agent_executor_loop.py
          grep -Fq 'getattr(runner, "ready", True) is False' platform_core/node_agent_executor_loop.py
          grep -Fq 'getattr(runner, "recovery_error", "")' platform_core/node_agent_executor_loop.py
          grep -Fq 'resolver = getattr(executor, "effective_capabilities", None)' node_agent.py
          grep -Fq 'effective_capabilities = list(resolver())' node_agent.py
          grep -Fq 'capabilities=effective_capabilities' node_agent.py
          grep -Fq 'NodeAgentExecutorLoop' node_agent.py
          grep -Fq 'reported_capabilities = executable_agent_capabilities(requested_capabilities)' node_agent.py
          grep -Fq 'executor.start()' node_agent.py
          grep -Fq 'executor.stop(timeout=10.0)' node_agent.py
          ! grep -Fq 'sqlite3' platform_core/node_agent_executor_loop.py
          ! grep -Fq 'TaskRepository' platform_core/node_agent_executor_loop.py
          if grep -Fq '"url"' platform_core/task_node_assignments.py; then
            echo 'scheduler assignment truth must not persist signed transport URLs' >&2
            exit 1
          fi
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
