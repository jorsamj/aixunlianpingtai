name: Retire Legacy Training Network Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_legacy_training_network_owners.py
      - .github/workflows/retire-legacy-training-network-owners.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded migration
        run: python tools/retire_legacy_training_network_owners.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify classic direct training owners are gone
        run: |
          node --check static/app.js
          if grep -Fq 'api(`/api/v12/projects/${pid()}/train/start`' static/app.js; then
            echo 'classic direct /train/start call remains in static/app.js' >&2
            exit 1
          fi

      - name: Run canonical training tests
        run: node --test tests/frontend/training-submit.test.mjs tests/frontend/training-draft-runtime.test.mjs tests/frontend/training-labels.test.mjs

      - name: Commit migrated app.js
        run: |
          if git diff --quiet -- static/app.js; then
            echo "No migration change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js
          git commit -m "refactor(ui): retire classic direct training network owners"
          git push origin HEAD:refactor/frontend-runtime-stabilization
