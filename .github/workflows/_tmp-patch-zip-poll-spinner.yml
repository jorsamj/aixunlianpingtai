name: Temporary Patch ZIP Poll Spinner

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-patch-zip-poll-spinner.yml
      - .github/scripts/_tmp_patch_zip_poll_spinner.py

permissions:
  contents: write

jobs:
  patch-and-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply ZIP polling product patch
        run: python .github/scripts/_tmp_patch_zip_poll_spinner.py
      - name: Syntax and focused business contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/zip-import-overall-progress.test.mjs
          node --test tests/frontend/*zip*.test.mjs
          git diff --check
      - name: Version guard
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js
          git diff --cached --quiet && exit 1
          git commit -m "fix(import): bound ZIP progress polling failures"
          git push origin HEAD:refactor/frontend-runtime-stabilization
