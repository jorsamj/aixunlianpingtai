name: Online Feedback Runtime

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - app.py
      - platform_core/online_feedback.py
      - platform_core/material_repository.py
      - platform_core/annotation_repository.py
      - static/app.js
      - tests/unit/test_online_feedback.py
      - tests/api/test_online_feedback.py
      - tests/browser/online-feedback.spec.mjs
      - .github/workflows/online-feedback-runtime.yml
  pull_request:
    paths:
      - app.py
      - platform_core/online_feedback.py
      - platform_core/material_repository.py
      - platform_core/annotation_repository.py
      - static/app.js
      - tests/unit/test_online_feedback.py
      - tests/api/test_online_feedback.py
      - tests/browser/online-feedback.spec.mjs
      - .github/workflows/online-feedback-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx2 python-multipart pillow pyyaml requests opencv-python-headless psutil filelock keyring cryptography boto3 oss2 pydantic
      - name: Compile feedback runtime
        run: python -m py_compile app.py platform_core/online_feedback.py platform_core/material_repository.py platform_core/annotation_repository.py
      - name: Feedback repository contracts
        run: python -m pytest -q --confcutdir=tests/unit tests/unit/test_online_feedback.py
      - name: Feedback API contracts
        run: python -m pytest -q tests/api/test_online_feedback.py
      - name: Classic app syntax
        run: |
          node --check static/app.js
          node --check static/main.mjs
      - name: Permanent feedback guards
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          grep -Fq 'feedback_eligible' app.py
          grep -Fq 'predictBeforeFeedback63' static/app.js
          grep -Fq 'loadPageExtras413(requestedPage)' static/main.mjs
          grep -Fq 'feedbackExternalEndpoint63' static/app.js
          grep -Fq '/api/v63/projects/{project_id}/online-feedback' app.py
          grep -Fq 'confirm_all_labels_absent' app.py
          grep -Fq 'get_by_content_sha256' platform_core/material_repository.py
          grep -Fq 'OnlineFeedbackRepository' platform_core/online_feedback.py
          grep -Fq 'online_feedback_needs_review' app.py
          grep -Fq '正式算法版本可提交抽检反馈' static/app.js
          grep -Fq '不会自动修改素材、数据集或训练任务' static/app.js
          grep -Fq 'test_feedback_confirm_rejects_changed_prediction_input' tests/api/test_online_feedback.py
          grep -Fq '/online-feedback/{feedback_id}/dismiss' app.py
          grep -Fq '_legacy_iteration_write_disabled' app.py
          grep -Fq 'test_legacy_v42_feedback_and_auto_iteration_writes_are_gone' tests/api/test_online_feedback.py
          grep -Fq '/online-feedback/external-intake' app.py
          grep -Fq 'ONLINE_FEEDBACK_MAX_IMAGE_BYTES' app.py
          grep -Fq 'test_external_feedback_intake_stages_review_without_material_or_training_side_effect' tests/api/test_online_feedback.py
          grep -Fq 'build_supplement_candidate_set' platform_core/online_feedback.py
          grep -Fq 'supplement-data-candidates/freeze' app.py
          grep -Fq 'test_confirmed_feedback_candidates_freeze_without_revision_or_training_side_effect' tests/api/test_online_feedback.py
          grep -Fq 'test_feedback_candidate_freeze_rejects_stale_annotation_and_excludes_pending' tests/api/test_online_feedback.py

  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome reviewed feedback flow
        run: npx playwright test tests/browser/online-feedback.spec.mjs
      - name: Browser permanent guards
        run: |
          grep -Fq 'openPredictionFeedback63' static/app.js
          grep -Fq 'openOnlineFeedbackReview63' static/app.js
          grep -Fq 'confirmOnlineFeedback63' static/app.js
          grep -Fq 'formal version prediction enters reviewed online feedback without automatic retraining' tests/browser/online-feedback.spec.mjs
          grep -Fq 'false-positive feedback requires explicit all-label negative confirmation' tests/browser/online-feedback.spec.mjs
          grep -Fq 'pending reviewed feedback can be dismissed without promotion or training' tests/browser/online-feedback.spec.mjs
          grep -Fq 'external feedback intake contract is exposed from reviewed feedback panel' tests/browser/online-feedback.spec.mjs
          grep -Fq 'openExternalFeedbackIntake63' static/app.js
          grep -Fq 'external-intake' static/app.js
          grep -Fq 'window.openAuditConnect42=window.openExternalFeedbackIntake63' static/app.js
          grep -Fq 'dismissOnlineFeedback63' static/app.js
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
