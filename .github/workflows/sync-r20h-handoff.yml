name: Sync R20h Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20h_handoff.py
      - .github/workflows/sync-r20h-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize R20h accepted handoff surfaces
        run: python tools/sync_r20h_handoff.py
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Verify accepted R20h point in five handoff surfaces
        run: |
          for f in AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md; do
            grep -q '210a9ad1f6271a8a8986db3f223f4813a6cce288' "$f"
            grep -q '34696729028' "$f"
          done
      - name: Remove one-shot handoff sync artifacts
        run: rm -f tools/sync_r20h_handoff.py .github/workflows/sync-r20h-handoff.yml
      - name: Commit synchronized handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md tools/sync_r20h_handoff.py .github/workflows/sync-r20h-handoff.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --name-status
          git commit -m 'docs: synchronize R20h accepted handoff'
          git push
