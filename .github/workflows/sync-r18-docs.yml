name: Sync R18 Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r18_docs.py
      - tools/fix_r18_sync_anchor.py
      - .github/workflows/sync-r18-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct R18 sync anchor
        run: python tools/fix_r18_sync_anchor.py
      - name: Synchronize R18 ledgers
        run: python tools/sync_r18_docs.py
      - name: Validate R18 ledgers and formal version
        run: |
          for f in docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md; do
            grep -Fq '34670319479' "$f"
            grep -Fq 'R18' "$f"
          done
          grep -Fq 'bounded 100ms renderTop/cleanup startup timer' docs/CODEX_CURRENT_STATE.md
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Commit R18 ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md
          git diff --cached --quiet && { echo 'No docs changes'; exit 1; }
          git commit -m 'docs(ui): close R18 startup cleanup timer debt'
          git push origin HEAD:refactor/frontend-runtime-stabilization
