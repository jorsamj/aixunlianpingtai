name: Task Public Paused Status RED

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/task-public-paused-status-red.yml
      - tests/api/test_unified_task_paused_public_status.py
      - platform_core/task_runtime/public.py

jobs:
  paused-public-status-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Unified task paused public status contract
        run: >-
          python -m pytest -q
          tests/api/test_unified_task_paused_public_status.py
          tests/unit/task_runtime/test_public_projection.py
