name: Retire baseModalV37 Wrapper

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_base_modal_v37.py
      - .github/workflows/retire-base-modal-v37.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser-test backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded baseModalV37 migration
        run: python tools/retire_base_modal_v37.py
      - name: Verify focused static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/file-input-beautification-owner.test.mjs tests/frontend/render-owner-retirement.test.mjs tests/frontend/navigation-stability.test.mjs
          if grep -F -n 'baseModalV37' static/app.js; then
            echo 'retired baseModalV37 wrapper remains' >&2
            exit 1
          fi
          grep -Fq 'const oldModal424=modal, oldClose424=closeModal;' static/app.js
          grep -Fq 'oldModal424(title,body,wide); return baseModal;' static/app.js
          grep -Fq '/static/app.js?v=42.25.71' static/index.html
      - name: Verify modal behavior after autofocus owner migration
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep "modal table wrapping and first-field focus survive normalization ownership|modal file input beautification survives modal lifecycle ownership"
      - name: Commit baseModalV37 retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/post-render-normalization-owner.test.mjs
          git commit -m 'refactor(ui): retire baseModalV37 wrapper'
          git push
