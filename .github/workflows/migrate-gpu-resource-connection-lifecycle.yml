name: Migrate GPU Resource Connection Lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-gpu-resource-connection-lifecycle.yml
      - tools/migrate_gpu_resource_connection_lifecycle.py
      - tests/unit/test_gpu_resource_connection_lifecycle.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline GPU resource connection lifecycle must be RED
        run: |
          set +e
          python -m pytest -q tests/unit/test_gpu_resource_connection_lifecycle.py > /tmp/gpu-resource-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/gpu-resource-red.log
          test "$rc" = "1"
          grep -Eq "FAILED|GPU resource owner still has|GPU resource SQLite connections were left open" /tmp/gpu-resource-red.log
      - name: Apply precise GPU resource connection migration
        run: python tools/migrate_gpu_resource_connection_lifecycle.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile \
            platform_core/gpu_resources.py \
            tools/migrate_gpu_resource_connection_lifecycle.py \
            tests/unit/test_gpu_resource_connection_lifecycle.py
          git diff --check
      - name: Focused GPU lifecycle contract
        run: python -m pytest -q tests/unit/test_gpu_resource_connection_lifecycle.py
      - name: GPU resource and scheduler regressions
        run: >-
          python -m pytest -q
          tests/unit/task_runtime/test_resource_fencing.py
          tests/unit/task_runtime/test_gpu_recovery_fencing.py
          tests/unit/test_training_resource_contract.py
          tests/unit/task_runtime/test_scheduler.py
          tests/unit/test_training_metrics_fd.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/gpu_resources.py
          git diff --cached --check
          git commit -m "fix(gpu): close resource SQLite connections"
          git push origin HEAD:refactor/frontend-runtime-stabilization
