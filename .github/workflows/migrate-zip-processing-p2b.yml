name: Migrate ZIP Processing P2b

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-zip-processing-p2b.yml
      - tools/migrate_zip_processing_p2b_single_final_annotation.py
      - tests/api/test_zip_processing_p2b_single_final_annotation.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline P2b contract must be RED
        run: |
          set +e
          python -m pytest -q tests/api/test_zip_processing_p2b_single_final_annotation.py > /tmp/p2b-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/p2b-red.log
          test "$rc" = "1"
          grep -Eq "annotation_builder|unexpected keyword|assert" /tmp/p2b-red.log
      - name: Baseline 1000-image profile
        run: |
          python tools/profile_zip_processing_p2b.py --images 1000 | tee /tmp/p2b-before.log
          python - <<'PY'
          import json
          from pathlib import Path
          line=next(x for x in Path('/tmp/p2b-before.log').read_text().splitlines() if x.startswith('P2B_PROFILE='))
          value=json.loads(line.split('=',1)[1])
          assert value['metrics']['write_annotation']['count']==2000, value
          assert value['metrics']['annotation_upsert_many']['count']==2000, value
          Path('/tmp/p2b-before.json').write_text(json.dumps(value),encoding='utf-8')
          print('P2B_BEFORE',json.dumps(value,sort_keys=True))
          PY
      - name: Apply P2b migration
        run: python tools/migrate_zip_processing_p2b_single_final_annotation.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile app.py tests/api/test_zip_processing_p1.py tests/api/test_zip_processing_p2b_single_final_annotation.py
          git diff --check
      - name: P2b focused contracts
        run: >-
          python -m pytest -q
          tests/api/test_zip_processing_p2b_single_final_annotation.py
          tests/api/test_zip_processing_p1.py
          tests/api/test_zip_processing_p2a_annotation_connections.py
      - name: Annotation material and import regressions
        run: >-
          python -m pytest -q
          tests/api/test_annotation_flow.py
          tests/api/test_annotation_sqlite_dataset_delete_atomicity.py
          tests/api/test_material_batching.py
          tests/api/test_material_selection_atomicity.py
          tests/api/test_v19_import_scalability.py
      - name: Post-change 1000-image profile
        run: |
          python tools/profile_zip_processing_p2b.py --images 1000 | tee /tmp/p2b-after.log
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/p2b-before.json').read_text())
          line=next(x for x in Path('/tmp/p2b-after.log').read_text().splitlines() if x.startswith('P2B_PROFILE='))
          after=json.loads(line.split('=',1)[1])
          for key in ('report_imported_images','report_boxes','material_total','material_boxes','annotation_total','annotation_annotated'):
              assert after[key] == before[key], (key,before[key],after[key])
          assert before['metrics']['write_annotation']['count']==2000, before
          assert before['metrics']['annotation_upsert_many']['count']==2000, before
          assert after['metrics']['write_annotation']['count']==1000, after
          assert after['metrics']['annotation_upsert_many']['count']==1000, after
          print('P2B_AFTER',json.dumps(after,sort_keys=True))
          print('P2B_TRANSACTION_REDUCTION',before['metrics']['annotation_upsert_many']['count']/after['metrics']['annotation_upsert_many']['count'])
          print('P2B_WALL_SPEEDUP',before['wall_seconds']/max(0.0001,after['wall_seconds']))
          PY
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated P2b product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/api/test_zip_processing_p1.py
          git diff --cached --check
          git commit -m "perf(import): write final YOLO annotation once"
          git push origin HEAD:refactor/frontend-runtime-stabilization
