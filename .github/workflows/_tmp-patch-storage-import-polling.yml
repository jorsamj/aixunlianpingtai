name: Temporary Patch Storage Import Polling

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-patch-storage-import-polling.yml
      - .github/scripts/_tmp_patch_storage_import_polling.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact storage import polling patch
        run: python .github/scripts/_tmp_patch_storage_import_polling.py
      - name: Syntax check
        run: node --check static/app.js && node --check static/main.mjs && node --check static/modules/storage-import-progress.js && node --check static/modules/server-material-import.js
      - name: Storage import business contracts
        run: node --test tests/frontend/server-material-import.test.mjs tests/frontend/storage-import-progress.test.mjs
      - name: Completed deployment recovery contracts
        run: |
          python -m pip install --disable-pip-version-check pytest psutil filelock pyyaml
          python -m pytest --noconftest -q tests/integration/test_completed_deployment_recovery.py
      - name: Full frontend unit regression
        run: node --test tests/frontend/*.test.mjs
      - name: Version guard
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js static/main.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product patch needed"
            exit 0
          fi
          git commit -m "fix(storage): centralize import polling lifecycle"
          git push origin HEAD:refactor/frontend-runtime-stabilization
