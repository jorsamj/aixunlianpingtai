name: Temporary Patch Training Modal Probe

on:
  push:
    branches: [refactor/frontend-runtime-stabilization]
    paths:
      - '.github/scripts/_tmp_patch_training_modal_probe.py'
      - '.github/workflows/_tmp-patch-training-modal-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused product patch
        run: python .github/scripts/_tmp_patch_training_modal_probe.py
      - name: Focused training frontend contracts
        run: |
          node --test tests/frontend/training-submit.test.mjs
          node --test tests/frontend/training-submit-validation.test.mjs
          node --test tests/frontend/training-modal-device-probe.test.mjs
      - name: JavaScript syntax check
        run: node --check static/app.js
      - name: Version guard
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit product change
        run: |
          if git diff --quiet -- static/app.js; then
            echo 'No product diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js
          git commit -m 'fix(training): open task modal before device probe'
          git push origin HEAD:refactor/frontend-runtime-stabilization
