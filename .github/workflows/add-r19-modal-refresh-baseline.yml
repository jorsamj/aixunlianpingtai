name: Add R19 Modal Refresh Baseline

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_r19_modal_refresh_baseline.py
      - .github/workflows/add-r19-modal-refresh-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Add baseline
        run: python tools/add_r19_modal_refresh_baseline.py
      - name: Verify modal refresh baseline
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "base modal post-open content refresh stays functional"
      - name: Commit baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/navigation-stability.spec.mjs
          git diff --cached --quiet && { echo 'No baseline changes'; exit 1; }
          git commit -m 'test(ui): lock base modal post-open refresh behavior'
          git push origin HEAD:refactor/frontend-runtime-stabilization
