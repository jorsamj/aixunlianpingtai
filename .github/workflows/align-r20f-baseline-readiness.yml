name: Align R20f Baseline Readiness

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/align_r20f_baseline_readiness.py
      - .github/workflows/align-r20f-baseline-readiness.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Align R20f baseline with final UI readiness
        run: python tools/align_r20f_baseline_readiness.py
      - name: Commit permanent readiness alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/navigation-stability.spec.mjs
          git commit -m 'test(ui): align R20f baseline with UI readiness'
          git push
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Re-run old-product R20f baseline
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep 'model config save appears immediately without broad related refresh'
