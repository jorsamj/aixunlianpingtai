name: Add R20g Import Refresh Baseline

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_r20g_import_refresh_baseline.py
      - .github/workflows/add-r20g-import-refresh-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install permanent R20g Chrome contracts
        run: python tools/add_r20g_import_refresh_baseline.py
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Prove old product violates scoped import refresh contract
        shell: bash
        run: |
          set +e
          npx playwright test tests/browser/navigation-stability.spec.mjs \
            --grep 'ZIP import completion uses scoped label and material refresh|server storage import confirmation avoids broad related refresh'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Old product unexpectedly satisfies R20g contract; refusing to commit a false baseline.'
            exit 1
          fi
          echo "Expected old-product failure observed (exit=$status)."
      - name: Verify product untouched
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code static/app.js static/index.html static/main.mjs VERSION.txt
      - name: Commit permanent baseline only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/navigation-stability.spec.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qx 'tests/browser/navigation-stability.spec.mjs'
          git commit -m 'test(ui): lock scoped import refresh ownership'
          git push
