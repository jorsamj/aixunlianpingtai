name: TEMP ZIP Runtime Navigation Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/tmp-zip-runtime-navigation-diagnostic.yml'

jobs:
  browser-case:
    strategy:
      fail-fast: false
      matrix:
        case:
          - 'ZIP import completion surfaces review action'
          - 'ZIP import completion uses scoped label'
          - 'base modal post-open content refresh'
          - 'server storage import confirmation avoids broad related refresh'
          - 'formal version marker stays stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run isolated browser case
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "${{ matrix.case }}"
