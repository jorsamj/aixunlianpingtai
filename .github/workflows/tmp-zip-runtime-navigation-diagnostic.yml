name: TEMP ZIP Runtime Navigation Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/tmp-zip-runtime-navigation-diagnostic.yml'

jobs:
  browser-case:
    strategy:
      fail-fast: false
      matrix:
        spec:
          - navigation-stability.spec.mjs
          - navigation-readiness.spec.mjs
          - training-label-selector.spec.mjs
          - auto-label-polling.spec.mjs
          - algorithm-list-performance.spec.mjs
          - training-task-performance.spec.mjs
          - material-pagination-performance.spec.mjs
          - source-import-completion-scope.spec.mjs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: ${{ matrix.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run isolated browser case
        run: npx playwright test tests/browser/${{ matrix.spec }}
