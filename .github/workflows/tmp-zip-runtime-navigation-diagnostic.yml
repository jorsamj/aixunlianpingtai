name: TEMP ZIP Runtime Navigation Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/tmp-zip-runtime-navigation-diagnostic.yml'

jobs:
  browser-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run full browser regression sequence
        run: >-
          npx playwright test
          tests/browser/navigation-stability.spec.mjs
          tests/browser/navigation-readiness.spec.mjs
          tests/browser/training-label-selector.spec.mjs
          tests/browser/auto-label-polling.spec.mjs
          tests/browser/algorithm-list-performance.spec.mjs
          tests/browser/training-task-performance.spec.mjs
          tests/browser/material-pagination-performance.spec.mjs
          tests/browser/source-import-completion-scope.spec.mjs
          --reporter=json > browser-report.json
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: browser-report.json
          if-no-files-found: error

