name: TEMP ZIP Runtime Navigation Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/tmp-zip-runtime-navigation-diagnostic.yml'

jobs:
  browser-case:
    strategy:
      fail-fast: false
      matrix:
        case:
          - 'delayed request from previous page cannot jump back over the current page'
          - 'final v42.4 video polling patches rows'
          - 'source polling is PollRegistry-managed'
          - 'final navigation owner closes the mobile sidebar'
          - 'final navigation persists the selected page'
          - 'legacy auto-label route alias resolves'
          - 'historical persisted 自动标注 page is restored'
          - 'storage configuration route is rendered'
          - 'file input beautification survives page render lifecycle ownership'
          - 'modal file input beautification survives modal lifecycle ownership'
          - 'modal table wrapping and first-field focus survives normalization ownership'
          - 'training server connection keeps existing form and payload behavior'
          - 'paddle environment activation keeps manual and quick-detect behavior'
          - 'model config delete keeps model configuration page consistent'
          - 'prompt template save appears immediately in model configuration'
          - 'prompt template delete disappears immediately in model configuration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run isolated browser case
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "${{ matrix.case }}"
