name: Migrate ZIP Processing P2a

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-zip-processing-p2a.yml
      - tools/migrate_zip_processing_p2a_annotation_connections.py
      - tools/benchmark_zip_processing_p2a.py
      - tests/api/test_zip_processing_p2a_annotation_connections.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline P2a contract must be RED
        run: |
          set +e
          python -m pytest -q tests/api/test_zip_processing_p2a_annotation_connections.py > /tmp/p2a-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/p2a-red.log
          test "$rc" = "1"
          grep -Eq "follow-up get|annotation_repository|AssertionError" /tmp/p2a-red.log
      - name: Baseline 1000-image annotation connection benchmark
        run: |
          python tools/benchmark_zip_processing_p2a.py --images 1000 --json-out /tmp/p2a-before.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/p2a-before.json',encoding='utf-8'))
          assert value['annotation_upsert']==2000, value
          assert value['annotation_upsert_many']==2000, value
          assert value['annotation_init']>=2000, value
          assert value['annotation_get']>=2000, value
          assert value['annotation_connect']>=6000, value
          print('P2A_BEFORE',json.dumps(value,sort_keys=True))
          PY
      - name: Apply P2a migration
        run: python tools/migrate_zip_processing_p2a_annotation_connections.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile app.py platform_core/annotation_repository.py \
            tests/api/test_zip_processing_p2a_annotation_connections.py
          git diff --check
      - name: P2a focused contracts
        run: python -m pytest -q tests/api/test_zip_processing_p2a_annotation_connections.py
      - name: Annotation material and import regressions
        run: >-
          python -m pytest -q
          tests/api/test_annotation_flow.py
          tests/api/test_annotation_sqlite_dataset_delete_atomicity.py
          tests/api/test_material_batching.py
          tests/api/test_material_selection_atomicity.py
          tests/api/test_v19_import_scalability.py
          tests/api/test_zip_processing_p1.py
      - name: Post-change 1000-image annotation connection benchmark
        run: |
          python tools/benchmark_zip_processing_p2a.py --images 1000 --json-out /tmp/p2a-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/p2a-before.json',encoding='utf-8'))
          after=json.load(open('/tmp/p2a-after.json',encoding='utf-8'))
          for key in ('report_imported_images','report_boxes','material_total','material_boxes','annotation_total','annotation_annotated','annotation_upsert','annotation_upsert_many'):
              assert after[key] == before[key], (key,before[key],after[key])
          assert after['annotation_init'] <= 2, after
          assert after['annotation_get'] == 0, after
          assert after['annotation_connect'] <= 2100, after
          assert after['annotation_connect'] * 2 < before['annotation_connect'], (before,after)
          print('P2A_AFTER',json.dumps(after,sort_keys=True))
          print('P2A_CONNECTION_REDUCTION',before['annotation_connect']/max(1,after['annotation_connect']))
          print('P2A_WALL_SPEEDUP',before['wall_seconds']/max(0.0001,after['wall_seconds']))
          PY
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated P2a product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py platform_core/annotation_repository.py
          git diff --cached --check
          git commit -m "perf(import): reduce annotation connection amplification"
          git push origin HEAD:refactor/frontend-runtime-stabilization
