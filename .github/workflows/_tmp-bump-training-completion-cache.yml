name: Temporary Bump Training Completion Cache

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-bump-training-completion-cache.yml

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh browser cache keys
        run: python .github/scripts/_tmp_bump_training_completion_cache.py
      - name: Verify training task presentation
        run: node --test tests/frontend/training-task-runtime.test.mjs
      - name: Syntax and version guard
        run: |
          node --check static/modules/training-task-runtime.js
          node --check static/main.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/main.mjs static/index.html
          git diff --cached --check
          git commit -m "chore(frontend): refresh training completion runtime cache"
          git push origin HEAD:refactor/frontend-runtime-stabilization
