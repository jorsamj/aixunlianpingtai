name: Migrate Unified Cancel Bound Process

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-unified-cancel-bound-process.yml
      - tools/migrate_unified_cancel_bound_process.py
      - tests/api/test_unified_task_process_cancel.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline paused process cancel contract must be RED
        run: |
          set +e
          python -m pytest -q tests/api/test_unified_task_process_cancel.py > /tmp/unified-cancel-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/unified-cancel-red.log
          test "$rc" = "1"
          grep -Eq "FAILED|left the exact bound process alive" /tmp/unified-cancel-red.log
      - name: Apply precise unified cancel process migration
        run: python tools/migrate_unified_cancel_bound_process.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile app.py tools/migrate_unified_cancel_bound_process.py tests/api/test_unified_task_process_cancel.py
          git diff --check
      - name: Focused paused process cancel contract
        run: python -m pytest -q tests/api/test_unified_task_process_cancel.py
      - name: Unified task and process-control regressions
        run: >-
          python -m pytest -q
          tests/api/test_unified_task_runtime.py
          tests/api/test_training_unified_task_overlay.py
          tests/api/test_annotation_unified_task_truth.py
          tests/api/test_conversion_unified_task_truth.py
          tests/unit/task_runtime/test_process_control.py
          tests/unit/task_runtime/test_repository.py
          tests/unit/task_runtime/test_fencing.py
          tests/unit/task_runtime/test_resource_fencing.py
          tests/unit/task_runtime/test_connection_lifecycle.py
          tests/unit/task_runtime/test_progress_monotonicity.py
          tests/unit/task_runtime/test_fenced_progress_monotonicity.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git commit -m "fix(tasks): terminate bound process on cancel"
          git push origin HEAD:refactor/frontend-runtime-stabilization
