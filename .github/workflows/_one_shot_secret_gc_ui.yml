name: One-shot Secret and Multipart GC Wiring

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'tools/_one_shot_secret_gc_ui.py'
      - '.github/workflows/_one_shot_secret_gc_ui.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply precise patch
        run: python tools/_one_shot_secret_gc_ui.py
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest keyring cryptography filelock
      - name: Syntax checks
        run: |
          python -m py_compile app.py platform_core/secrets.py platform_core/zip_multipart.py
          node --check static/modules/external-algorithm-platform.js
      - name: Focused backend contracts
        run: >-
          PYTHONPATH=. pytest -q --confcutdir=tests/unit
          tests/unit/test_secrets.py
          tests/unit/test_zip_multipart.py
      - name: Frontend platform contract
        run: node --test tests/frontend/external-algorithm-platform.test.mjs
      - name: Wiring guards
        shell: bash
        run: |
          grep -Fq 'cleanup_expired_if_due(interval_seconds=60)' app.py
          grep -Fq 'credentialBackendText' static/modules/external-algorithm-platform.js
          grep -Fq 'MC_SECRET_MASTER_KEY' static/modules/external-algorithm-platform.js
          grep -Fq 'cleanup_expired_if_due' platform_core/zip_multipart.py
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name 'jorsamj'
          git config user.email '50445927+jorsamj@users.noreply.github.com'
          git add app.py platform_core/zip_multipart.py static/modules/external-algorithm-platform.js tests/frontend/external-algorithm-platform.test.mjs
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git commit -m 'fix(runtime): wire secret health and multipart GC'
          git push origin HEAD:feature/external-algorithm-publishing
