name: Retire Source Poll Bridge

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_source_poll_bridge.py
      - .github/workflows/retire-source-poll-bridge.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/retire_source_poll_bridge.py
      - name: Verify focused source lifecycle contracts
        run: |
          node --check static/app.js
          node --check static/modules/poll-registry.js
          node --check static/modules/navigation-stability.js
          node --test tests/frontend/poll-registry.test.mjs tests/frontend/navigation-stability.test.mjs
          for file in static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js; do
            if grep -F -n 'source422Timer' "$file"; then
              echo "source422Timer compatibility remains in $file" >&2
              exit 1
            fi
          done
          if [ "$(grep -F -o 'window.PollRegistryRuntime?.replaceSourceTimer?.()' static/app.js | wc -l)" -ne 1 ]; then
            echo 'renderSources422 must hand polling lifecycle explicitly to PollRegistry exactly once' >&2
            exit 1
          fi
          for token in installSourceCreationBridge __pollRegistrySourceWrapped originalRenderSources wrappedRenderSources "registry.adopt('sources'"; do
            if grep -F -n "$token" static/modules/poll-registry.js; then
              echo "PollRegistry source wrapper/adoption compatibility remains: $token" >&2
              exit 1
            fi
          done
          grep -Fq 'replaceSourceTimer();' static/modules/poll-registry.js
      - name: Commit migrated files
        run: |
          if git diff --quiet -- static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js tests/frontend/poll-registry.test.mjs tests/frontend/navigation-stability.test.mjs; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js tests/frontend/poll-registry.test.mjs tests/frontend/navigation-stability.test.mjs
          git commit -m 'refactor(ui): retire source polling wrapper bridge'
          git push
