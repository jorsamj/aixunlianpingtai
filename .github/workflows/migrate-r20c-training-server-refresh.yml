name: Migrate R20c Training Server Refresh Owner

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_r20c_training_server_refresh.py
      - .github/workflows/migrate-r20c-training-server-refresh.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/migrate_r20c_training_server_refresh.py
      - name: Verify static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/training-server-refresh-owner.test.mjs tests/frontend/algorithm-version-publish-owner.test.mjs tests/frontend/algorithm-version-refresh-owner.test.mjs
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code -- VERSION.txt
      - name: Verify focused Chrome training-server contract
        run: npx playwright test tests/browser/navigation-stability.spec.mjs --grep "training server connection keeps existing form and payload behavior"
      - name: Commit R20c product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/browser/navigation-stability.spec.mjs tests/frontend/training-server-refresh-owner.test.mjs
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'refactor(ui): scope training server refresh'
          git push origin HEAD:refactor/frontend-runtime-stabilization
