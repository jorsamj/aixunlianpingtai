name: AI Annotation Recovery

on:
  push:
    branches:
      - feature/external-algorithm-publishing
      - refactor/frontend-runtime-stabilization
    paths:
      - app.py
      - platform_core/annotation_candidates.py
      - platform_core/annotation_task_service.py
      - platform_core/annotations.py
      - static/app.js
      - static/styles.css
      - static/modules/material-pagination-runtime.js
      - static/modules/annotation-task-view.js
      - tests/api/test_annotation_task_runtime.py
      - tests/browser/material-workflows.spec.mjs
      - tests/browser/auto-label-polling.spec.mjs
      - tests/unit/test_annotation_candidates.py
      - tests/unit/test_annotation_task_service.py
      - tests/frontend/annotation-task-view.test.mjs
      - tests/frontend/annotation-runtime-source.test.mjs
      - tests/frontend/ai-review-label-usability.test.mjs
      - .github/workflows/ai-annotation-recovery.yml
  pull_request:
    paths:
      - app.py
      - platform_core/annotation_candidates.py
      - platform_core/annotation_task_service.py
      - platform_core/annotations.py
      - static/app.js
      - static/styles.css
      - static/modules/material-pagination-runtime.js
      - static/modules/annotation-task-view.js
      - tests/api/test_annotation_task_runtime.py
      - tests/unit/test_annotation_candidates.py
      - tests/unit/test_annotation_task_service.py
      - tests/frontend/annotation-task-view.test.mjs
      - tests/frontend/annotation-runtime-source.test.mjs
      - tests/frontend/ai-review-label-usability.test.mjs
      - .github/workflows/ai-annotation-recovery.yml
  workflow_dispatch:

jobs:
  recovery-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml filelock requests psutil pydantic
      - name: Compile annotation recovery contract
        run: >-
          python -m py_compile
          platform_core/annotation_candidates.py
          platform_core/annotation_task_service.py
          tests/unit/test_annotation_candidates.py
          tests/unit/test_annotation_task_service.py
      - name: Candidate recovery and fencing guards
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_annotation_candidates.py
          tests/unit/test_annotation_task_service.py
      - name: Annotation recovery frontend truth
        run: >-
          node --test
          tests/frontend/annotation-task-view.test.mjs
          tests/frontend/annotation-runtime-source.test.mjs
          tests/frontend/ai-review-label-usability.test.mjs
      - name: Permanent recovery source guard
        shell: python
        run: |
          from pathlib import Path

          service = Path('platform_core/annotation_task_service.py').read_text(encoding='utf-8')
          candidates = Path('platform_core/annotation_candidates.py').read_text(encoding='utf-8')
          frontend = Path('static/modules/annotation-task-view.js').read_text(encoding='utf-8')

          required_service = (
              'store.generation_prefix',
              'commit_guard=lambda: _assert_generation_commit(context)',
              'context.heartbeat(',
              'store.iter_accepted_items()',
              'store.get_commit_summaries(image_ids)',
              'store.record_commit_summaries(to_journal, commit_guard=commit_guard)',
              'read_formal_annotations(project_id, pending_ids)',
              'write_formal_annotations(project_id, to_write)',
          )
          missing = [token for token in required_service if token not in service]
          if missing:
              raise SystemExit(f'missing annotation recovery service contracts: {missing}')
          if 'context.repository.heartbeat(' in service:
              raise SystemExit('annotation task service must not bypass WorkerContext.heartbeat')
          if 'def generation_prefix(' not in candidates or 'commit_guard' not in candidates:
              raise SystemExit('CandidateStore durable recovery/fencing contract is missing')
          if '恢复执行 · 第 ${attempt} 次执行' not in frontend:
              raise SystemExit('annotation recovery frontend truth is missing')


  annotation-api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Compile annotation API contract
        run: >-
          python -m py_compile
          app.py
          tests/api/test_annotation_task_runtime.py
      - name: Durable annotation API truth
        run: >-
          python -m pytest -q
          tests/api/test_annotation_task_runtime.py
      - name: Version and diff guard
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
