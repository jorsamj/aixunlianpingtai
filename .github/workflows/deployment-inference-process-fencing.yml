name: Deployment Test Process Fencing RED-GREEN

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - platform_core/deployment/inference_tasks.py
      - tests/unit/test_deployment_inference_process_fencing.py
      - .github/workflows/deployment-inference-process-fencing.yml

jobs:
  process-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest psutil
      - name: Deployment inference exact-process fencing contract
        run: python -m pytest -q tests/unit/test_deployment_inference_process_fencing.py
      - name: Formal version boundary
        run: test "$(cat VERSION.txt)" = "42.24.0"
