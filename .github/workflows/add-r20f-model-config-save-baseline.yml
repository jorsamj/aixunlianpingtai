name: Add R20f Model Config Save Baseline

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_r20f_model_config_save_baseline.py
      - .github/workflows/add-r20f-model-config-save-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add permanent R20f behavior baseline
        run: python tools/add_r20f_model_config_save_baseline.py
      - name: Commit permanent baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/navigation-stability.spec.mjs
          git commit -m 'test(ui): lock R20f model config save behavior'
          git push
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run R20f baseline contract
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep 'model config save appears immediately without broad related refresh'
