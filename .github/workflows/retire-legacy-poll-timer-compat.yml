name: Retire Legacy Poll Timer Compatibility

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_legacy_poll_timer_compat.py
      - .github/workflows/retire-legacy-poll-timer-compat.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/retire_legacy_poll_timer_compat.py
      - name: Verify focused lifecycle contracts
        run: |
          node --check static/app.js
          node --check static/modules/poll-registry.js
          node --check static/modules/navigation-stability.js
          node --test tests/frontend/poll-registry.test.mjs tests/frontend/navigation-stability.test.mjs
          for file in static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js; do
            if grep -n -E 'auto422Timer|__videoFramePollTimer|__prelabelPollTimer' "$file"; then
              echo "retired legacy timer compatibility remains in $file" >&2
              exit 1
            fi
          done
          if grep -n '_oldSetupPollV33' static/app.js; then
            echo 'v33 setupPagePolling compatibility wrapper remains' >&2
            exit 1
          fi
      - name: Commit migrated files
        run: |
          if git diff --quiet -- static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js tests/frontend/poll-registry.test.mjs tests/frontend/navigation-stability.test.mjs; then
            echo 'no migration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/modules/poll-registry.js static/modules/navigation-stability.js tests/frontend/poll-registry.test.mjs tests/frontend/navigation-stability.test.mjs
          git commit -m 'refactor(ui): retire legacy poll timer compatibility'
          git push
