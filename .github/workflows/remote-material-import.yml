name: Remote Material Import

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'app.py'
      - 'node_agent.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/node_agent_material_runtime.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/remote_material_import.py'
      - 'platform_core/storage/import_tasks.py'
      - 'platform_core/task_node_assignments.py'
      - 'tests/unit/test_node_agent_material_runtime.py'
      - 'tests/unit/test_remote_material_import.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/integration/test_storage_import_worker.py'
      - 'tests/api/test_server_material_import.py'
      - '.github/workflows/remote-material-import.yml'
  pull_request:
    branches:
      - main
      - refactor/frontend-runtime-stabilization
    paths:
      - 'app.py'
      - 'node_agent.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/node_agent_material_runtime.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/remote_material_import.py'
      - 'platform_core/storage/import_tasks.py'
      - 'platform_core/task_node_assignments.py'
      - 'tests/unit/test_node_agent_material_runtime.py'
      - 'tests/unit/test_remote_material_import.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/integration/test_storage_import_worker.py'
      - 'tests/api/test_server_material_import.py'
      - '.github/workflows/remote-material-import.yml'

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install material runtime dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml requests psutil filelock keyring cryptography
          pydantic opencv-python-headless
      - name: Compile material runtime chain
        run: >-
          python -m py_compile
          node_agent.py
          platform_core/node_agent_executor_loop.py
          platform_core/node_agent_material_runtime.py
          platform_core/remote_execution_transport.py
          platform_core/remote_material_import.py
          platform_core/storage/import_tasks.py
          tests/unit/test_node_agent_material_runtime.py
          tests/unit/test_remote_material_import.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/integration/test_storage_import_worker.py
      - name: Agent material and transport contracts
        run: >-
          python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_node_agent_material_runtime.py
          tests/unit/test_remote_material_import.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
      - name: Agent review to local indexer integration
        run: >-
          python -m pytest -q --confcutdir=tests/integration
          tests/integration/test_storage_import_worker.py

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install material API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Compile production material API
        run: >-
          python -m py_compile
          app.py
          platform_core/remote_execution_transport.py
          platform_core/remote_material_import.py
          platform_core/storage/import_tasks.py
      - name: Agent ZIP import API contract
        run: >-
          python -m pytest -q
          tests/api/test_server_material_import.py
      - name: Permanent remote material guards
        shell: bash
        run: |
          grep -Fq 'execution_mode: Literal["local", "agent"] = "local"' app.py
          grep -Fq 'stage_material_import(' app.py
          grep -Fq 'required_capabilities=(' app.py
          grep -Fq '"agent.remote",' app.py
          grep -Fq 'class AgentMaterialImportRunner' platform_core/node_agent_material_runtime.py
          grep -Fq 'build_material_review_archive' platform_core/node_agent_material_runtime.py
          grep -Fq '"material-import",' platform_core/node_agent_executor_loop.py
          grep -Fq '"MATERIAL_IMPORT",' platform_core/node_agent_executor_loop.py
          grep -Fq 'commit_material_review_archive' platform_core/remote_execution_transport.py
          grep -Fq 'material_staging_ref' platform_core/remote_material_import.py
          grep -Fq '_remote_material_publisher' platform_core/storage/import_tasks.py
          ! grep -Fq 'TaskRepository' platform_core/node_agent_material_runtime.py
          ! grep -Fq 'sqlite3' platform_core/node_agent_material_runtime.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
