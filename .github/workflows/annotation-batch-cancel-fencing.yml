name: Annotation Batch Cancel Fencing RED-GREEN

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/annotation-batch-cancel-fencing.yml
      - platform_core/annotation_batches.py
      - tests/unit/test_annotation_batch_cancel_fencing.py

jobs:
  annotation-cancel-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Annotation cancellation side-effect contracts
        run: python -m pytest -q tests/unit/test_annotation_batch_cancel_fencing.py
      - name: Formal version boundary
        run: test "$(tr -d '\r\n ' < VERSION.txt)" = "42.24.0"
