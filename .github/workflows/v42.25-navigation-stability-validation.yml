name: v42.25 navigation stability validation

on:
  push:
    branches:
      - refactor/v42.25-runtime
  workflow_dispatch:

jobs:
  navigation-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check UI modules
        run: >-
          node --check static/modules/navigation-stability.js &&
          node --check static/main.mjs &&
          node --test tests/frontend/navigation-stability.test.mjs tests/frontend/training-labels.test.mjs
