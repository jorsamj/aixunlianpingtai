name: Temporary Fix Windows PID Probe

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/tmp_fix_windows_pid_probe.py
      - .github/workflows/tmp-fix-windows-pid-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Windows PID probe fix
        run: python scripts/tmp_fix_windows_pid_probe.py
      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml filelock requests psutil
      - name: Compile patched files
        run: >-
          python -m py_compile
          platform_core/training_tasks.py
          tests/unit/test_training_bundle_isolation.py
          tests/integration/test_training_input_integrity_chain.py
      - name: Focused Linux pre-push guard
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_training_bundle_isolation.py
          tests/unit/test_training_bundle_cache.py
      - name: Commit exact product fix
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github/workflows/training-input-integrity.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/training_tasks.py tests/unit/test_training_bundle_isolation.py docs/CODEX_HANDOFF_2026-09-16_DISCOVERY_TRAINING_INPUT_INTEGRATION.md
          git commit -m "fix(training): make pid liveness probe non-signalling"
          git push origin HEAD:refactor/frontend-runtime-stabilization
