name: Remote Cleaning Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'platform_core/cleaning.py'
      - 'platform_core/cleaning_analysis_runtime.py'
      - 'platform_core/annotation_quality.py'
      - 'platform_core/material_batches.py'
      - 'platform_core/remote_cleaning.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/node_agent_executor_runtime.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/node_agent_cleaning_runtime.py'
      - 'platform_core/task_node_assignments.py'
      - 'app.py'
      - 'tests/api/test_clean_unified_execution_truth.py'
      - 'node_agent.py'
      - 'tests/unit/test_remote_cleaning.py'
      - 'tests/unit/test_annotation_quality.py'
      - 'tests/unit/test_node_agent_cleaning_runtime.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_node_agent_executor_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/test_task_node_assignments.py'
      - 'tests/api/test_agent_executor_api.py'
      - 'tests/api/test_runtime_router_app_mount.py'
      - 'static/modules/cleaning.js'
      - 'static/app.js'
      - 'static/main.mjs'
      - 'static/styles.css'
      - 'static/index.html'
      - 'tests/frontend/clean-task-view.test.mjs'
      - 'tests/browser/remote-cleaning.spec.mjs'
      - '.github/workflows/remote-cleaning-runtime.yml'
  pull_request:
    branches:
      - main
      - refactor/frontend-runtime-stabilization
    paths:
      - 'platform_core/cleaning.py'
      - 'platform_core/cleaning_analysis_runtime.py'
      - 'platform_core/annotation_quality.py'
      - 'platform_core/material_batches.py'
      - 'platform_core/remote_cleaning.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/node_agent_executor_runtime.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/node_agent_cleaning_runtime.py'
      - 'platform_core/task_node_assignments.py'
      - 'app.py'
      - 'tests/api/test_clean_unified_execution_truth.py'
      - 'node_agent.py'
      - 'tests/unit/test_remote_cleaning.py'
      - 'tests/unit/test_annotation_quality.py'
      - 'tests/unit/test_node_agent_cleaning_runtime.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_node_agent_executor_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/test_task_node_assignments.py'
      - 'tests/api/test_agent_executor_api.py'
      - 'tests/api/test_runtime_router_app_mount.py'
      - 'static/modules/cleaning.js'
      - 'static/app.js'
      - 'static/main.mjs'
      - 'static/styles.css'
      - 'static/index.html'
      - 'tests/frontend/clean-task-view.test.mjs'
      - 'tests/browser/remote-cleaning.spec.mjs'
      - '.github/workflows/remote-cleaning-runtime.yml'

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install remote cleaning dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest requests fastapi httpx filelock pillow numpy opencv-python-headless psutil
      - name: Compile remote cleaning chain
        run: >-
          python -m py_compile
          platform_core/cleaning.py
          platform_core/cleaning_analysis_runtime.py
          platform_core/annotation_quality.py
          platform_core/material_batches.py
          platform_core/remote_cleaning.py
          platform_core/remote_execution_transport.py
          platform_core/agent_execution.py
          platform_core/node_agent_executor_runtime.py
          platform_core/node_agent_executor_loop.py
          platform_core/node_agent_cleaning_runtime.py
          platform_core/task_node_assignments.py
          node_agent.py
          tests/unit/test_remote_cleaning.py
          tests/unit/test_annotation_quality.py
          tests/unit/test_node_agent_cleaning_runtime.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_node_agent_executor_runtime.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/unit/test_task_node_assignments.py
      - name: Remote cleaning contracts
        run: >-
          python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_remote_cleaning.py
          tests/unit/test_annotation_quality.py
          tests/unit/test_node_agent_cleaning_runtime.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_node_agent_executor_runtime.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/unit/test_task_node_assignments.py
      - name: Classic app and cleaning frontend contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/clean-task-view.test.mjs
      - name: Permanent remote cleaning guards
        shell: bash
        run: |
          grep -Fq 'class AgentCleaningRunner' platform_core/node_agent_cleaning_runtime.py
          grep -Fq 'CleaningAnalysisRuntime' platform_core/node_agent_cleaning_runtime.py
          grep -Fq 'clean_selection_page' platform_core/node_agent_executor_runtime.py
          grep -Fq 'clean_selection_read' platform_core/node_agent_executor_runtime.py
          grep -Fq '"MATERIAL_BATCH": "cleaning"' platform_core/node_agent_executor_loop.py
          grep -Fq 'clean-runtime/preflight' static/app.js
          grep -Fq 'execution_mode:executionMode' static/app.js
          grep -Fq 'cleanExecutionChoices' static/modules/cleaning.js
          grep -Fq 'function patchCleanTaskRows427(body,tasks)' static/app.js
          grep -Fq 'patchCleanTaskRows427(body,state.clean427||[])' static/app.js
          grep -Fq 'data-progress=' static/app.js
          grep -Fq 'REMOTE_CLEANING_ANALYZING' static/modules/cleaning.js
          grep -Fq 'commit_remote_cleaning_review' platform_core/remote_cleaning.py
          grep -Fq 'audit_cleaning_annotations' platform_core/material_batches.py
          grep -Fq 'audit_cleaning_annotations' platform_core/remote_cleaning.py
          grep -Fq 'metric_issues(metrics, options, image_id, index)' platform_core/remote_cleaning.py
          grep -Fq 'DurableHashIndex' platform_core/remote_cleaning.py
          grep -Fq 'REMOTE_CLEANING_IMAGE_NOT_SELECTED' platform_core/remote_execution_transport.py
          grep -Fq 'required_capabilities = (' platform_core/material_batches.py
          ! grep -Fq 'sqlite3' platform_core/node_agent_cleaning_runtime.py
          ! grep -Fq 'TaskRepository' platform_core/node_agent_cleaning_runtime.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest requests fastapi httpx filelock pillow psutil numpy opencv-python-headless
          pyyaml python-multipart uvicorn
      - name: Cleaning broker API contracts
        run: >-
          python -m pytest -q
          tests/api/test_agent_executor_api.py
          tests/api/test_runtime_router_app_mount.py
      - name: Unified cleaning API truth
        run: python -m pytest -q tests/api/test_clean_unified_execution_truth.py
      - name: Runtime API guards
        shell: bash
        run: |
          grep -Fq 'clean-selection/page' platform_core/agent_execution.py
          grep -Fq 'clean-selection/read' platform_core/agent_execution.py
          grep -Fq 'agent_clean_selection_page_provider=_agent_clean_selection_page' app.py
          grep -Fq 'agent_clean_selection_read_provider=_agent_clean_selection_read' app.py
          grep -Fq "def _v47_clean_agent_preflight" app.py
          grep -Fq "required_capabilities=_v47_clean_required_capabilities(request)" app.py
          grep -Fq '"execution_mode": "agent"' tests/api/test_clean_unified_execution_truth.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check


  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome remote cleaning execution picker
        run: npx playwright test tests/browser/remote-cleaning.spec.mjs
      - name: Browser guard
        shell: bash
        run: |
          grep -Fq 'execution_mode' tests/browser/remote-cleaning.spec.mjs
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
