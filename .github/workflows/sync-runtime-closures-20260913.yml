name: Sync Runtime Closure Docs 20260913

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_runtime_closures_20260913.py
      - .github/workflows/sync-runtime-closures-20260913.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified closure evidence
        run: python tools/sync_runtime_closures_20260913.py
      - name: Verify authority markers and version boundary
        run: |
          for f in docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md; do
            grep -q 'RUNTIME-PROD-CLOSURES-2026-09-13-B' "$f"
          done
          test "$(tr -d '\r\n ' < VERSION.txt)" = "42.24.0"
      - name: Commit authority doc sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          if git diff --cached --quiet; then
            echo "Authority docs already synchronized"
            exit 0
          fi
          git commit -m "docs(v42.25): record runtime productization closures"
          git push origin HEAD:refactor/frontend-runtime-stabilization
