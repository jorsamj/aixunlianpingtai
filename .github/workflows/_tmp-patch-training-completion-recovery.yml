name: Temporary Patch Training Completion Recovery

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-patch-training-completion-recovery.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml psutil keyring filelock boto3 oss2
      - name: Apply exact business fix
        run: python .github/scripts/_tmp_patch_training_completion_recovery.py
      - name: Python syntax
        run: python -m py_compile platform_core/training_tasks.py
      - name: Completed training recovery GREEN
        run: python -m pytest --noconftest -q tests/integration/test_training_completed_job_recovery.py
      - name: Training task presentation GREEN
        run: node --test tests/frontend/training-task-runtime.test.mjs
      - name: Diff guard
        run: |
          git diff --check
          test "$(cat VERSION.txt)" = "42.24.0"
          git status --short
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/training_tasks.py static/modules/training-task-runtime.js tests/frontend/training-task-runtime.test.mjs
          git diff --cached --check
          git commit -m "fix(training): finalize completed jobs after worker recovery"
          git push origin HEAD:refactor/frontend-runtime-stabilization
