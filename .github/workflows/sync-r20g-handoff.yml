name: Sync R20g Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20g_handoff.py
      - .github/workflows/sync-r20g-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize current handoff surfaces
        run: python tools/sync_r20g_handoff.py
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Verify five handoff surfaces point at accepted close
        run: |
          for f in AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md; do
            grep -q '6337f1a0379c7e60fbbc459668090504c0b6095b' "$f"
            grep -q '34695825386' "$f"
          done
      - name: Remove one-shot synchronization artifacts
        run: rm -f tools/sync_r20g_handoff.py .github/workflows/sync-r20g-handoff.yml
      - name: Commit synchronized handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md tools/sync_r20g_handoff.py .github/workflows/sync-r20g-handoff.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'docs: synchronize R20g accepted handoff'
          git push
