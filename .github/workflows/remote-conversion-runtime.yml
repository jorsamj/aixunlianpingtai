name: Remote Conversion Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'app.py'
      - 'node_agent.py'
      - 'deployment_worker.py'
      - 'platform_core/node_agent_conversion_runtime.py'
      - 'platform_core/rknn_runtime.py'
      - 'platform_core/service_nodes.py'
      - 'platform_core/conversion.py'
      - 'static/app.js'
      - 'static/styles.css'
      - 'static/index.html'
      - 'tests/unit/test_rknn_runtime.py'
      - 'tests/unit/test_service_nodes.py'
      - 'tests/unit/test_conversion.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/task_node_assignments.py'
      - 'tests/unit/test_node_agent_conversion_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_task_node_assignments.py'
      - 'tests/api/test_conversion_portable_contract.py'
      - 'tests/browser/model-and-conversion.spec.mjs'
      - 'tests/browser/deployment-progress-performance.spec.mjs'
      - 'tests/browser/deployment-artifact-visibility.spec.mjs'
      - 'tests/frontend/deployment-action-owner-retirement.test.mjs'
      - 'tests/frontend/deployment-artifact-refresh.test.mjs'
      - 'tests/frontend/deployment-runtime-source.test.mjs'
      - 'tests/api/test_rknn_board_validation.py'
      - '.github/workflows/remote-conversion-runtime.yml'
  pull_request:
    branches:
      - main
      - refactor/frontend-runtime-stabilization
    paths:
      - 'app.py'
      - 'node_agent.py'
      - 'deployment_worker.py'
      - 'platform_core/node_agent_conversion_runtime.py'
      - 'platform_core/rknn_runtime.py'
      - 'platform_core/service_nodes.py'
      - 'platform_core/conversion.py'
      - 'static/app.js'
      - 'static/styles.css'
      - 'static/index.html'
      - 'tests/unit/test_rknn_runtime.py'
      - 'tests/unit/test_service_nodes.py'
      - 'tests/unit/test_conversion.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/remote_execution_transport.py'
      - 'platform_core/task_node_assignments.py'
      - 'tests/unit/test_node_agent_conversion_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_task_node_assignments.py'
      - 'tests/api/test_conversion_portable_contract.py'
      - 'tests/browser/model-and-conversion.spec.mjs'
      - 'tests/browser/deployment-progress-performance.spec.mjs'
      - 'tests/browser/deployment-artifact-visibility.spec.mjs'
      - 'tests/frontend/deployment-action-owner-retirement.test.mjs'
      - 'tests/frontend/deployment-artifact-refresh.test.mjs'
      - 'tests/frontend/deployment-runtime-source.test.mjs'
      - 'tests/api/test_rknn_board_validation.py'
      - '.github/workflows/remote-conversion-runtime.yml'

jobs:
  agent-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused Agent conversion dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest requests psutil filelock fastapi pydantic
      - name: Compile Agent conversion chain
        run: >-
          python -m py_compile
          node_agent.py
          deployment_worker.py
          platform_core/node_agent_conversion_runtime.py
          platform_core/rknn_runtime.py
          platform_core/service_nodes.py
          platform_core/conversion.py
          platform_core/node_agent_executor_loop.py
          platform_core/node_agent_executor_runtime.py
          platform_core/task_node_assignments.py
          tests/unit/test_node_agent_conversion_runtime.py
          tests/unit/test_rknn_runtime.py
          tests/unit/test_service_nodes.py
          tests/unit/test_conversion.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/unit/test_task_node_assignments.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Agent conversion runtime contracts
        run: >-
          python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_node_agent_conversion_runtime.py
          tests/unit/test_rknn_runtime.py
          tests/unit/test_service_nodes.py
          tests/unit/test_conversion.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/unit/test_task_node_assignments.py
      - name: Rockchip frontend syntax
        run: node --check static/app.js
      - name: Canonical conversion frontend contracts
        run: >-
          node --test
          tests/frontend/deployment-action-owner-retirement.test.mjs
          tests/frontend/deployment-artifact-refresh.test.mjs
          tests/frontend/deployment-runtime-source.test.mjs

  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused conversion control-plane dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Compile conversion control plane
        run: >-
          python -m py_compile
          app.py
          platform_core/remote_execution_transport.py
          platform_core/node_agent_conversion_runtime.py
          tests/api/test_conversion_portable_contract.py
          tests/api/test_rknn_board_validation.py
          tests/unit/test_remote_execution_transport.py
      - name: Portable creation and result commit contracts
        run: >-
          python -m pytest -q
          tests/api/test_conversion_portable_contract.py
          tests/api/test_rknn_board_validation.py
          tests/unit/test_remote_execution_transport.py
      - name: Permanent Remote Conversion guards
        shell: bash
        run: |
          grep -Fq '"source_trace": dict(conversion.get("source_trace") or {})' platform_core/remote_execution_transport.py
          grep -Fq 'REMOTE_CONVERSION_SOURCE_TRACE_MISSING' platform_core/remote_execution_transport.py
          grep -Fq 'test_model_conversion_rejects_missing_source_lineage' tests/unit/test_remote_execution_transport.py
          grep -Fq 'assert job["source_trace"]["algorithm_id"] == "a1"' tests/unit/test_remote_execution_transport.py
          grep -Fq 'assert job["source_trace"]["version_id"] == "v1"' tests/unit/test_remote_execution_transport.py
          grep -Fq 'class AgentConversionRunner' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'AgentConversionRunner only accepts MODEL_CONVERSION' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'deployment_worker.py' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'runtime_verified' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'prepare_result_upload' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'confirm_result_upload' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'SUPPORTED_AGENT_EXECUTOR_CAPABILITIES = frozenset({' platform_core/node_agent_executor_loop.py
          grep -Fq '"conversion",' platform_core/node_agent_executor_loop.py
          grep -Fq '"conversion.rknn",' platform_core/node_agent_executor_loop.py
          grep -Fq '"conversion.rknn"' platform_core/task_node_assignments.py
          grep -Fq 'BLOCKED_BY_HARDWARE' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'rknn-toolkit2' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'converted_unverified' platform_core/remote_execution_transport.py
          grep -Fq 'portable Agent RKNN conversion currently supports rk3568 or rk3576' platform_core/remote_execution_transport.py
          grep -Fq '服务节点 Agent' static/app.js
          grep -Fq 'value="agent"' static/app.js
          grep -Fq '"conversion.rknn",' platform_core/service_nodes.py
          grep -Fq 'probe_rknn_toolkit' node_agent.py
          grep -Fq 'rk3576' platform_core/conversion.py
          grep -Fq "target_contract = validate_target(target, params)" deployment_worker.py
          grep -Fq "supported = {'rk3568', 'rk3576'}" deployment_worker.py
          if grep -Eiq 'rk3588|rk3566|rk3562|rv1103|rv1106|rv1126|rk2118' deployment_worker.py; then echo 'product RKNN worker must only support RK3568/RK3576' >&2; exit 1; fi
          grep -Fq 'value="rk3568"' static/app.js
          grep -Fq 'value="rk3576"' static/app.js
          if grep -Fq 'option value="rk3588"' static/app.js; then echo 'product RKNN UI must only expose RK3568/RK3576' >&2; exit 1; fi
          grep -Fq 'build_rknn_calibration_snapshot' platform_core/remote_execution_transport.py
          grep -Fq 'REMOTE_CONVERSION_DOWNLOADING_CALIBRATION' platform_core/node_agent_conversion_runtime.py
          grep -Fq 'calibration_snapshot=portable_calibration' app.py
          grep -Fq 'test_rknn_int8_calibration_snapshot_uses_exact_object_refs_and_start_time_downloads' tests/unit/test_remote_execution_transport.py
          grep -Fq 'test_agent_conversion_runner_downloads_frozen_rknn_int8_calibration_before_worker' tests/unit/test_node_agent_conversion_runtime.py
          grep -Fq 'test_agent_rknn_int8_freezes_calibration_snapshot_before_task_staging' tests/api/test_conversion_portable_contract.py
          grep -Fq 'supported_precisions' static/app.js
          grep -Fq 'conv428CalibrationDataset' static/app.js
          grep -Fq 'conv428CalibrationSplit' static/app.js
          grep -Fq 'conv428CalibrationCount' static/app.js
          grep -Fq 'RKNN Agent INT8 conversion submits frozen calibration selection from the UI' tests/browser/model-and-conversion.spec.mjs
          grep -Fq 'completed conversion becomes visible in canonical version dialog without manual refresh' tests/browser/deployment-artifact-visibility.spec.mjs
          grep -Fq 'retired deployment page is no longer a public action target' tests/frontend/deployment-action-owner-retirement.test.mjs
          grep -Fq 'test_version_deployment_projection_preserves_rknn_hardware_truth' tests/api/test_rknn_board_validation.py
          grep -Fq '"deployment-test",' platform_core/node_agent_executor_loop.py
          grep -Fq '"material-import",' platform_core/node_agent_executor_loop.py
          grep -Fq '"training",' platform_core/node_agent_executor_loop.py
          grep -Fq 'SUPPORTED_AGENT_TASK_KINDS = frozenset({' platform_core/node_agent_executor_loop.py
          grep -Fq '"DEPLOYMENT_TEST",' platform_core/node_agent_executor_loop.py
          grep -Fq '"MATERIAL_IMPORT",' platform_core/node_agent_executor_loop.py
          grep -Fq '"MODEL_CONVERSION",' platform_core/node_agent_executor_loop.py
          grep -Fq '"TRAINING",' platform_core/node_agent_executor_loop.py
          grep -Fq 'runners["MODEL_CONVERSION"] = AgentConversionRunner' node_agent.py
          grep -Fq 'mode: Literal["local", "remote", "agent"] = "local"' app.py
          grep -Fq 'def _detect_agent_deploy_resource' app.py
          grep -Fq '"execution_mode": "agent" if resource_mode == "agent" else "local"' app.py
          grep -Fq '("agent.remote",)' app.py
          grep -Fq 'def _commit_conversion_result' platform_core/remote_execution_transport.py
          grep -Fq 'conversion_artifact_committed' platform_core/remote_execution_transport.py
          ! grep -Fq 'sqlite3' platform_core/node_agent_conversion_runtime.py
          ! grep -Fq 'TaskRepository' platform_core/node_agent_conversion_runtime.py
          ! grep -Fq 'tasks.sqlite3' platform_core/node_agent_conversion_runtime.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check


  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome model and RKNN Agent resource flow
        run: >-
          npx playwright test tests/browser/model-and-conversion.spec.mjs
          --grep "deployment resource editor exposes service-node Agent for RKNN|RKNN Agent INT8 conversion submits frozen calibration selection from the UI"
          &&
          npx playwright test tests/browser/deployment-progress-performance.spec.mjs
          &&
          npx playwright test tests/browser/deployment-artifact-visibility.spec.mjs
      - name: Browser guard
        shell: bash
        run: |
          grep -Fq '服务节点 Agent' tests/browser/model-and-conversion.spec.mjs
          grep -Fq 'RK3568' tests/browser/model-and-conversion.spec.mjs
          grep -Fq 'RK3576' tests/browser/model-and-conversion.spec.mjs
          grep -Fq 'RKNN Agent INT8 conversion submits frozen calibration selection from the UI' tests/browser/model-and-conversion.spec.mjs
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
