name: Temporary Training Completion Business Regression

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/_tmp-training-completion-business-regression.yml

jobs:
  business-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml psutil keyring filelock boto3 oss2
      - name: Training completion and normal-path business regression
        run: >-
          python -m pytest --noconftest -q
          tests/integration/test_training_completed_job_recovery.py
          tests/integration/test_training_task_worker.py
          tests/unit/test_training_realtime_progress.py
          tests/unit/test_training_progress_v2.py
      - name: Training task UI business regression
        run: node --test tests/frontend/training-task-runtime.test.mjs
      - name: Formal version guard
        run: test "$(cat VERSION.txt)" = "42.24.0"
