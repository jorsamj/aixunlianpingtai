name: Temporary Resource Discovery Contract Closure

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-resource-discovery-contract-close.yml

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest filelock psutil
      - name: Apply discovery contract closure
        run: python tools/tmp_resource_discovery_contract_close.py
      - name: Compile changed contracts
        run: python -m py_compile app.py platform_core/resource_discovery/request_scope.py platform_core/resource_discovery/scanner.py platform_core/resource_discovery/tasks.py tests/unit/test_resource_discovery_scope_contract.py
      - name: Run focused discovery regressions
        run: python -m pytest --confcutdir=tests/unit -q tests/unit/test_resource_discovery_scope_contract.py tests/unit/test_resource_discovery_sqlite_lifecycle.py
      - name: Verify product constraints
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          test ! -e .github/workflows/tmp-resource-discovery-contract-close.yml
          test ! -e tools/tmp_resource_discovery_contract_close.py
          git diff --check
      - name: Commit verified closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py platform_core/resource_discovery/request_scope.py platform_core/resource_discovery/tasks.py tests/unit/test_resource_discovery_scope_contract.py .github/workflows/resource-discovery-sqlite-stability.yml .github/workflows/tmp-resource-discovery-contract-close.yml tools/tmp_resource_discovery_contract_close.py
          git diff --cached --check
          git commit -m "fix(discovery): freeze full-scan roots in durable tasks"
          git push origin HEAD:refactor/frontend-runtime-stabilization
