name: Temporary Resource Discovery Contract Closure

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-resource-discovery-contract-close.yml

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest filelock psutil
      - name: Close full-machine discovery contract
        shell: bash
        run: |
          python - <<'PY'
