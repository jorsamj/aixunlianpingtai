name: Sync R20m Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20m_handoff.py
      - .github/workflows/sync-r20m-handoff.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize R20m handoff docs
        run: python tools/sync_r20m_handoff.py
      - name: Verify accepted R20m state
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq '/static/app.js?v=42.25.92' static/index.html
          grep -Fq '/static/main.mjs?v=42.25.89' static/index.html
          test -f tests/frontend/shadowed-algorithm-crud-r20m.test.mjs
          test -f tests/browser/algorithm-list-performance.spec.mjs
          test ! -e tools/migrate_shadowed_algorithm_crud_r20m.py
          test ! -e .github/workflows/migrate-shadowed-algorithm-crud-r20m.yml
          git diff --check
      - name: Remove one-shot sync artifacts
        run: |
          rm tools/sync_r20m_handoff.py
          rm .github/workflows/sync-r20m-handoff.yml
      - name: Commit synchronized handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A AGENTS.md docs tools .github/workflows
          if git diff --cached --quiet; then
            echo 'R20m handoff synchronization produced no changes' >&2
            exit 1
          fi
          git commit -m 'docs: synchronize R20m accepted handoff'
          git push origin HEAD:refactor/frontend-runtime-stabilization
