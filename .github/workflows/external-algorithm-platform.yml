          grep -Fq 'confirm=true' platform_core/external_algorithm_platform.py
          grep -Fq 'def _business_code(body: Any) -> str:' platform_core/external_algorithm_platform.py
          grep -Fq 'business_code = _business_code(body)' platform_core/external_algorithm_platform.py
