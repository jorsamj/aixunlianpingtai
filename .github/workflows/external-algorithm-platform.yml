          grep -Fq '"weights", "算法权重"' platform_core/external_algorithm_platform.py
          grep -Fq 'business_auth_mode": "authorization_bearer"' platform_core/external_algorithm_platform.py
          grep -Fq 'def _repair_legacy_zero_code_rows(self) -> int:' platform_core/integration_audit.py
          grep -Fq 'test_interaction_audit_repairs_only_legacy_http_200_code_zero_false_failures' tests/unit/test_integration_audit.py
          grep -Fq 'CHANG_LIAN_API_DOCUMENTS' platform_core/external_algorithm_platform.py
          grep -Fq 'data-changlian-api-contract="1"' static/modules/external-algorithm-platform.js
          grep -Fq '31 个接口条目全部登记' docs/CHANGLIAN_APIFOX_API_CATALOG.md
          grep -q "test_readiness_blocks_until_saved_synced_and_project_algorithm_exists" tests/unit/test_external_algorithm_platform.py
          grep -q '"scope": "master_data_training"' platform_core/external_algorithm_platform.py
          grep -q "人员网页登录账号不参与机器接口调用" static/modules/external-algorithm-platform.js
