name: External Algorithm Platform

on:
  pull_request:
    paths:
      - app.py
      - requirements.txt
      - platform_core/secrets.py
      - platform_core/external_algorithm_platform.py
      - platform_core/algorithm_sql_store.py
      - platform_core/integration_audit.py
      - platform_core/storage/source_repository.py
      - static/main.mjs
      - static/app.js
      - static/index.html
      - static/modules/external-algorithm-platform.js
      - static/modules/model-artifact-runtime.js
      - static/modules/algorithm-list-runtime.js
      - static/modules/training-submit.js
      - tests/unit/test_secrets.py
      - tests/unit/test_external_algorithm_platform.py
      - tests/unit/test_algorithm_sql_store.py
      - tests/unit/test_integration_audit.py
      - tests/unit/test_changlian_audit_client.py
      - tests/unit/storage/test_source_repository.py
      - tests/frontend/external-algorithm-platform.test.mjs
      - tests/browser/external-algorithm-platform.spec.mjs
      - tests/frontend/model-artifact-runtime.test.mjs
      - tests/frontend/algorithm-list-runtime.test.mjs
      - tests/frontend/startup-render-owner.test.mjs
      - docs/PROJECT_HANDOFF_CURRENT.md
      - docs/BUG_AUDIT_2026-09-17.md
      - docs/CHANGLIAN_CORE_INTEGRATION.md
      - docs/CHANGLIAN_APIFOX_API_CATALOG.md
      - .github/workflows/external-algorithm-platform.yml
  push:
    branches:
      - feature/external-algorithm-platform
      - feature/external-algorithm-publishing
    paths:
      - app.py
      - requirements.txt
      - platform_core/secrets.py
      - platform_core/external_algorithm_platform.py
      - platform_core/algorithm_sql_store.py
      - platform_core/integration_audit.py
      - platform_core/storage/source_repository.py
      - static/main.mjs
      - static/app.js
      - static/index.html
      - static/modules/external-algorithm-platform.js
      - static/modules/model-artifact-runtime.js
      - static/modules/algorithm-list-runtime.js
      - static/modules/training-submit.js
      - tests/unit/test_secrets.py
      - tests/unit/test_external_algorithm_platform.py
      - tests/unit/test_algorithm_sql_store.py
      - tests/unit/test_integration_audit.py
      - tests/unit/test_changlian_audit_client.py
      - tests/unit/storage/test_source_repository.py
      - tests/frontend/external-algorithm-platform.test.mjs
      - tests/browser/external-algorithm-platform.spec.mjs
      - tests/frontend/model-artifact-runtime.test.mjs
      - tests/frontend/algorithm-list-runtime.test.mjs
      - tests/frontend/startup-render-owner.test.mjs
      - docs/PROJECT_HANDOFF_CURRENT.md
      - docs/BUG_AUDIT_2026-09-17.md
      - docs/CHANGLIAN_CORE_INTEGRATION.md
      - docs/CHANGLIAN_APIFOX_API_CATALOG.md
      - .github/workflows/external-algorithm-platform.yml

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring cryptography
      - name: Backend external-platform contracts
        run: |
          PYTHONPATH=. pytest -q --confcutdir=tests/unit \
            tests/unit/test_secrets.py \
            tests/unit/test_external_algorithm_platform.py \
            tests/unit/test_algorithm_sql_store.py \
            tests/unit/test_integration_audit.py \
            tests/unit/test_changlian_audit_client.py \
            tests/unit/storage/test_source_repository.py
      - name: Frontend external-platform contracts
        run: |
          node --test \
            tests/frontend/external-algorithm-platform.test.mjs \
            tests/frontend/model-artifact-runtime.test.mjs \
            tests/frontend/algorithm-list-runtime.test.mjs \
            tests/frontend/startup-render-owner.test.mjs
      - name: Syntax and wiring guards
        run: |
          python -m py_compile app.py platform_core/secrets.py platform_core/external_algorithm_platform.py platform_core/integration_audit.py platform_core/storage/source_repository.py
          node --check static/modules/external-algorithm-platform.js
          node --check static/modules/model-artifact-runtime.js
          node --check static/modules/algorithm-list-runtime.js
          node --check static/modules/training-submit.js
          grep -q "external_algorithm_platform_router" app.py
          grep -q "installExternalAlgorithmPlatformRuntime" static/main.mjs
          grep -q "installModelArtifactRuntime" static/main.mjs
          grep -q "DEFAULT_AUTO_SYNC_INTERVAL_SECONDS" platform_core/external_algorithm_platform.py
          grep -q "external-algorithm-platform-auto-sync" platform_core/external_algorithm_platform.py
          grep -q "masterDataPreviewHtml" static/modules/external-algorithm-platform.js
          grep -q "externalAlgorithmTrainingReadiness" static/modules/external-algorithm-platform.js
          grep -q "data-external-stale" static/modules/external-algorithm-platform.js
          grep -q "external-master-data-stale" static/modules/external-algorithm-platform.js
          grep -q "trainingReadiness" static/modules/external-algorithm-platform.js
          grep -Fq "externalCategorySignature" static/modules/external-algorithm-platform.js
          grep -Fq 'dataset.algorithmSourceFilter' static/modules/external-algorithm-platform.js
          grep -Fq '内部算法' static/modules/external-algorithm-platform.js
          grep -Fq '外部算法' static/modules/external-algorithm-platform.js
          grep -Fq 'dataset.algorithmTrainingStatusFilter' static/modules/external-algorithm-platform.js
          grep -Fq 'selectedCategoryIds.has(row.id)' static/modules/external-algorithm-platform.js
          grep -Fq 'dataset.externalListSync' static/modules/external-algorithm-platform.js
          grep -Fq '自动同步已启用' static/modules/external-algorithm-platform.js
          grep -Fq '每 60 秒主动拉取一次主数据' static/modules/external-algorithm-platform.js
          grep -Fq 'auto_sync_interval_seconds: 60' static/modules/external-algorithm-platform.js
          grep -Fq 'DEFAULT_AUTO_SYNC_INTERVAL_SECONDS = 60' platform_core/external_algorithm_platform.py
          grep -Fq 'time.sleep(5)' platform_core/external_algorithm_platform.py
          ! grep -Fq 'externalAutoSyncInterval' static/modules/external-algorithm-platform.js
          grep -Fq 'algorithm list supports multi-category source and training-status filters' tests/frontend/external-algorithm-platform.test.mjs
          grep -Fq 'algorithmListSearchMatch' static/modules/algorithm-list-runtime.js
          grep -Fq 'selectedCategoryIds: []' static/modules/algorithm-list-runtime.js
          grep -Fq 'algorithmListRuntime?.filterState?.()' static/modules/external-algorithm-platform.js
          grep -Fq 'algorithmListRuntime?.setFilters?.(patch, options)' static/modules/external-algorithm-platform.js
          ! grep -Fq "let selectedSource = 'all'" static/modules/external-algorithm-platform.js
          ! grep -Fq "let selectedTrainingStatus = 'all'" static/modules/external-algorithm-platform.js
          ! grep -Fq 'const selectedCategoryIds = new Set();' static/modules/external-algorithm-platform.js
          grep -Fq 'external_product_id' static/app.js
          grep -Fq 'algorithm runtime owns unified list filters and searches provider identifiers' tests/frontend/algorithm-list-runtime.test.mjs
          grep -Fq "v42 dashboard renderer only calls helpers from its own scope" tests/frontend/startup-render-owner.test.mjs
          grep -Fq 'database.execute("PRAGMA busy_timeout=5000")' platform_core/storage/source_repository.py
          grep -Fq 'if current_mode != "wal":' platform_core/storage/source_repository.py
          grep -Fq "test_existing_wal_connection_does_not_reapply_journal_mode" tests/unit/storage/test_source_repository.py
          grep -q "test_sign_bridge" platform_core/external_algorithm_platform.py
          grep -q "def _validated_external_items" platform_core/external_algorithm_platform.py
          grep -q "EXTERNAL_PRODUCT_ID_MISSING" platform_core/external_algorithm_platform.py
          grep -q "EXTERNAL_ANALYSIS_ID_MISSING" platform_core/external_algorithm_platform.py
          grep -Fq 'return status_value is not None and str(status_value).strip() == "1"' platform_core/external_algorithm_platform.py
          grep -Fq 'return str(_value_from(row, "analysisType", "analysis_type") or "").strip() == "1"' platform_core/external_algorithm_platform.py
          ! grep -Fq 'status not in {"0", "false", "disabled"}' platform_core/external_algorithm_platform.py
          ! grep -Fq 'return "视觉" in text or "vision" in text or "video" in text' platform_core/external_algorithm_platform.py
          grep -Fq "row.type === '1' && row.status === '1'" static/modules/external-algorithm-platform.js
          ! grep -Fq 'external_analysis_ids || []' static/modules/external-algorithm-platform.js
          grep -Fq 'EXTERNAL_ANALYSIS_NOT_VISUAL' platform_core/external_algorithm_platform.py
          grep -Fq 'EXTERNAL_VISUAL_ANALYSIS_MISSING' platform_core/external_algorithm_platform.py
          grep -Fq 'test_analysis_enabled_requires_exact_status_one' tests/unit/test_external_algorithm_platform.py
          grep -Fq 'test_analysis_visual_requires_exact_analysis_type_one' tests/unit/test_external_algorithm_platform.py
          grep -Fq 'test_external_sync_fails_closed_when_status_or_analysis_type_is_missing' tests/unit/test_external_algorithm_platform.py
          grep -Fq 'test_external_sync_only_exposes_enabled_visual_analyses_for_training' tests/unit/test_external_algorithm_platform.py
          grep -Fq 'test_external_training_rejects_non_visual_or_disabled_analysis' tests/unit/test_external_algorithm_platform.py
          grep -Fq 'test_legacy_trainable_id_list_cannot_bypass_missing_status_or_type' tests/unit/test_algorithm_sql_store.py
          grep -Fq 'test_analysis_summary_preserves_numeric_zero_status' tests/unit/test_external_algorithm_platform.py
          grep -Fq 'status_value = _value_from(row, "status")' platform_core/external_algorithm_platform.py
          if grep -Fq 'str(_value_from(row, "status") or "")' platform_core/external_algorithm_platform.py; then echo "analysis status must preserve numeric zero" >&2; exit 1; fi
          grep -Fq 'item["external_analysis_ids"] = self._trainable_analysis_ids(item, analyses)' platform_core/algorithm_sql_store.py
          grep -Fq 'test_changlian_trainable_analysis_subset_survives_sql_round_trip' tests/unit/test_algorithm_sql_store.py
          grep -q "EXTERNAL_COMPUTE_PLATFORM_ID_MISSING" platform_core/external_algorithm_platform.py
          grep -q "test_connection_fails_when_product_records_have_no_business_id" tests/unit/test_external_algorithm_platform.py
          grep -q "test_changlian_legacy_endpoint_paths_migrate_to_internal_namespaces" tests/unit/test_external_algorithm_platform.py
          grep -Fq 'category_tree: str = "/internal/base/category/tree"' platform_core/external_algorithm_platform.py
