          grep -q "test_sync_fails_closed_when_product_id_is_missing" tests/unit/test_external_algorithm_platform.py
          grep -q "test_sync_fails_closed_when_analysis_id_is_missing" tests/unit/test_external_algorithm_platform.py
          grep -q "test_sync_fails_closed_when_compute_platform_id_is_missing" tests/unit/test_external_algorithm_platform.py
          grep -q "test_sync_cache_write_failure_does_not_mutate_algorithm_mirror" tests/unit/test_external_algorithm_platform.py
          grep -q "test_sync_mirror_failure_restores_previous_master_data_cache" tests/unit/test_external_algorithm_platform.py
          grep -q "test_sync_rejects_concurrent_project_sync_without_mutating_state" tests/unit/test_external_algorithm_platform.py
          grep -q "EXTERNAL_PLATFORM_SYNC_BUSY" platform_core/external_algorithm_platform.py
          grep -q "def _sync_lock" platform_core/external_algorithm_platform.py
          grep -q "def master_data_digest" platform_core/external_algorithm_platform.py
          grep -q "external_master_data_digest" platform_core/external_algorithm_platform.py
          grep -q "EXTERNAL_MASTER_DATA_STALE" platform_core/external_algorithm_platform.py
          grep -q "test_sync_binds_algorithm_mirror_to_master_data_digest" tests/unit/test_external_algorithm_platform.py
          grep -q "test_readiness_and_training_guard_reject_stale_project_master_data" tests/unit/test_external_algorithm_platform.py
          grep -q "previous_cache = self.repository.cache()" platform_core/external_algorithm_platform.py
          grep -q "def flatten_category_tree" platform_core/external_algorithm_platform.py
          grep -q "test_connection_and_diagnostics_count_full_category_tree" tests/unit/test_external_algorithm_platform.py
          grep -q '"access_key": self.access_key' platform_core/external_algorithm_platform.py
          grep -q '"access_secret": self.access_secret' platform_core/external_algorithm_platform.py
          grep -q '_request("POST", self.endpoints.test_sign, params=params)' platform_core/external_algorithm_platform.py
          grep -q 'audit_callback(redact(' platform_core/external_algorithm_platform.py
          if grep -q 'self.endpoints.test_sign, json=' platform_core/external_algorithm_platform.py; then echo "test-sign must use documented query parameters, not JSON body" >&2; exit 1; fi
          grep -q "resolve_external_training_analysis" app.py
          grep -q "registerDecorator('external-algorithm-platform'" static/modules/external-algorithm-platform.js
          grep -q "def _client_for_payload" platform_core/external_algorithm_platform.py
          grep -q "def readiness(self" platform_core/external_algorithm_platform.py
          grep -q '@router.get("/readiness")' platform_core/external_algorithm_platform.py
          grep -q '"human_login_required": False' platform_core/external_algorithm_platform.py
          grep -q '"auth_type": "application_credentials"' platform_core/external_algorithm_platform.py
          grep -Fq 'headers["Authorization"] = f"{token_type} {token}".strip()' platform_core/external_algorithm_platform.py
          if grep -Fq 'headers["Access-Token"] = token' platform_core/external_algorithm_platform.py; then echo "ChangLian business APIs must use official Authorization Bearer contract" >&2; exit 1; fi
          grep -Fq '"/internal/base/algorithm-category/tree": "/internal/base/category/tree"' platform_core/external_algorithm_platform.py
          grep -Fq '"/internal/algorithm/algorithm-product-analysis/listByProduct/{productId}": "/internal/algorithm/algorithm-analysis/listByProduct/{productId}"' platform_core/external_algorithm_platform.py
