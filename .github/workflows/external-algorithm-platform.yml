          grep -q "interaction-logs" platform_core/external_algorithm_platform.py
          grep -q "IntegrationAuditRepository" platform_core/external_algorithm_platform.py
          grep -q "复制诊断信息" static/modules/model-artifact-runtime.js
          grep -q "id=\"externalConnectionResult\"" static/modules/external-algorithm-platform.js
          grep -q "id=\"externalSecretToggle\"" static/modules/external-algorithm-platform.js
          grep -q "credentialBackendText" static/modules/external-algorithm-platform.js
          grep -q "MC_SECRET_MASTER_KEY" static/modules/external-algorithm-platform.js
          grep -q "EncryptedFileSecretStore" platform_core/secrets.py
          grep -q "MC_CHANGLIAN_ACCESS_KEY" platform_core/secrets.py
          grep -q "cryptography>=" requirements.txt
          grep -q "CLOSED — Headless Linux Secret 持久化" docs/PROJECT_HANDOFF_CURRENT.md
          grep -q "CLOSED — Multipart session TTL / GC" docs/PROJECT_HANDOFF_CURRENT.md
          grep -q "CLOSED-04 — Headless Linux 新畅联 Secret 安全持久化" docs/BUG_AUDIT_2026-09-17.md
          grep -q "CLOSED-05 — Multipart session TTL / GC" docs/BUG_AUDIT_2026-09-17.md
          grep -q "const payload = collectForm();" static/modules/external-algorithm-platform.js
          if grep -q "window.renderAlg412 =" static/modules/external-algorithm-platform.js; then echo "external platform must not wrap renderAlg412" >&2; exit 1; fi
          if grep -q "下一阶段" static/modules/external-algorithm-platform.js; then echo "stale phase wording remains" >&2; exit 1; fi
          test ! -e tools/_one_shot_model_asset_integration.py
          test ! -e .github/workflows/_one_shot_model_asset_integration.yml
          test ! -e tools/finalize_external_platform_credentials_ui.py
          test ! -e tools/fix_external_platform_connectivity_result.py
          test ! -e .github/workflows/external-platform-credentials-one-shot.yml
          test ! -e tools/_one_shot_secret_gc_ui.py
          test ! -e .github/workflows/_one_shot_secret_gc_ui.yml
          test ! -e tools/_one_shot_secret_gc_docs.py
          test ! -e .github/workflows/_one_shot_secret_gc_docs.yml
          test "$(cat VERSION.txt)" = "42.24.0"


  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome ChangLian manual connectivity flow
        run: npx playwright test tests/browser/external-algorithm-platform.spec.mjs
      - name: Browser permanent guards
        run: |
          grep -Fq "changlian platform page tests draft credentials before manual sync" tests/browser/external-algorithm-platform.spec.mjs
          grep -Fq 'data-changlian-api-contract="1"' static/modules/external-algorithm-platform.js
          grep -Fq '已核对 31 个官方 OpenAPI 接口' tests/browser/external-algorithm-platform.spec.mjs
          grep -Fq "stale changlian algorithm is visibly blocked before training submit" tests/browser/external-algorithm-platform.spec.mjs
          grep -Fq 'data-external-stale' static/modules/external-algorithm-platform.js
          grep -Fq "人员登录账号" tests/browser/external-algorithm-platform.spec.mjs
          grep -Fq 'data-external-sync-settings="1"' static/modules/external-algorithm-platform.js
          grep -Fq "本次训练分析方式" static/modules/external-algorithm-platform.js
          if grep -Fq 'data-external-endpoint=' static/modules/external-algorithm-platform.js; then echo "ChangLian canonical provider paths must not be user-editable" >&2; exit 1; fi
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
