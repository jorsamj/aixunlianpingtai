          grep -Fq 'test_changlian_full_version_and_weight_contract_uses_bearer_and_official_paths' tests/unit/test_changlian_audit_client.py
          grep -Fq '@router.post("/provider/versions")' platform_core/external_algorithm_platform.py
          grep -Fq '@router.put("/provider/versions/{algo_version_id}")' platform_core/external_algorithm_platform.py
          grep -Fq '@router.delete("/provider/versions/{algo_version_ids}")' platform_core/external_algorithm_platform.py
          grep -Fq '@router.post("/provider/weights")' platform_core/external_algorithm_platform.py
          grep -Fq '@router.put("/provider/weights/{weight_id}")' platform_core/external_algorithm_platform.py
          grep -Fq '@router.delete("/provider/weights/{weight_ids}")' platform_core/external_algorithm_platform.py
