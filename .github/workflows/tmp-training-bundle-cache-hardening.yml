name: Temporary Training Bundle Cache Hardening

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-training-bundle-cache-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact cache hardening patch
        run: python .github/tmp_training_bundle_cache_hardening.py

      - name: Install project test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify cache integrity and finalization ordering
        run: |
          python -m py_compile platform_core/training_bundle_cache.py platform_core/training_tasks.py
          python -m pytest -q \
            tests/unit/test_training_bundle_cache.py \
            tests/unit/test_training_startup_performance_contract.py \
            tests/unit/test_training_finalization_handshake.py \
            tests/unit/test_portable_dataset.py \
            tests/unit/test_training_bundle_isolation.py

      - name: Commit verified hardening and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/tmp-training-bundle-cache-hardening.yml \
            .github/tmp_training_bundle_cache_hardening.py
          git add \
            platform_core/training_bundle_cache.py \
            platform_core/training_tasks.py \
            tests/unit/test_training_bundle_cache.py \
            docs/CODEX_CURRENT_STATE.md
          git commit -m "fix(training): harden verified bundle cache admission"

      - name: Push verified commit
        run: git push origin HEAD:refactor/frontend-runtime-stabilization
