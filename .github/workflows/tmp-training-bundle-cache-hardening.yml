name: Temporary Training Bundle Cache Hardening

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/tmp-training-bundle-cache-hardening.yml

permissions:
  contents: write

jobs:
  package-verified-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reapply the already verified exact patch
        run: |
          python .github/tmp_training_bundle_cache_hardening_fix.py
          python .github/tmp_training_bundle_cache_hardening.py
          python -m py_compile platform_core/training_bundle_cache.py platform_core/training_tasks.py

      - name: Commit verified hardening and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/tmp-training-bundle-cache-hardening.yml \
            .github/tmp_training_bundle_cache_hardening.py \
            .github/tmp_training_bundle_cache_hardening_fix.py
          git add \
            platform_core/training_bundle_cache.py \
            platform_core/training_tasks.py \
            tests/unit/test_training_bundle_cache.py \
            docs/CODEX_CURRENT_STATE.md
          git commit -m "fix(training): harden verified bundle cache admission"

      - name: Upload commit object
        run: git push origin HEAD:refactor/frontend-runtime-stabilization
