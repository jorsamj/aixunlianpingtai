name: Sync Product Phase2 Training Progress Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_product_phase2_training_progress_handoff.py
      - .github/workflows/sync-product-phase2-training-progress-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize authority docs
        run: python tools/sync_product_phase2_training_progress_handoff.py
      - name: Verify authority docs
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('AGENTS.md'),
              Path('docs/TECH_DEBT_CLOSURE_V42_25.md'),
              Path('docs/CODEX_CURRENT_STATE.md'),
              Path('docs/frontend-legacy-audit.md'),
              Path('docs/FRONTEND_OWNER_MAP_V42_25.md'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              for value in [
                  '4f0ac51b28d3e62da183e82e01a55bedf7fc9e16',
                  'Unified Task Progress Phase 2',
                  'Training Progress v2 CLOSED',
                  '34730431744',
                  '34730512607',
                  '33/33 PASS',
                  'SSE/event stream evaluation DEFERRED',
                  'ZIP 10k import scalability',
              ]:
                  assert value in text, (path, value)
          PY
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit synchronized handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git diff --cached --check
          git commit -m "docs: record Phase 2 and training progress acceptance"
          git push origin HEAD:refactor/frontend-runtime-stabilization
