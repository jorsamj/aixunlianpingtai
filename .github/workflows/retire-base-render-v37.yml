name: Retire baseRenderV37 Wrapper

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_base_render_v37.py
      - .github/workflows/retire-base-render-v37.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser-test backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded baseRenderV37 retirement
        run: python tools/retire_base_render_v37.py
      - name: Verify focused static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/post-render-normalization-owner.test.mjs tests/frontend/version-marker-owner.test.mjs tests/frontend/render-owner-retirement.test.mjs tests/frontend/navigation-stability.test.mjs
          if grep -F -n 'baseRenderV37' static/app.js; then
            echo 'retired baseRenderV37 wrapper remains' >&2
            exit 1
          fi
          grep -Fq "const V42='42.24.0';" static/app.js
          grep -Fq 'state.versionInfo={...(state.versionInfo||{}),version:V42};' static/app.js
          grep -Fq 'const baseModalV37=modal;' static/app.js
          grep -Fq '/static/app.js?v=42.25.70' static/index.html
      - name: Verify existing formal-version and modal behavior contracts
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep "formal version marker stays stable|modal table wrapping and first-field focus survive normalization ownership"
      - name: Commit baseRenderV37 retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/post-render-normalization-owner.test.mjs
          git commit -m 'refactor(ui): retire duplicate baseRenderV37 wrapper'
          git push
