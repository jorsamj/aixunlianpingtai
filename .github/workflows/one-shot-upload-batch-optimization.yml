name: One-shot Plain Upload Batch Optimization

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/one-shot-upload-batch-optimization.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact manager reuse and response truth migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          init_anchor = '        "annotation_repository": None,\n    }\n'
          if text.count(init_anchor) != 1:
              raise SystemExit('batch initializer anchor changed; refusing blind patch')
          text = text.replace(
              init_anchor,
              '        "annotation_repository": None,\n'
              '        # Storage source schema/provider/credential setup is request-scoped,\n'
              '        # not image-scoped. Reuse one manager across the whole import batch.\n'
              '        "storage_manager": None,\n'
              '    }\n',
              1,
          )

          if 'def _v50_storage_manager(' in text:
              raise SystemExit('storage manager helper already exists; refusing duplicate migration')
          annotation_start = text.index('def _v50_annotation_repository(project_id: str) -> AnnotationRepository:')
          queue_start = text.index('def _v50_queue_image_patch(', annotation_start)
          annotation_block = text[annotation_start:queue_start]
          if 'return AnnotationRepository(project_dir(project_id))' not in annotation_block:
              raise SystemExit('annotation repository helper contract changed')
          helper = '''def _v50_storage_manager(project_id: str) -> StorageManager:\n    batch = _v50_active_image_batch(project_id)\n    if batch is not None:\n        manager = batch.get("storage_manager")\n        if manager is None:\n            manager = storage_manager(project_id)\n            batch["storage_manager"] = manager\n        return manager\n    return storage_manager(project_id)\n\n\n'''
          text = text[:queue_start] + helper + text[queue_start:]

          add_start = text.index('def add_image_record(')
          add_end = text.index('\ndef zip_dir(', add_start)
          add_body = text[add_start:add_end]
          replacements = [
              (
                  '    source_config = storage_source_repository().get(storage_source_id)\n',
                  '    manager = _v50_storage_manager(project_id)\n'
                  '    source_config = manager.sources.get(storage_source_id)\n',
                  'storage source lookup',
              ),
              (
                  '    metadata = storage_manager(project_id).upload_object(\n',
                  '    metadata = manager.upload_object(\n',
                  'storage upload manager',
              ),
              (
                  '            storage_manager(project_id).delete_source_file(record)\n',
                  '            manager.delete_source_file(record)\n',
                  'storage rollback manager',
              ),
          ]
          for old, new, label in replacements:
              occurrences = add_body.count(old)
              if occurrences != 1:
                  raise SystemExit(f'{label} count={occurrences}; refusing blind patch')
              add_body = add_body.replace(old, new, 1)
          text = text[:add_start] + add_body + text[add_end:]

          upload_start = text.index('@app.post("/api/projects/{project_id}/images")')
          upload_end = text.index('\n\n_ANNOTATION_INDEX_LOCK', upload_start)
          upload_body = text[upload_start:upload_end]
          old_commit = '        _v50_end_image_batch(save=True)\n'
          if upload_body.count(old_commit) != 1:
              raise SystemExit('plain upload batch commit contract changed')
          new_commit = '''        committed = _v50_end_image_batch(save=True)\n        if committed:\n            committed_by_id = {\n                str(item.get("id")): item for item in committed\n            }\n            uploaded = [\n                dict(committed_by_id.get(str(item.get("id"))) or item)\n                for item in uploaded\n            ]\n'''
          upload_body = upload_body.replace(old_commit, new_commit, 1)
          text = text[:upload_start] + upload_body + text[upload_end:]
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/api/test_upload_batch_performance_truth.py')
          tests = test_path.read_text(encoding='utf-8')
          setup_anchor = '''    project_id = client.post(\n        "/api/projects", json={"name": "plain-upload-batch", "labels": []}\n    ).json()["id"]\n\n'''
          if tests.count(setup_anchor) != 1:
              raise SystemExit('upload performance test setup anchor changed')
          setup_extra = '''    original_storage_manager = app_module.storage_manager\n    storage_manager_calls = 0\n\n    def counted_storage_manager(project):\n        nonlocal storage_manager_calls\n        storage_manager_calls += 1\n        return original_storage_manager(project)\n\n    monkeypatch.setattr(app_module, "storage_manager", counted_storage_manager)\n\n'''
          tests = tests.replace(setup_anchor, setup_anchor + setup_extra, 1)

          assert_anchor = '''    assert body["uploaded_count"] == 12\n    assert body["failed_count"] == 0\n'''
          if tests.count(assert_anchor) != 1:
              raise SystemExit('upload performance test assertion anchor changed')
          assert_extra = '''    assert storage_manager_calls == 1\n    assert all(item.get("annotation_summary_at") for item in body["uploaded"])\n    assert all(item.get("annotation_state") == "unannotated" for item in body["uploaded"])\n'''
          tests = tests.replace(assert_anchor, assert_anchor + assert_extra, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Compile changed runtime
        run: python -m py_compile app.py tests/api/test_upload_batch_performance_truth.py
      - name: Verify upload manager reuse and existing upload-clean flow
        run: >-
          python -m pytest -q
          tests/api/test_upload_batch_performance_truth.py
          tests/api/test_upload_clean_flow.py
          tests/unit/test_material_upload_cleaning_performance.py
      - name: Permanent invariants before commit
        shell: bash
        run: |
          grep -Fq '"storage_manager": None' app.py
          grep -Fq 'def _v50_storage_manager(project_id: str) -> StorageManager:' app.py
          grep -Fq 'source_config = manager.sources.get(storage_source_id)' app.py
          grep -Fq 'metadata = manager.upload_object(' app.py
          grep -Fq 'committed = _v50_end_image_batch(save=True)' app.py
          grep -Fq 'assert storage_manager_calls == 1' tests/api/test_upload_batch_performance_truth.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tests/api/test_upload_batch_performance_truth.py
          git commit -m 'perf(materials): reuse upload storage runtime per batch'
          git push origin HEAD:refactor/frontend-runtime-stabilization
