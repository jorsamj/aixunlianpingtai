name: One-shot Plain Upload Batch Optimization

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - '.github/workflows/one-shot-upload-batch-optimization.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact manager reuse and response truth migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old_begin = '''def _v50_begin_image_batch(project_id: str):
              _IMAGE_BATCH_CTX.batch = {
                  "project_id": project_id,
                  "records": {},
                  "patches": {},
                  # New-image annotations are buffered with the material rows and
                  # committed once per request/import batch. Existing-image writes
                  # stay immediate so their independent update semantics do not change.
                  "annotations": {},
                  "annotation_repository": None,
              }
          '''
          new_begin = '''def _v50_begin_image_batch(project_id: str):
              _IMAGE_BATCH_CTX.batch = {
                  "project_id": project_id,
                  "records": {},
                  "patches": {},
                  # New-image annotations are buffered with the material rows and
                  # committed once per request/import batch. Existing-image writes
                  # stay immediate so their independent update semantics do not change.
                  "annotations": {},
                  "annotation_repository": None,
                  # Storage source schema/provider/credential setup is request-scoped,
                  # not image-scoped. Reuse one manager across the whole import batch.
                  "storage_manager": None,
              }
          '''
          if old_begin not in text:
              raise SystemExit('batch initializer contract changed; refusing blind patch')
          text = text.replace(old_begin, new_begin, 1)

          marker = '''def _v50_annotation_repository(project_id: str) -> AnnotationRepository:
              batch = _v50_active_image_batch(project_id)
              if batch is not None:
                  repository = batch.get("annotation_repository")
                  if repository is None:
                      repository = AnnotationRepository(project_dir(project_id))
                      batch["annotation_repository"] = repository
                  return repository
              return AnnotationRepository(project_dir(project_id))
          '''
          replacement = marker + '''\n\ndef _v50_storage_manager(project_id: str) -> StorageManager:
              batch = _v50_active_image_batch(project_id)
              if batch is not None:
                  manager = batch.get("storage_manager")
                  if manager is None:
                      manager = storage_manager(project_id)
                      batch["storage_manager"] = manager
                  return manager
              return storage_manager(project_id)
          '''
          if marker not in text:
              raise SystemExit('annotation repository helper changed; refusing blind patch')
          text = text.replace(marker, replacement, 1)

          old_source = '''    source_config = storage_source_repository().get(storage_source_id)
              if source_config is None:
          '''
          new_source = '''    manager = _v50_storage_manager(project_id)
              source_config = manager.sources.get(storage_source_id)
              if source_config is None:
          '''
          if old_source not in text:
              raise SystemExit('storage source lookup changed; refusing blind patch')
          text = text.replace(old_source, new_source, 1)

          old_upload = '''    metadata = storage_manager(project_id).upload_object(
              storage_source_id, object_key, src,
              content_type=f"image/{'jpeg' if ext in {'.jpg', '.jpeg'} else ext.lstrip('.')}",
          )
          '''
          new_upload = '''    metadata = manager.upload_object(
              storage_source_id, object_key, src,
              content_type=f"image/{'jpeg' if ext in {'.jpg', '.jpeg'} else ext.lstrip('.')}",
          )
          '''
          if old_upload not in text:
              raise SystemExit('storage upload block changed; refusing blind patch')
          text = text.replace(old_upload, new_upload, 1)

          old_cleanup = '''        try:
              storage_manager(project_id).delete_source_file(record)
          except Exception:
              pass
          '''
          new_cleanup = '''        try:
              manager.delete_source_file(record)
          except Exception:
              pass
          '''
          # This exact block occurs in add_image_record and should change once.
          if old_cleanup not in text:
              raise SystemExit('add_image_record cleanup block changed; refusing blind patch')
          text = text.replace(old_cleanup, new_cleanup, 1)

          old_commit = '''        _v50_end_image_batch(save=True)
              except Exception:
                  if _v50_active_image_batch(project_id):
                      _v50_end_image_batch(save=False)
                  raise

              upload_batch_store(project_id).create(
          '''
          new_commit = '''        committed = _v50_end_image_batch(save=True)
              if committed:
                  committed_by_id = {
                      str(item.get("id")): item for item in committed
                  }
                  uploaded = [
                      dict(committed_by_id.get(str(item.get("id"))) or item)
                      for item in uploaded
                  ]
              except Exception:
                  if _v50_active_image_batch(project_id):
                      _v50_end_image_batch(save=False)
                  raise

              upload_batch_store(project_id).create(
          '''
          if old_commit not in text:
              raise SystemExit('plain upload commit block changed; refusing blind patch')
          text = text.replace(old_commit, new_commit, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/api/test_upload_batch_performance_truth.py')
          tests = test_path.read_text(encoding='utf-8')
          old_project = '''    project_id = client.post(
                  "/api/projects", json={"name": "plain-upload-batch", "labels": []}
              ).json()["id"]

              def unexpected_material_upsert(_self, _record):
          '''
          new_project = '''    project_id = client.post(
                  "/api/projects", json={"name": "plain-upload-batch", "labels": []}
              ).json()["id"]

              original_storage_manager = app_module.storage_manager
              storage_manager_calls = 0

              def counted_storage_manager(project):
                  nonlocal storage_manager_calls
                  storage_manager_calls += 1
                  return original_storage_manager(project)

              monkeypatch.setattr(app_module, "storage_manager", counted_storage_manager)

              def unexpected_material_upsert(_self, _record):
          '''
          if old_project not in tests:
              raise SystemExit('upload performance test setup changed; refusing blind patch')
          tests = tests.replace(old_project, new_project, 1)

          old_assert = '''    assert body["uploaded_count"] == 12
              assert body["failed_count"] == 0

              materials = MaterialRepository(app_module.project_dir(project_id))
          '''
          new_assert = '''    assert body["uploaded_count"] == 12
              assert body["failed_count"] == 0
              assert storage_manager_calls == 1
              assert all(item.get("annotation_summary_at") for item in body["uploaded"])
              assert all(item.get("annotation_state") == "unannotated" for item in body["uploaded"])

              materials = MaterialRepository(app_module.project_dir(project_id))
          '''
          if old_assert not in tests:
              raise SystemExit('upload performance test assertion block changed; refusing blind patch')
          tests = tests.replace(old_assert, new_assert, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Compile changed runtime
        run: python -m py_compile app.py tests/api/test_upload_batch_performance_truth.py
      - name: Verify upload manager reuse and existing upload-clean flow
        run: >-
          python -m pytest -q
          tests/api/test_upload_batch_performance_truth.py
          tests/api/test_upload_clean_flow.py
          tests/unit/test_material_upload_cleaning_performance.py
      - name: Permanent invariants before commit
        shell: bash
        run: |
          grep -Fq '"storage_manager": None' app.py
          grep -Fq 'def _v50_storage_manager(project_id: str) -> StorageManager:' app.py
          grep -Fq 'source_config = manager.sources.get(storage_source_id)' app.py
          grep -Fq 'committed = _v50_end_image_batch(save=True)' app.py
          grep -Fq 'assert storage_manager_calls == 1' tests/api/test_upload_batch_performance_truth.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py tests/api/test_upload_batch_performance_truth.py
          git commit -m 'perf(materials): reuse upload storage runtime per batch'
          git push origin HEAD:refactor/frontend-runtime-stabilization
