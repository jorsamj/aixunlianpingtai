name: Sync Task Cancel Resume Closure Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/sync-task-cancel-resume-closure-docs.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
      - name: Append authority closure evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evidence = {
              "RED contract": "a7d70f7b3106d32c62f01c45de89e8a4c3fb0807 / Release Regression 34748866897",
              "product": "7cab9413185d0bfbc8052d978685ee7a2e8b46d0",
              "migration GREEN": "34749215356",
              "permanentization": "dfa9623ad75eab9d7e0945cd45051688492e87f8",
              "release": "34749914123 PASS",
              "frontend": "34749914114 PASS (frontend + Real Chrome)",
              "navigation": "34749914211 PASS (including Real Chrome stale-mutation contract)",
          }

          blocks = {
              Path("docs/TECH_DEBT_CLOSURE_V42_25.md"): """

## 2026-09-13 — Durable task cancel→resume fencing CLOSED

A real control-plane race was proven: after `request_cancel()` had persisted `CANCEL_REQUESTED` + `stage=cancelling`, a stale/late explicit resume path could still call `TaskRepository.set_stage(..., \"training\")` because `set_stage()` accepted both `RUNNING` and `CANCEL_REQUESTED`. This violated monotonic durable task truth.

- RED contract: `a7d70f7b3106d32c62f01c45de89e8a4c3fb0807`; Release Regression `34748866897` failed only the new cancel→resume fencing contract while the rest of runtime contracts remained green.
- Product fix: `7cab9413185d0bfbc8052d978685ee7a2e8b46d0` — `set_stage()` now accepts only persisted `RUNNING`; `CANCEL_REQUESTED` remains `cancelling` until worker/lease convergence to a terminal state.
- Focused migration GREEN: `34749215356` PASS.
- Permanent guard/cleanup: `dfa9623ad75eab9d7e0945cd45051688492e87f8`; permanent repository race contract retained, real v48 durable training pause→resume→stop API regression added, late resume after stop must be rejected, temporary migration helper/workflow removed.
- Cleaned HEAD gates: Release Regression `34749914123` PASS; Frontend Runtime `34749914114` PASS including Real Chrome; Navigation Action Fencing `34749914211` PASS including Real Chrome stale-mutation contract.
- Release boundary unchanged: `VERSION.txt = 42.24.0`; no merge/tag/release; A800 RC remains deferred.
""",
              Path("docs/CODEX_CURRENT_STATE.md"): """

### 2026-09-13 — Durable task control cancel→resume race CLOSED

The durable task runtime now enforces a monotonic cancel boundary. Once persisted status becomes `CANCEL_REQUESTED`, explicit stage mutation/resume can no longer move the task back to `training`; `stage=cancelling` remains authoritative until terminal convergence. Product `7cab9413185d0bfbc8052d978685ee7a2e8b46d0`; permanentization `dfa9623ad75eab9d7e0945cd45051688492e87f8`. RED evidence: `a7d70f7b3106d32c62f01c45de89e8a4c3fb0807` / run `34748866897`. Final cleaned gates: Release `34749914123`, Frontend + Real Chrome `34749914114`, Navigation + Real Chrome `34749914211`, all PASS. Formal `VERSION.txt` remains `42.24.0`; A800 RC remains deferred.
""",
              Path("docs/frontend-legacy-audit.md"): """

### 2026-09-13 cross-layer guard — durable cancel/resume truth CLOSED

Frontend/API control semantics are now fenced by durable server truth: ordinary v48 resume already rejects non-`RUNNING+paused`; the repository additionally rejects `set_stage()` once persisted status is `CANCEL_REQUESTED`, closing the concurrent stop/resume race rather than relying on the browser or an earlier API read. Real API regression is permanently included in `v42.25 Release Regression`; product `7cab9413185d0bfbc8052d978685ee7a2e8b46d0`, permanentization `dfa9623ad75eab9d7e0945cd45051688492e87f8`, Release `34749914123` PASS, Frontend Real Chrome `34749914114` PASS, Navigation Real Chrome `34749914211` PASS.
""",
              Path("docs/FRONTEND_OWNER_MAP_V42_25.md"): """

### 2026-09-13 training control truth boundary — CLOSED

`v48_pause_job` / `v48_resume_job` / `v48_stop_job` remain API control owners, but task lifecycle truth is owned by the durable repository. `TaskRepository.set_stage()` is now valid only for persisted `RUNNING`; `CANCEL_REQUESTED + cancelling` cannot be resumed by a stale control request. The permanent v48 API regression proves normal pause→resume still works and stop→late-resume is rejected. Product `7cab9413185d0bfbc8052d978685ee7a2e8b46d0`; permanentization `dfa9623ad75eab9d7e0945cd45051688492e87f8`; cleaned gates `34749914123` / `34749914114` / `34749914211` all PASS.
""",
          }

          marker = "Durable task cancel→resume fencing CLOSED"
          for path, block in blocks.items():
              text = path.read_text(encoding="utf-8")
              local_marker = block.strip().splitlines()[0].lstrip("# ")
              if local_marker in text:
                  raise SystemExit(f"closure block already present in {path}")
              path.write_text(text.rstrip() + "\n" + block.strip("\n") + "\n", encoding="utf-8")
              print(f"UPDATED={path}")
          PY
      - name: Commit authority docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git diff --cached --quiet && { echo "no authority doc diff" >&2; exit 1; }
          git commit -m "docs(tasks): close cancel-resume fencing batch"
          git push origin HEAD:refactor/frontend-runtime-stabilization
