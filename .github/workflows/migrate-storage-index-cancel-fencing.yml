name: Migrate Storage Index Cancel Fencing

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-storage-index-cancel-fencing.yml
      - tools/migrate_storage_index_cancel_fencing.py
      - tests/integration/test_storage_index_cancel_fencing.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Prove old product is RED
        run: |
          set +e
          python -m pytest -q tests/integration/test_storage_index_cancel_fencing.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected the unfixed product to fail the indexing cancellation contract."
            exit 1
          fi
          echo "Baseline RED proven with exit code $code."
      - name: Apply precise migration
        run: python tools/migrate_storage_index_cancel_fencing.py
      - name: Syntax and diff checks
        run: |
          python -m py_compile platform_core/storage/import_tasks.py
          git diff --check
      - name: Focused cancellation GREEN
        run: python -m pytest -q tests/integration/test_storage_index_cancel_fencing.py
      - name: Storage import regressions
        run: >-
          python -m pytest -q
          tests/unit/storage/test_import_scan_cancel_fencing.py
          tests/unit/storage/test_import_candidates.py
          tests/unit/storage/test_yolo_import.py
          tests/integration/test_storage_import_worker.py
      - name: Formal version boundary
        run: test "$(tr -d '\r\n ' < VERSION.txt)" = "42.24.0"
      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/storage/import_tasks.py
          git diff --cached --quiet && { echo "migration produced no product diff"; exit 1; }
          git commit -m "fix(storage): fence indexing writes after cancellation"
          git push origin HEAD:refactor/frontend-runtime-stabilization
