name: Navigation Action Fencing

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
  workflow_dispatch:

jobs:
  action-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2

      - name: Syntax check
        run: >-
          node --check static/app.js &&
          node --check static/modules/navigation-stability.js &&
          node --check static/main.mjs

      - name: Permanent action fencing source guard
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          app = Path('static/app.js').read_text(encoding='utf-8')
          nav = Path('static/modules/navigation-stability.js').read_text(encoding='utf-8')

          if 'action(ownerPage = currentState().page)' not in nav:
              raise SystemExit('NavigationStability action fence API is missing')
          for required in ('isCurrent: current', 'commit(effect)'):
              if required not in nav:
                  raise SystemExit(f'action fence contract is incomplete: {required}')

          for page in ('训练资源', '模型配置', '部署转换', '训练任务'):
              if re.search(rf"state\.page\s*=\s*['\"]{re.escape(page)}['\"]", app):
                  raise SystemExit(f'direct fixed-page business write reintroduced: {page}')

          retired_renderer = "if(state.page==='新建算法'||state.page==='自动迭代')state.page='算法列表'"
          if retired_renderer in app:
              raise SystemExit('renderer-owned legacy page rewrite was reintroduced')

          save_server = re.search(r"window\.saveServer=async\(\)=>\{[^\n]+\};", app)
          if not save_server:
              raise SystemExit('live saveServer owner not found')
          owner = save_server.group(0)
          for required in ('NavigationStability?.action?.(state.page)', 'action&&!action.isCurrent()'):
              if required not in owner:
                  raise SystemExit(f'saveServer stale completion fence missing: {required}')
          PY

      - name: Action fence unit contracts
        run: node --test tests/frontend/navigation-action-fencing.test.mjs tests/frontend/navigation-stability.test.mjs

      - name: Real Chrome stale mutation contract
        run: npx playwright test tests/browser/navigation-action-fencing.spec.mjs
