name: Add Training Poll Guard

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_training_poll_guard.py
      - .github/workflows/add-training-poll-guard.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply permanent guard migration
        run: python tools/add_training_poll_guard.py
      - name: Verify workflow guard text
        run: |
          grep -Fq 'Training PollRegistry direct owner guard' .github/workflows/frontend-runtime-stabilization.yml
          grep -Fq "jobPollTimer" .github/workflows/frontend-runtime-stabilization.yml
          grep -Fq 'installPollingCreationBridge' .github/workflows/frontend-runtime-stabilization.yml
          grep -Fq 'replaceTrainingJobTimer();' .github/workflows/frontend-runtime-stabilization.yml
      - name: Commit workflow guard
        run: |
          if git diff --quiet -- .github/workflows/frontend-runtime-stabilization.yml; then
            echo 'no workflow change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/frontend-runtime-stabilization.yml
          git commit -m 'ci(ui): guard direct training PollRegistry ownership'
          git push
