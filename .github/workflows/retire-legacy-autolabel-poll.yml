name: Retire Legacy AutoLabel Poll Owners

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_legacy_autolabel_poll_owners.py
      - .github/workflows/retire-legacy-autolabel-poll.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded migration
        run: python tools/retire_legacy_autolabel_poll_owners.py
      - name: Verify syntax and AutoLabel runtime contracts
        run: |
          node --check static/app.js
          node --check static/modules/auto-label-poll-runtime.js
          node --test tests/frontend/auto-label-poll-runtime.test.mjs
          if grep -n -E 'auto422Timer|ai60ListTimer' static/app.js; then
            echo 'legacy AutoLabel timer owner remains in static/app.js' >&2
            exit 1
          fi
          if ! grep -Fq 'window.AutoLabelPollRuntime?.activate?.(state.annotationTasks60);' static/app.js; then
            echo 'v60 renderer does not hand polling to AutoLabelPollRuntime' >&2
            exit 1
          fi
          if ! grep -Fq 'window.AutoLabelPollRuntime?.deactivate?.();' static/app.js; then
            echo 'clean tab does not deactivate managed AutoLabel polling' >&2
            exit 1
          fi
      - name: Commit migrated app.js
        run: |
          if git diff --quiet -- static/app.js; then
            echo 'no app.js changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js
          git commit -m 'refactor(ui): retire legacy AutoLabel poll owners'
          git push
