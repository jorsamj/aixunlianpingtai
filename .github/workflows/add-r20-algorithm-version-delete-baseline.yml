name: Add R20 Algorithm Version Delete Baseline

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/add_r20_algorithm_version_delete_baseline.py
      - .github/workflows/add-r20-algorithm-version-delete-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Add behavior baseline
        run: python tools/add_r20_algorithm_version_delete_baseline.py
      - name: Verify behavior baseline
        run: npx playwright test tests/browser/algorithm-list-performance.spec.mjs --grep "algorithm version deletion stays functional before scoped refresh migration"
      - name: Commit behavior baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/algorithm-list-performance.spec.mjs
          git diff --cached --quiet && { echo 'No baseline changes'; exit 1; }
          git commit -m 'test(ui): lock algorithm version delete behavior'
          git push origin HEAD:refactor/frontend-runtime-stabilization
