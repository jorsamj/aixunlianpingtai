name: Sync Storage Index Cancel Closure 20260913

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/sync-storage-index-cancel-closure-20260913.yml
      - tools/sync_storage_index_cancel_closure_20260913.py

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified closure evidence
        run: python tools/sync_storage_index_cancel_closure_20260913.py
      - name: Verify authority marker and version boundary
        run: |
          marker='<!-- V42.25_STORAGE_INDEX_CANCEL_CLOSURE_20260913 -->'
          for doc in \
            docs/TECH_DEBT_CLOSURE_V42_25.md \
            docs/CODEX_CURRENT_STATE.md \
            docs/frontend-legacy-audit.md \
            docs/FRONTEND_OWNER_MAP_V42_25.md; do
            grep -Fq "$marker" "$doc"
          done
          test "$(tr -d '\r\n ' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit authority doc sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/TECH_DEBT_CLOSURE_V42_25.md \
            docs/CODEX_CURRENT_STATE.md \
            docs/frontend-legacy-audit.md \
            docs/FRONTEND_OWNER_MAP_V42_25.md
          git diff --cached --quiet && { echo "authority docs already synchronized"; exit 0; }
          git commit -m "docs(v42.25): record storage indexing cancellation closure"
          git push origin HEAD:refactor/frontend-runtime-stabilization
