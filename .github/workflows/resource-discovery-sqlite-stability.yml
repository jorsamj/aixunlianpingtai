name: Resource Discovery SQLite Stability

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
      - main
    paths:
      - app.py
      - static/modules/resource-discovery.js
      - platform_core/resource_discovery/cache.py
      - platform_core/resource_discovery/request_scope.py
      - platform_core/resource_discovery/scanner.py
      - platform_core/resource_discovery/tasks.py
      - tests/unit/test_resource_discovery_sqlite_lifecycle.py
      - tests/unit/test_resource_discovery_scope_contract.py
      - .github/workflows/resource-discovery-sqlite-stability.yml
  pull_request:
    paths:
      - app.py
      - static/modules/resource-discovery.js
      - platform_core/resource_discovery/cache.py
      - platform_core/resource_discovery/request_scope.py
      - platform_core/resource_discovery/scanner.py
      - platform_core/resource_discovery/tasks.py
      - tests/unit/test_resource_discovery_sqlite_lifecycle.py
      - tests/unit/test_resource_discovery_scope_contract.py
      - .github/workflows/resource-discovery-sqlite-stability.yml
  workflow_dispatch:

jobs:
  sqlite-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lifecycle test dependencies
        run: python -m pip install --disable-pip-version-check pytest filelock psutil
      - name: Compile resource discovery contracts
        run: python -m py_compile app.py platform_core/resource_discovery/cache.py platform_core/resource_discovery/request_scope.py platform_core/resource_discovery/scanner.py platform_core/resource_discovery/tasks.py tests/unit/test_resource_discovery_sqlite_lifecycle.py tests/unit/test_resource_discovery_scope_contract.py
      - name: SQLite lifecycle and durable discovery-scope guards
        run: python -m pytest --confcutdir=tests/unit -q tests/unit/test_resource_discovery_sqlite_lifecycle.py tests/unit/test_resource_discovery_scope_contract.py
