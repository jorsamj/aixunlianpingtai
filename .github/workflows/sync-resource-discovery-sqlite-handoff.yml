name: Sync Resource Discovery SQLite Handoff

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_resource_discovery_sqlite_handoff.py
      - .github/workflows/sync-resource-discovery-sqlite-handoff.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded Resource Discovery SQLite handoff synchronization
        run: python tools/sync_resource_discovery_sqlite_handoff.py
      - name: Verify release and acceptance boundaries
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq 'c6ac70b670a6297ccba065854779c10b8ca47cf3' AGENTS.md
          grep -Fq '34700900542' docs/CODEX_CURRENT_STATE.md
          grep -Fq 'CODE-LEVEL CLOSED; production soak OPEN' docs/TECH_DEBT_CLOSURE_V42_25.md
          grep -Fq 'Navigation Action Fencing' AGENTS.md
      - name: Commit authority docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/CODEX_CURRENT_STATE.md docs/TECH_DEBT_CLOSURE_V42_25.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/frontend-legacy-audit.md
          git diff --cached --quiet && { echo 'No docs changes'; exit 1; }
          git commit -m "docs: synchronize Resource Discovery SQLite acceptance"
          git push origin HEAD:refactor/frontend-runtime-stabilization
