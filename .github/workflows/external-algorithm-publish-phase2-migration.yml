name: External Algorithm Publish Phase 2 Migration

on:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - tools/migrate_external_algorithm_publish_phase2.py
      - .github/workflows/external-algorithm-publish-phase2-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-algorithm-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded phase2 wiring migration
        run: python tools/migrate_external_algorithm_publish_phase2.py
      - name: Static syntax checks
        run: |
          python -m py_compile platform_core/external_algorithm_publish.py app.py
          node --check static/modules/external-algorithm-publish.js
      - name: Commit phase2 wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/main.mjs static/index.html
          git commit -m "feat(external-publish): wire artifact publishing runtime"
          git push origin HEAD:feature/external-algorithm-publishing
