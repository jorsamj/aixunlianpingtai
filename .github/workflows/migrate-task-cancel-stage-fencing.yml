name: Migrate Task Cancel Stage Fencing

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-task-cancel-stage-fencing.yml
      - tools/migrate_task_cancel_stage_fencing.py

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Apply exact migration
        run: python tools/migrate_task_cancel_stage_fencing.py
      - name: Focused GREEN contracts
        run: >-
          python -m pytest -q
          tests/unit/task_runtime/test_control_stage_fencing.py
          tests/unit/task_runtime/test_repository.py
          tests/unit/task_runtime/test_fencing.py
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/task_runtime/repository.py
          git diff --cached --quiet && { echo "migration produced no product diff" >&2; exit 1; }
          git commit -m "fix(tasks): make cancel-requested stage monotonic"
          git push origin HEAD:refactor/frontend-runtime-stabilization
