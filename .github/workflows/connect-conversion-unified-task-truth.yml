name: Connect Conversion Unified Task Truth

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/connect_conversion_unified_task_truth.py
      - .github/workflows/connect-conversion-unified-task-truth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply conversion unified task truth integration
        run: python tools/connect_conversion_unified_task_truth.py
      - name: Syntax
        run: |
          python -m py_compile app.py
          node --check static/app.js
      - name: Focused frontend contract
        run: node --test tests/frontend/conversion-unified-task-truth.test.mjs
      - name: Install focused API dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest httpx
      - name: Conversion durable overlay contract
        run: python -m pytest -q tests/api/test_conversion_unified_task_truth.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated conversion integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/app.js tests/api/test_conversion_unified_task_truth.py tests/frontend/conversion-unified-task-truth.test.mjs
          git diff --cached --check
          git commit -m "feat(tasks): expose durable conversion queue truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
