name: Material Upload Chunking

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - 'app.py'
      - 'static/index.html'
      - 'static/material-upload-bootstrap.mjs'
      - 'static/modules/material-upload-runtime.js'
      - 'tests/frontend/material-upload-runtime.test.mjs'
      - 'tests/browser/material-upload-chunking.spec.mjs'
      - '.github/workflows/material-upload-chunking.yml'

jobs:
  frontend-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: >-
          node --check static/modules/material-upload-runtime.js &&
          node --check static/material-upload-bootstrap.mjs &&
          node --check tests/browser/material-upload-chunking.spec.mjs
      - name: Chunking and server-confirmed progress contracts
        run: node --test tests/frontend/material-upload-runtime.test.mjs
      - name: Permanent chunk upload guards
        shell: bash
        run: |
          grep -Fq 'DEFAULT_UPLOAD_CHUNK_SIZE = 64' static/modules/material-upload-runtime.js
          grep -Fq 'DEFAULT_UPLOAD_CHUNK_BYTES = 128 * 1024 * 1024' static/modules/material-upload-runtime.js
          grep -Fq 'uploadMaterialFilesSequentially' static/modules/material-upload-runtime.js
          grep -Fq "type: 'chunk-committed'" static/modules/material-upload-runtime.js
          grep -Fq 'window.doUploadImages426 = input =>' static/modules/material-upload-runtime.js
          grep -Fq 'window.uploadData424 = () =>' static/modules/material-upload-runtime.js
          grep -Fq 'material-upload-bootstrap.mjs?v=422529' static/index.html
          grep -Fq 'materialUploadRuntime = runtime' static/material-upload-bootstrap.mjs
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check

  real-chrome-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome chunked upload truth
        run: npx playwright test tests/browser/material-upload-chunking.spec.mjs
