name: Migrate R20f Model Config Save Refresh

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_r20f_model_config_save_refresh.py
      - .github/workflows/migrate-r20f-model-config-save-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded R20f migration
        run: python tools/migrate_r20f_model_config_save_refresh.py
      - name: Syntax check
        run: node --check static/app.js
      - name: Frontend owner tests
        run: node --test tests/frontend/*.test.mjs
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Run focused R20f Chrome contract
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep 'model config save appears immediately without broad related refresh'
      - name: Commit accepted R20f product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/model-config-save-refresh-owner.test.mjs
          git commit -m 'refactor(ui): scope model config save refresh'
          git push
