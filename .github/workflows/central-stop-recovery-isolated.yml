# P0-01C-3A: in-memory-only stop recovery protocol contract (not production).
# No GPU, SSH, network Node Agent calls, production SQLite, or release endpoint.
name: Central Stop Recovery Isolated Contract
on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - '.github/workflows/central-stop-recovery-isolated.yml'
      - 'tools/poc/central_stop_recovery_contract.py'
      - 'tests/unit/test_central_stop_recovery_contract_poc.py'
      - 'tools/poc/pt_stop_receipt_ed25519_contract.py'
      - 'tests/unit/test_pt_stop_receipt_ed25519_contract.py'
permissions:
  contents: read
concurrency:
  group: central-stop-recovery-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-transaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Ensure isolated test-only module is syntactically valid"
        run: python -m py_compile tools/poc/central_stop_recovery_contract.py tools/poc/pt_stop_receipt_ed25519_contract.py
      - name: "Install test runner"
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: "Assert transaction and fail-closed recovery contracts"
        run: python -m pytest -q --confcutdir=tests/unit tests/unit/test_central_stop_recovery_contract_poc.py tests/unit/test_pt_stop_receipt_ed25519_contract.py
