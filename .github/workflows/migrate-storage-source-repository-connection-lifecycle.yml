name: Migrate Storage Source Repository Connection Lifecycle

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/migrate-storage-source-repository-connection-lifecycle.yml
      - tools/migrate_storage_source_repository_connection_lifecycle.py
      - tests/api/test_storage_source_repository_connection_lifecycle.py

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Baseline StorageSourceRepository lifecycle contract must be RED
        run: |
          set +e
          python -m pytest -q tests/api/test_storage_source_repository_connection_lifecycle.py > /tmp/storage-source-fd-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/storage-source-fd-red.log
          test "$rc" = "1"
          grep -Eq "FAILED|left open|FD/handle growth|explicit_connection_owners" /tmp/storage-source-fd-red.log
      - name: Apply precise storage source connection lifecycle migration
        run: python tools/migrate_storage_source_repository_connection_lifecycle.py
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile platform_core/storage/source_repository.py tools/migrate_storage_source_repository_connection_lifecycle.py tests/api/test_storage_source_repository_connection_lifecycle.py
          git diff --check
      - name: Focused storage source lifecycle contracts
        run: python -m pytest -q tests/api/test_storage_source_repository_connection_lifecycle.py
      - name: Storage and import regressions
        run: >-
          python -m pytest -q
          tests/api/test_storage_sources.py
          tests/api/test_storage_upload.py
          tests/api/test_server_material_import.py
          tests/api/test_material_storage_deletion.py
          tests/api/test_v19_import_scalability.py
          tests/api/test_v19_import_failure_rollback.py
          tests/api/test_zip_processing_p1.py
          tests/api/test_zip_processing_p2b_single_final_annotation.py
          tests/api/test_zip_processing_p2c_structured_single_final_annotation.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_core/storage/source_repository.py
          git diff --cached --check
          git commit -m "fix(storage): close source repository SQLite connections"
          git push origin HEAD:refactor/frontend-runtime-stabilization
