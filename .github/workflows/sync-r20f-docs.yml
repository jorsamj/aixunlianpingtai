name: Sync R20f Ledgers

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_r20f_docs.py
      - .github/workflows/sync-r20f-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize R20f ledgers
        run: python tools/sync_r20f_docs.py
      - name: Validate R20f ledger content
        run: |
          for f in docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md; do
            grep -q 'R20f' "$f"
            grep -q '34690924552' "$f"
            grep -q '28/28' "$f"
            grep -q '42.24.0' "$f"
          done
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --exit-code VERSION.txt
      - name: Commit four ledgers only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md docs/TECH_DEBT_CLOSURE_V42_25.md
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only | grep -qx 'docs/CODEX_CURRENT_STATE.md'
          git diff --cached --name-only | grep -qx 'docs/frontend-legacy-audit.md'
          git diff --cached --name-only | grep -qx 'docs/FRONTEND_OWNER_MAP_V42_25.md'
          git diff --cached --name-only | grep -qx 'docs/TECH_DEBT_CLOSURE_V42_25.md'
          git commit -m 'docs(ui): record R20f model config save ownership'
          git push
