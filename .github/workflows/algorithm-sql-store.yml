name: Algorithm SQL Store

on:
  push:
    branches:
      - feature/external-algorithm-publishing
      - feature/external-algorithm-publishing-sql
      - feature/external-algorithm-publishing-sql-crud
    paths:
      - platform_core/algorithm_sql_store.py
      - platform_core/algorithms.py
      - platform_core/external_algorithm_platform.py
      - platform_core/external_algorithm_publish.py
      - tests/unit/test_algorithm_sql_store.py
      - tests/unit/test_algorithms.py
      - tests/unit/test_external_algorithm_platform.py
      - tests/unit/test_external_algorithm_publish.py
      - tests/frontend/external-algorithm-platform.test.mjs
      - tests/frontend/external-algorithm-publish.test.mjs
      - .github/workflows/algorithm-sql-store.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi requests filelock keyring pillow
      - name: Syntax checks
        run: |
          python -m py_compile platform_core/algorithm_sql_store.py platform_core/algorithms.py platform_core/external_algorithm_platform.py platform_core/external_algorithm_publish.py
          node --check static/modules/external-algorithm-platform.js
          node --check static/modules/external-algorithm-publish.js
      - name: SQL migration and row CRUD contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_algorithm_sql_store.py tests/unit/test_algorithms.py
      - name: External platform contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_platform.py
      - name: External publish contracts
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_external_algorithm_publish.py
      - name: Frontend contracts
        run: |
          node --test tests/frontend/external-algorithm-platform.test.mjs
          node --test tests/frontend/external-algorithm-publish.test.mjs
      - name: Permanent invariants
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -q 'AlgorithmSqlStore' platform_core/algorithms.py
          grep -q 'algorithms.sqlite3' platform_core/algorithm_sql_store.py
          grep -q 'algorithms.json.pre-sql-migration-backup' platform_core/algorithm_sql_store.py
          grep -q 'def attach_version(self, algorithm_id' platform_core/algorithm_sql_store.py
          grep -q 'def patch_version' platform_core/algorithm_sql_store.py
          grep -q 'def rollback_version' platform_core/algorithm_sql_store.py
          grep -q 'def sync_external_algorithms' platform_core/algorithm_sql_store.py
          grep -q 'AlgorithmSqlStore(Path(path)).attach_version' platform_core/algorithms.py
          grep -q 'merged\["id"\] = algorithm_id' platform_core/algorithm_sql_store.py
          ! grep -q 'save_algorithms(algorithms_path, algorithms)' platform_core/external_algorithm_platform.py
          ! grep -q 'atomic_write_json(path, list(algorithms))' platform_core/algorithms.py
          test ! -e tools/migrate_algorithm_store_to_sql.py
          test ! -e tools/migrate_algorithm_sql_row_crud.py
          test ! -e tools/fix_algorithm_sql_row_crud.py
          test ! -e .github/workflows/algorithm-sql-migration-one-shot.yml
          test ! -e .github/workflows/algorithm-sql-crud-one-shot.yml
