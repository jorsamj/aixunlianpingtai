name: Temporary Training Input Windows Diagnostic

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - scripts/tmp_training_input_windows_diag.py
      - .github/workflows/tmp-training-input-windows-diagnostic.yml
  workflow_dispatch:

jobs:
  diagnose-windows-exit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused integrity dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pillow pyyaml filelock requests psutil
      - name: Run isolated subprocess diagnostics
        run: python scripts/tmp_training_input_windows_diag.py
