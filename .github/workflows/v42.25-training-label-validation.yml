name: v42.25 training label validation

on:
  push:
    branches:
      - refactor/v42.25-runtime
  workflow_dispatch:

jobs:
  training-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest pillow pyyaml filelock psutil requests
      - name: Check UI modules
        run: >-
          node --check static/modules/training-labels.js &&
          node --check static/main.mjs &&
          node --test tests/frontend/training-labels.test.mjs
      - name: Run label contract and training data tests
        run: >-
          python -m pytest --noconftest
          tests/unit/test_training_label_contract.py
          tests/unit/test_negative_sample_contract.py
          tests/unit/test_annotation_repository_scope.py
          tests/unit/test_training_splits.py
          tests/unit/test_training_components.py
          tests/unit/test_snapshots.py
          tests/unit/test_portable_dataset.py
          tests/unit/test_training_resource_contract.py
          tests/unit/test_launcher_workers.py
          tests/integration/test_task_worker_without_web.py
          -q
