name: Retire modal426 Wrapper

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/retire_modal426_wrapper.py
      - .github/workflows/retire-modal426-wrapper.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser-test backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply guarded modal426 retirement
        run: python tools/retire_modal426_wrapper.py
      - name: Verify focused static and unit contracts
        run: |
          node --check static/app.js
          node --test tests/frontend/file-input-beautification-owner.test.mjs tests/frontend/render-owner-retirement.test.mjs tests/frontend/navigation-stability.test.mjs
          if grep -F -n 'modal426' static/app.js; then
            echo 'retired modal426 wrapper remains' >&2
            exit 1
          fi
          if grep -F -n 'requestAnimationFrame(()=>beautifyFileInputs426(layer||document))' static/app.js; then
            echo 'retired modal426 RAF callback remains' >&2
            exit 1
          fi
          grep -Fq 'window.beautifyFileInputs426?.(root);' static/app.js
          grep -Fq "observer.observe(modalBody,{childList:true,subtree:true})" static/app.js
          grep -Fq '/static/app.js?v=42.25.68' static/index.html
      - name: Verify modal browser behavior after owner retirement
        run: >-
          npx playwright test tests/browser/navigation-stability.spec.mjs
          --grep "modal file input beautification survives modal lifecycle ownership"
      - name: Commit modal426 retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/file-input-beautification-owner.test.mjs
          git commit -m 'refactor(ui): retire modal426 wrapper'
          git push
