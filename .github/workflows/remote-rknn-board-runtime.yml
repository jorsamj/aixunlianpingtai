name: Remote RKNN Board Runtime Protocol

on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-algorithm-publishing
    paths:
      - 'app.py'
      - 'static/app.js'
      - 'static/index.html'
      - 'tests/browser/model-and-conversion.spec.mjs'
      - 'node_agent.py'
      - 'tools/install_rockchip_agent.sh'
      - 'predict_rknn_lite_runner.py'
      - 'platform_core/rknn_board_runtime.py'
      - 'platform_core/service_nodes.py'
      - 'platform_core/task_node_assignments.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/node_agent_deployment_runtime.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/remote_execution_transport.py'
      - 'tests/unit/test_rknn_board_runtime.py'
      - 'tests/unit/test_node_agent_deployment_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/test_service_nodes.py'
      - 'tests/unit/test_task_node_assignments.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_agent_execution.py'
      - 'tests/api/test_rknn_board_validation.py'
      - '.github/workflows/remote-rknn-board-runtime.yml'
  pull_request:
    branches:
      - main
      - refactor/frontend-runtime-stabilization
    paths:
      - 'app.py'
      - 'static/app.js'
      - 'static/index.html'
      - 'tests/browser/model-and-conversion.spec.mjs'
      - 'node_agent.py'
      - 'tools/install_rockchip_agent.sh'
      - 'predict_rknn_lite_runner.py'
      - 'platform_core/rknn_board_runtime.py'
      - 'platform_core/service_nodes.py'
      - 'platform_core/task_node_assignments.py'
      - 'platform_core/node_agent_executor_loop.py'
      - 'platform_core/node_agent_deployment_runtime.py'
      - 'platform_core/agent_execution.py'
      - 'platform_core/remote_execution_transport.py'
      - 'tests/unit/test_rknn_board_runtime.py'
      - 'tests/unit/test_node_agent_deployment_runtime.py'
      - 'tests/unit/test_node_agent_executor_loop.py'
      - 'tests/unit/test_node_agent_entrypoint.py'
      - 'tests/unit/test_service_nodes.py'
      - 'tests/unit/test_task_node_assignments.py'
      - 'tests/unit/test_remote_execution_transport.py'
      - 'tests/unit/test_agent_execution.py'
      - 'tests/api/test_rknn_board_validation.py'
      - '.github/workflows/remote-rknn-board-runtime.yml'

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install board protocol test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest requests fastapi httpx psutil filelock keyring pillow
      - name: Compile RKNN board protocol
        run: >-
          python -m py_compile
          node_agent.py
          predict_rknn_lite_runner.py
          platform_core/rknn_board_runtime.py
          platform_core/service_nodes.py
          platform_core/task_node_assignments.py
          platform_core/node_agent_executor_loop.py
          platform_core/node_agent_deployment_runtime.py
          platform_core/agent_execution.py
          platform_core/remote_execution_transport.py
          tests/unit/test_rknn_board_runtime.py
          tests/unit/test_node_agent_deployment_runtime.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/unit/test_service_nodes.py
          tests/unit/test_task_node_assignments.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_agent_execution.py
      - name: Linux Rockchip installer syntax
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: bash -n tools/install_rockchip_agent.sh
      - name: RKNN board protocol contracts
        run: >-
          python -m pytest -q --confcutdir=tests/unit
          tests/unit/test_rknn_board_runtime.py
          tests/unit/test_node_agent_deployment_runtime.py
          tests/unit/test_node_agent_executor_loop.py
          tests/unit/test_node_agent_entrypoint.py
          tests/unit/test_service_nodes.py
          tests/unit/test_task_node_assignments.py
          tests/unit/test_remote_execution_transport.py
          tests/unit/test_agent_execution.py
      - name: Protocol does not claim hardware acceptance
        shell: bash
        run: |
          grep -Fq '"deployment-test.rknn"' platform_core/service_nodes.py
          grep -Fq 'probe_rknn_board_runtime' node_agent.py
          grep -Fq -- '--doctor' node_agent.py
          grep -Fq 'deployment-test.rknn' tools/install_rockchip_agent.sh
          grep -Fq 'EnvironmentFile=' tools/install_rockchip_agent.sh
          grep -Fq 'chmod 0600' tools/install_rockchip_agent.sh
          grep -Fq 'ExecStartPre=' tools/install_rockchip_agent.sh
          grep -Fq 'predict_rknn_lite_runner.py' platform_core/node_agent_deployment_runtime.py
          grep -Fq 'hardware runtime verification only' predict_rknn_lite_runner.py
          grep -Fq 'REMOTE_RKNN_BOARD_SOURCE_CHANGED' platform_core/remote_execution_transport.py
          grep -Fq 'hardware_verified' platform_core/remote_execution_transport.py
          grep -Fq '"node_id": node_id' platform_core/remote_execution_transport.py
          grep -Fq '"model_sha256": expected_sha' platform_core/remote_execution_transport.py
          grep -Fq '"verified_at": datetime.now(timezone.utc).isoformat()' platform_core/remote_execution_transport.py
          ! grep -Fq 'sqlite3' platform_core/node_agent_deployment_runtime.py
          ! grep -Fq 'TaskRepository' platform_core/node_agent_deployment_runtime.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install board validation API dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography
      - name: Compile board validation API
        run: >-
          python -m py_compile
          app.py
          platform_core/remote_execution_transport.py
          tests/api/test_rknn_board_validation.py
      - name: Board task creation contracts
        run: >-
          python -m pytest -q
          tests/api/test_rknn_board_validation.py
      - name: API fail-closed guards
        shell: bash
        run: |
          grep -Fq 'RKNN_BOARD_NODE_UNAVAILABLE' app.py
          grep -Fq 'required_capabilities=("agent.remote",)' app.py
          grep -Fq 'stage_rknn_board_validation' app.py
          grep -Fq 'v39_rknn_hardware_acceptance_report' app.py
          grep -Fq 'rknn_runtime_hardware' app.py
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check


  real-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock
          boto3 oss2 cryptography pydantic
      - name: Install frontend dependencies
        run: npm ci
      - name: RKNN board verification product flow
        run: npx playwright test tests/browser/model-and-conversion.spec.mjs --grep "RKNN converted_unverified job exposes board verification"
      - name: Product UI guards
        shell: bash
        run: |
          grep -Fq 'openRknnHardwareVerify' static/app.js
          grep -Fq '/hardware-tests' static/app.js
          grep -Fq '/hardware-tests/preflight' static/app.js
          grep -Fq 'v39_rknn_hardware_test_preflight' app.py
          grep -Fq '实机已验证' static/app.js
          grep -Fq 'openRknnAcceptanceReport' static/app.js
          grep -Fq '验收报告' tests/browser/model-and-conversion.spec.mjs
          grep -Fq '板端验证' tests/browser/model-and-conversion.spec.mjs
          grep -Fq '验收条件已满足' tests/browser/model-and-conversion.spec.mjs
          grep -Fq 'data-rknn-verify-live' static/app.js
          grep -Fq 'data-rknn-verify-bar' static/app.js
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
