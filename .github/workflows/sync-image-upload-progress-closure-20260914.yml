name: Sync Image Upload Progress Closure 20260914

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - .github/workflows/sync-image-upload-progress-closure-20260914.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-runtime-stabilization
          fetch-depth: 1
      - name: Sync four authority docs
        run: |
          python - <<'PY'
          from pathlib import Path

          accepted = 'bae90eae4b3768d365d20344c1f2db9a75795ac8'
          release_run = '34788383779'
          navigation_run = '34788383742'
          frontend_run = '34788383772'
          red_commit = '03be0050644af80709bddb97321f1a4ec0b1528c'
          red_run = '34788264443'
          migration_run = '34788320142'
          product_commit = '259d76d753993f2dd10e1963ee1a9a13887209ad'

          closure = f'''## Product closure — Plain image upload whole-task progress truth CLOSED

The final live ordinary-image upload owner is the storage61 `doUploadImages426` path posting to `/api/projects/{{project_id}}/images`. The endpoint is synchronous HTTP, but after browser request bytes are sent the server still performs temporary-file handling, image validation, selected-storage object write, SHA256 calculation and material record commit. Therefore browser `xhr.upload` byte completion is not whole-task completion.

Closed semantics:

```text
browser byte transfer: 0% -> 85%
byte transfer complete: hold at 85%, show “文件已上传，正在服务器入库”
server-side synchronous commit: no fabricated percentage animation
successful HTTP completion after material commit: 100%, show “服务器入库完成”
network/non-2xx failure: never claims terminal 100%
```

This batch deliberately does **not** invent a durable background task, fake queue, or fake server progress for a synchronous endpoint. Terminal 100% is simply fenced to the authoritative successful HTTP completion. Permanent behavior guard: `tests/frontend/image-upload-overall-progress.test.mjs`; Release Regression now includes that test in its permanent path scope.

Evidence:

```text
valid RED commit:          {red_commit}
valid RED run:             {red_run} (237 existing tests PASS; 2 intended new assertions RED)
focused migration/GREEN:   {migration_run} PASS
product commit:            {product_commit}
accepted clean code point: {accepted}
Release Regression:        {release_run} PASS
Navigation Action Fencing: {navigation_run} PASS (Real Chrome PASS)
Frontend Runtime:          {frontend_run} PASS (unit + full Real Chrome PASS)
formal VERSION.txt:        42.24.0 unchanged
```

The one-shot product migration workflow was removed in the product commit. No merge to `main`, tag, release, A800 RC, or genuine 10k ZIP acceptance was performed.

'''

          tech = Path('docs/TECH_DEBT_CLOSURE_V42_25.md')
          text = tech.read_text(encoding='utf-8')
          if 'Plain image upload whole-task progress truth CLOSED' not in text:
              marker = '## 0. 接手入口\n'
              text = text.replace(marker, closure + marker, 1)
          text = text.replace('> **更新日期：2026-09-13**', '> **更新日期：2026-09-14**')
          old = '> **最近完整代码验收点：`60305921402204e77b8e7ed4ec8e576d9f857c4b`**'
          text = text.replace(old, f'> **最近完整代码验收点：`{accepted}`**')
          next_old = '**Current next product scope: genuine 10,000-image processing-phase acceptance. P2c is CLOSED; P2d is not opened because the post-P2c profiler no longer shows duplicate per-image fan-out. Create P2d only if the 10k acceptance or a new profiler proves another structural hotspot.**'
          next_new = '**Current next product scope: horizontal audit of real queue-position/progress truth across AI annotation, video, cleaning, storage import and deployment-test surfaces. Genuine 10,000-image processing acceptance remains DEFERRED by explicit user instruction.**'
          text = text.replace(next_old, next_new)
          tech.write_text(text, encoding='utf-8')

          codex = Path('docs/CODEX_CURRENT_STATE.md')
          text = codex.read_text(encoding='utf-8')
          text = text.replace('latest full code acceptance: 233248847797023bc98bf0974490430139be3641', f'latest full code acceptance: {accepted}')
          text = text.replace('Frontend Runtime run:        34742373480', f'Frontend Runtime run:        {frontend_run}')
          if 'Plain image upload whole-task progress truth CLOSED' not in text:
              marker = '## 2. Current priority\n'
              text = text.replace(marker, closure + marker, 1)
          text = text.replace('→ NEXT: genuine 10,000-image processing-phase acceptance; P2d only if new profiler evidence proves another structural hotspot', '→ Plain image upload whole-task progress truth CLOSED\n→ NEXT: horizontal queue-position/progress truth audit across AI annotation, video, cleaning, storage import and deployment test\n→ genuine 10,000-image processing acceptance remains DEFERRED by explicit user instruction')
          text = text.replace(next_old, next_new)
          codex.write_text(text, encoding='utf-8')

          audit = Path('docs/frontend-legacy-audit.md')
          text = audit.read_text(encoding='utf-8')
          text = text.replace('commit:       60305921402204e77b8e7ed4ec8e576d9f857c4b', f'commit:       {accepted}')
          text = text.replace('run:          34733035739', f'run:          {frontend_run}')
          text = text.replace('Real Chrome:  PASS (33/33)', 'Real Chrome:  PASS')
          if 'Plain image upload whole-task progress truth CLOSED' not in text:
              marker = '## Product mainline checkpoint — ZIP 10k import scalability CLOSED\n'
              text = text.replace(marker, closure + marker, 1)
          text = text.replace(next_old, next_new)
          audit.write_text(text, encoding='utf-8')

          owner = Path('docs/FRONTEND_OWNER_MAP_V42_25.md')
          text = owner.read_text(encoding='utf-8')
          text = text.replace('> Latest fully accepted code point: `60305921402204e77b8e7ed4ec8e576d9f857c4b` / run `34733035739`', f'> Latest fully accepted code point: `{accepted}` / run `{frontend_run}`')
          text = text.replace('> Real Chrome: 33/33 passed', '> Real Chrome: PASS')
          if 'Plain image upload whole-task progress truth CLOSED' not in text:
              marker = '## 1. Purpose\n'
              text = text.replace(marker, closure + marker, 1)
          text = text.replace(next_old, next_new)
          owner.write_text(text, encoding='utf-8')

          for path in (tech, codex, audit, owner):
              body = path.read_text(encoding='utf-8')
              if accepted not in body or 'Plain image upload whole-task progress truth CLOSED' not in body:
                  raise SystemExit(f'authority sync incomplete: {path}')
          PY
      - name: Validate release boundary and docs diff
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --check
          git diff -- docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
      - name: Commit docs and self-delete workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-image-upload-progress-closure-20260914.yml
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          test "$(cat VERSION.txt)" = "42.24.0"
          git diff --cached --check
          git commit -m "docs(v42.25): close plain image upload progress truth"
          git push origin HEAD:refactor/frontend-runtime-stabilization
