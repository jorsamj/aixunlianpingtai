name: Optimize ZIP Processing P1

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/benchmark_zip_processing_p1.py
      - tools/optimize_zip_processing_p1.py
      - .github/workflows/optimize-zip-processing-p1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest httpx
      - name: Baseline 1000-image YOLO processing
        run: |
          python tools/benchmark_zip_processing_p1.py --images 1000 --json-out /tmp/p1-baseline.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/p1-baseline.json',encoding='utf-8'))
          assert value['report_imported_images']==1000, value
          assert value['report_boxes']==1000, value
          assert value['annotation_upsert_many']==2000, value
          assert value['get_project']>=1000, value
          assert value['material_patch']>=1000, value
          print('BASELINE_METRICS',json.dumps(value,sort_keys=True))
          PY
      - name: Apply processing P1 optimization
        run: python tools/optimize_zip_processing_p1.py
      - name: Syntax
        run: |
          python -m py_compile app.py platform_core/annotation_repository.py tests/api/test_zip_processing_p1.py
          git diff --check
      - name: Processing P1 permanent contracts
        run: python -m pytest -q tests/api/test_zip_processing_p1.py
      - name: Existing annotation/import/material regressions
        run: python -m pytest -q tests/api/test_annotation_flow.py tests/api/test_v19_import_scalability.py tests/api/test_material_batching.py tests/api/test_material_selection_atomicity.py
      - name: Post-change 1000-image YOLO processing
        run: |
          python tools/benchmark_zip_processing_p1.py --images 1000 --json-out /tmp/p1-after.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/p1-baseline.json',encoding='utf-8'))
          after=json.load(open('/tmp/p1-after.json',encoding='utf-8'))
          for key in ['report_imported_images','report_boxes','material_total','material_boxes','annotation_total','annotation_annotated']:
              assert after[key]==before[key], (key,before[key],after[key])
          assert after['annotation_upsert_many']==before['annotation_upsert_many']==2000, (before,after)
          assert after['get_project']<=3, after
          assert after['material_patch']==0, after
          assert after['get_project']*20 < before['get_project'], (before,after)
          assert max(1,after['material_patch'])*20 < before['material_patch'], (before,after)
          print('P1_BEFORE',json.dumps(before,sort_keys=True))
          print('P1_AFTER',json.dumps(after,sort_keys=True))
          speedup=(before['wall_seconds']/after['wall_seconds']) if after['wall_seconds'] else None
          print('P1_WALL_SPEEDUP',speedup)
          PY
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check
      - name: Commit validated processing P1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py platform_core/annotation_repository.py tests/api/test_zip_processing_p1.py
          git diff --cached --check
          git commit -m "perf(import): remove per-image ZIP processing amplification"
          git push origin HEAD:refactor/frontend-runtime-stabilization
