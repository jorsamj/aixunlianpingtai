name: Migrate Training AI Continuation Progress

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tests/unit/test_training_ai_continuation_progress.py
      - tools/migrate_training_ai_continuation_progress.py
      - .github/workflows/migrate-training-ai-continuation-progress.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest fastapi uvicorn httpx2 python-multipart pillow pyyaml requests \
            opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch
      - name: Prove old product is RED
        run: |
          set +e
          python -m pytest -q tests/unit/test_training_ai_continuation_progress.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Expected legacy AI continuation to fail cumulative realtime progress contracts.'
            exit 1
          fi
          echo "Baseline RED proven with exit code $code."
      - name: Apply precise migration
        run: |
          python tools/migrate_training_ai_continuation_progress.py
          grep -q 'attach_ai_continuation_callbacks' train_worker.py
          grep -q 'TRAINING_AI_CONTINUATION_PROGRESS_MIGRATED' tools/migrate_training_ai_continuation_progress.py
      - name: Syntax and diff checks
        run: |
          python -m py_compile train_worker.py
          git diff --check
      - name: Focused AI continuation GREEN
        run: >-
          python -m pytest -q
          tests/unit/test_training_ai_continuation_progress.py
          tests/unit/test_training_realtime_progress.py
          tests/unit/test_training_progress_v2.py
      - name: Training runtime regressions
        run: >-
          python -m pytest -q
          tests/integration/test_training_task_worker.py
          tests/api/test_training_unified_task_overlay.py
          tests/api/test_durable_training_controls.py
          tests/unit/task_runtime/test_progress_monotonicity.py
          tests/unit/task_runtime/test_fenced_progress_monotonicity.py
      - name: Formal version boundary
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit product migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add train_worker.py
          git diff --cached --check
          git commit -m 'fix(training): publish AI continuation progress'
          git push origin HEAD:refactor/frontend-runtime-stabilization
