name: Sync Navigation Action Fencing R2 Docs

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/sync_navigation_action_fencing_r2_docs.py
      - .github/workflows/sync-navigation-action-fencing-r2-docs.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize R2 handoff docs
        run: python tools/sync_navigation_action_fencing_r2_docs.py
      - name: Verify formal version unchanged
        run: test "$(cat VERSION.txt)" = "42.24.0"
      - name: Commit synchronized docs
        run: |
          if git diff --quiet -- docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md; then
            echo 'No documentation changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TECH_DEBT_CLOSURE_V42_25.md docs/CODEX_CURRENT_STATE.md docs/frontend-legacy-audit.md docs/FRONTEND_OWNER_MAP_V42_25.md
          git commit -m 'docs(v42.25): close Navigation Action Fencing R2 handoff'
          git push origin HEAD:refactor/frontend-runtime-stabilization
