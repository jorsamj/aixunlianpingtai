name: Bootstrap setPage Named Owner

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/bootstrap_setpage_named_owner_patch.py
      - .github/workflows/bootstrap-setpage-named-owner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply named navigation owner patch
        run: python tools/bootstrap_setpage_named_owner_patch.py
      - name: Verify focused navigation contracts
        run: |
          node --check static/modules/navigation-stability.js
          node --check static/main.mjs
          node --test tests/frontend/navigation-stability.test.mjs tests/frontend/navigation-persistence.test.mjs tests/frontend/ui-state.test.mjs tests/frontend/retired-sidebar-setpage-guard.test.mjs tests/frontend/retired-pre-v424-setpage-guard.test.mjs
          grep -Fq 'performNavigation' static/modules/navigation-stability.js
          grep -Fq 'performNavigation: page =>' static/main.mjs
          grep -Fq 'function setPage(p){state.page=p;render()} window.setPage=setPage;' static/app.js
          grep -Fq '/static/main.mjs?v=42.25.58' static/index.html
      - name: Commit named navigation owner
        run: |
          if git diff --quiet -- static/modules/navigation-stability.js static/main.mjs static/index.html tests/frontend/navigation-stability.test.mjs; then
            echo 'no named navigation owner changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/modules/navigation-stability.js static/main.mjs static/index.html tests/frontend/navigation-stability.test.mjs
          git commit -m 'refactor(ui): move actual page apply into navigation runtime'
          git push
