name: Connect Training Unified Task Truth

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/connect_training_to_unified_task_truth.py
      - .github/workflows/connect-training-unified-task-truth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply training unified task truth integration
        run: python tools/connect_training_to_unified_task_truth.py
      - name: Syntax
        run: |
          python -m py_compile app.py
          node --check static/modules/training-task-runtime.js
          node --check static/main.mjs
      - name: Focused frontend contract
        run: node --test tests/frontend/training-task-runtime.test.mjs
      - name: Install focused API dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn python-multipart pillow pyyaml requests opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2 pytest httpx
      - name: Training durable overlay contract
        run: python -m pytest -q tests/api/test_training_unified_task_overlay.py
      - name: Verify release boundary
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          grep -q '/static/main.mjs?v=42.25.91' static/index.html
          git diff --check
      - name: Commit validated training integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/modules/training-task-runtime.js static/main.mjs static/index.html tests/frontend/training-task-runtime.test.mjs tests/api/test_training_unified_task_overlay.py
          git diff --cached --check
          git commit -m "feat(tasks): expose durable queue truth in training UI"
          git push origin HEAD:refactor/frontend-runtime-stabilization
