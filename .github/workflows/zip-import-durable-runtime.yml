name: ZIP Import Durable Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
      - feature/external-algorithm-publishing
    paths:
      - 'app.py'
      - 'platform_core/zip_multipart.py'
      - 'platform_core/storage/import_tasks.py'
      - 'static/index.html'
      - 'static/main.mjs'
      - 'static/zip-import-bootstrap.mjs'
      - 'static/modules/zip-import-runtime.js'
      - 'static/modules/upload-task-center.js'
      - 'static/modules/storage-import-progress.js'
      - 'tests/unit/test_zip_multipart.py'
      - 'tests/frontend/zip-import-durable-runtime.test.mjs'
      - 'tests/frontend/zip-multipart-upload.test.mjs'
      - 'tests/frontend/upload-task-center.test.mjs'
      - 'tests/frontend/storage-import-progress.test.mjs'
      - 'tests/browser/zip-import-refresh-recovery.spec.mjs'
      - 'tests/api/test_v19_job_atomic_persistence.py'
      - 'tests/api/test_v19_import_scalability.py'
      - '.github/workflows/zip-import-durable-runtime.yml'

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: >-
          node --check static/modules/zip-import-runtime.js &&
          node --check static/modules/upload-task-center.js &&
          node --check static/modules/storage-import-progress.js &&
          node --check static/zip-import-bootstrap.mjs &&
          node --check tests/browser/zip-import-refresh-recovery.spec.mjs
      - name: Upload, refresh, queue and progress contracts
        run: >-
          node --test
          tests/frontend/zip-import-durable-runtime.test.mjs
          tests/frontend/zip-multipart-upload.test.mjs
          tests/frontend/upload-task-center.test.mjs
          tests/frontend/storage-import-progress.test.mjs
      - name: Permanent ZIP import guards
        shell: bash
        run: |
          grep -Fq '/import/uploads' static/modules/zip-import-runtime.js
          grep -Fq 'uploadZipMultipartJob' static/modules/zip-import-runtime.js
          grep -Fq 'concurrency=4' static/modules/zip-import-runtime.js
          grep -Fq 'retries=2' static/modules/zip-import-runtime.js
          grep -Fq "stage:'等待前序 ZIP 导入任务'" static/modules/zip-import-runtime.js
          grep -Fq "PollRegistryRuntime.startTimeout('zip-import-runtime'" static/modules/zip-import-runtime.js
          grep -Fq 'window.doUploadZip426=input=>upload(input)' static/modules/zip-import-runtime.js
          grep -Fq 'zip-import-bootstrap.mjs?v=422530' static/index.html
          grep -Fq 'zipImportRuntime = runtime' static/zip-import-bootstrap.mjs
          grep -Fq 'INDEX_BATCH_SIZE = 50' platform_core/storage/import_tasks.py
          grep -Fq 'UploadTaskCenterRuntime' static/modules/storage-import-progress.js
          test ! -e tools/_one_shot_upload_pipeline_v2.py
          test ! -e tools/_one_shot_upload_pipeline_v2_fix.py
          test ! -e tools/_one_shot_upload_pipeline_v2_postfix.py
          test ! -e .github/workflows/_one_shot_upload_pipeline_v2.yml
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check

  backend-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Multipart storage contract
        run: PYTHONPATH=. pytest -q --confcutdir=tests/unit tests/unit/test_zip_multipart.py
      - name: Durable v19 persistence and bounded 10k hot-state tests
        run: >-
          python -m pytest -q
          tests/api/test_v19_job_atomic_persistence.py
          tests/api/test_v19_import_scalability.py
      - name: Backend syntax and wiring guards
        shell: bash
        run: |
          python -m py_compile app.py platform_core/zip_multipart.py platform_core/storage/import_tasks.py
          grep -Fq 'class V19MultipartUploadReq' app.py
          grep -Fq 'ZipMultipartRepository' app.py
          grep -Fq '正在合并 ZIP 分片' app.py
          grep -Fq 'mapping_labels' platform_core/storage/import_tasks.py
          grep -Fq 'writing_annotations' platform_core/storage/import_tasks.py

  real-chrome-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome refresh recovery
        run: npx playwright test tests/browser/zip-import-refresh-recovery.spec.mjs
