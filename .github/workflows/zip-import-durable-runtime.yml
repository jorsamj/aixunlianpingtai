name: ZIP Import Durable Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
      - feature/external-algorithm-publishing
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'platform_core/secrets.py'
      - 'platform_core/zip_multipart.py'
      - 'platform_core/storage/import_tasks.py'
      - 'static/index.html'
      - 'static/main.mjs'
      - 'static/zip-import-bootstrap.mjs'
      - 'static/modules/zip-import-runtime.js'
      - 'static/modules/upload-task-center.js'
      - 'static/modules/storage-import-progress.js'
      - 'static/app.js'
      - 'static/styles.css'
      - 'tests/unit/test_secrets.py'
      - 'tests/unit/test_zip_multipart.py'
      - 'tests/frontend/zip-import-durable-runtime.test.mjs'
      - 'tests/frontend/zip-multipart-upload.test.mjs'
      - 'tests/frontend/upload-task-center.test.mjs'
      - 'tests/frontend/storage-import-progress.test.mjs'
      - 'tests/frontend/import-dock-style.test.mjs'
      - 'tests/browser/zip-import-refresh-recovery.spec.mjs'
      - 'tests/api/test_v19_job_atomic_persistence.py'
      - 'tests/api/test_v19_import_scalability.py'
      - 'tests/api/test_v19_import_report_externalization.py'
      - 'docs/PROJECT_HANDOFF_CURRENT.md'
      - 'docs/BUG_AUDIT_2026-09-17.md'
      - '.github/workflows/zip-import-durable-runtime.yml'

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: >-
          node --check static/modules/zip-import-runtime.js &&
          node --check static/modules/upload-task-center.js &&
          node --check static/modules/storage-import-progress.js &&
          node --check static/app.js &&
          node --check static/zip-import-bootstrap.mjs &&
          node --check tests/browser/zip-import-refresh-recovery.spec.mjs
      - name: Upload, refresh, queue and progress contracts
        run: >-
          node --test
          tests/frontend/zip-import-durable-runtime.test.mjs
          tests/frontend/zip-multipart-upload.test.mjs
          tests/frontend/upload-task-center.test.mjs
          tests/frontend/storage-import-progress.test.mjs
          tests/frontend/import-dock-style.test.mjs
      - name: Permanent ZIP import guards
        shell: bash
        run: |
          grep -Fq '/import/uploads' static/modules/zip-import-runtime.js
          grep -Fq 'uploadZipMultipartJob' static/modules/zip-import-runtime.js
          grep -Fq 'concurrency=4' static/modules/zip-import-runtime.js
          grep -Fq 'retries=2' static/modules/zip-import-runtime.js
          grep -Fq 'zipFingerprint' static/modules/zip-import-runtime.js
          grep -Fq 'overallZipProgress' static/modules/zip-import-runtime.js
          grep -Fq "stage:'等待前序 ZIP 导入任务'" static/modules/zip-import-runtime.js
          grep -Fq "PollRegistryRuntime.startTimeout('zip-import-runtime'" static/modules/zip-import-runtime.js
          grep -Fq 'window.doUploadZip426=input=>upload(input)' static/modules/zip-import-runtime.js
          grep -Fq 'zip-import-bootstrap.mjs?v=422536' static/index.html
          grep -Fq 'zipImportRuntime = runtime' static/zip-import-bootstrap.mjs
          grep -Fq 'const durableUploadFromImportModal = () =>' static/zip-import-bootstrap.mjs
          grep -Fq 'window.doImportUploadV19 = durableUploadFromImportModal' static/zip-import-bootstrap.mjs
          grep -Fq "zip-import-runtime.js?v=422536" static/zip-import-bootstrap.mjs
          grep -Fq "if(classicImportData)return classicImportData()" static/modules/zip-import-runtime.js
          grep -Fq "pollOwner" static/modules/upload-task-center.js
          grep -Fq 'INDEX_BATCH_SIZE = 50' platform_core/storage/import_tasks.py
          grep -Fq 'UploadTaskCenterRuntime' static/modules/storage-import-progress.js
          grep -Fq 'resumeRequired' static/modules/upload-task-center.js
          grep -Fq 'z-index:900' static/modules/upload-task-center.js
          grep -Fq 'upload task center stays below modal interaction layer' tests/frontend/import-dock-style.test.mjs
          if grep -Fq 'setInterval(switchProject, 1500)' static/modules/upload-task-center.js; then echo "upload task center project switching must be navigation-owned" >&2; exit 1; fi
          grep -Fq 'uploadTaskCenterRuntime.switchProject?.()' static/main.mjs
          grep -Fq "upload-task-center.js?v=66008" static/main.mjs
          grep -Fq "main.mjs?v=42.25.162" static/index.html
          grep -Fq "method:'DELETE'" static/modules/upload-task-center.js
          grep -Fq '>清空已结束</button>' static/modules/upload-task-center.js
          grep -Fq '已清空 ${cleared} 条已结束任务' static/modules/upload-task-center.js
          grep -Fq 'task center labels terminal cleanup as clear ended, not clear completed' tests/frontend/upload-task-center.test.mjs
          grep -Fq 'window.ZipImportRuntime?.forgetTerminal?.()' static/modules/upload-task-center.js
          grep -Fq 'function forgetTerminal()' static/modules/zip-import-runtime.js
          grep -Fq 'knownJobs.delete(id)' static/modules/zip-import-runtime.js
          grep -Fq 'DEFAULT_TTL_SECONDS = 24 * 60 * 60' platform_core/zip_multipart.py
          grep -Fq 'cleanup_expired_if_due' platform_core/zip_multipart.py
          grep -Fq 'cleanup_expired_if_due(interval_seconds=60)' app.py
          grep -Fq '@app.delete("/api/v19/projects/{project_id}/import/jobs")' app.py
          grep -Fq 'window.clearFinishedImportJobs=async' static/app.js
          grep -Fq '>清空已结束</button>' static/app.js
          grep -Fq 'released_bytes' platform_core/zip_multipart.py
          grep -Fq 'MC_SECRET_MASTER_KEY' platform_core/secrets.py
          grep -Fq 'EncryptedFileSecretStore' platform_core/secrets.py
          grep -Fq 'MC_CHANGLIAN_ACCESS_KEY' platform_core/secrets.py
          grep -Fq 'cryptography>=' requirements.txt
          grep -Fq 'CLOSED — Headless Linux Secret 持久化' docs/PROJECT_HANDOFF_CURRENT.md
          grep -Fq 'CLOSED — Multipart session TTL / GC' docs/PROJECT_HANDOFF_CURRENT.md
          grep -Fq 'CLOSED-04 — Headless Linux 新畅联 Secret 安全持久化' docs/BUG_AUDIT_2026-09-17.md
          grep -Fq 'CLOSED-05 — Multipart session TTL / GC' docs/BUG_AUDIT_2026-09-17.md
          test ! -e tools/_one_shot_upload_pipeline_v2.py
          test ! -e tools/_one_shot_upload_pipeline_v2_fix.py
          test ! -e tools/_one_shot_upload_pipeline_v2_postfix.py
          test ! -e .github/workflows/_one_shot_upload_pipeline_v2.yml
          test ! -e tools/_one_shot_secret_gc_ui.py
          test ! -e .github/workflows/_one_shot_secret_gc_ui.yml
          test ! -e tools/_one_shot_secret_gc_docs.py
          test ! -e .github/workflows/_one_shot_secret_gc_docs.yml
          test "$(tr -d '\r\n' < VERSION.txt)" = "42.24.0"
          git diff --check

  backend-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi httpx python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring cryptography filelock boto3 oss2
      - name: Secret store and multipart storage contracts
        run: >-
          PYTHONPATH=. pytest -q --confcutdir=tests/unit
          tests/unit/test_secrets.py
          tests/unit/test_zip_multipart.py
      - name: Durable v19 persistence and bounded 10k hot-state tests
        run: >-
          python -m pytest -q
          tests/api/test_v19_job_atomic_persistence.py
          tests/api/test_v19_import_scalability.py
          tests/api/test_v19_import_report_externalization.py
      - name: Backend syntax and wiring guards
        shell: bash
        run: |
          python -m py_compile app.py platform_core/secrets.py platform_core/zip_multipart.py platform_core/storage/import_tasks.py
          grep -Fq 'class V19MultipartUploadReq' app.py
          grep -Fq 'ZipMultipartRepository' app.py
          grep -Fq '正在合并 ZIP 分片' app.py
          grep -Fq 'cleanup_expired_if_due(interval_seconds=60)' app.py
          grep -Fq 'mapping_labels' platform_core/storage/import_tasks.py
          grep -Fq 'writing_annotations' platform_core/storage/import_tasks.py
          grep -Fq 'SECRET_STORE_UNAVAILABLE' platform_core/secrets.py
          grep -Fq 'encrypted_file' platform_core/secrets.py
          grep -Fq 'expires_at' platform_core/zip_multipart.py

  real-chrome-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring cryptography filelock boto3 oss2
      - name: Install frontend dependencies
        run: npm ci
      - name: Real Chrome refresh recovery
        run: npx playwright test tests/browser/zip-import-refresh-recovery.spec.mjs
