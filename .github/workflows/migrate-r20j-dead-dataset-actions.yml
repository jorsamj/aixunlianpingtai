name: Migrate R20j Dead Dataset Actions

on:
  push:
    branches:
      - refactor/frontend-runtime-stabilization
    paths:
      - tools/migrate_r20j_dead_dataset_actions.py
      - .github/workflows/migrate-r20j-dead-dataset-actions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded R20j migration
        run: python tools/migrate_r20j_dead_dataset_actions.py
      - name: Verify formal version unchanged
        run: |
          test "$(cat VERSION.txt)" = "42.24.0"
          grep -Fq 'app.js?v=42.25.86' static/index.html
      - name: Install frontend dependencies
        run: npm ci
      - name: Syntax check
        run: node --check static/app.js
      - name: Run all frontend unit tests
        run: node --test tests/frontend/*.test.mjs
      - name: Install backend browser-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi uvicorn python-multipart pillow pyyaml requests
          opencv-python-headless onnx onnxruntime onnxslim psutil keyring filelock boto3 oss2
      - name: Focused Real Chrome dataset regressions
        run: >-
          npx playwright test
          tests/browser/material-pagination-performance.spec.mjs
          tests/browser/navigation-stability.spec.mjs
      - name: Verify retired actions absent and live import preserved
        run: |
          for token in \
            'window.uploadImages=' \
            'window.autoSplit=' \
            'window.buildYolo=' \
            'window.checkDatasetQuality=' \
            'window.setImageSplit='; do
            if grep -F -n "$token" static/app.js; then
              echo "retired dataset action was reintroduced: $token" >&2
              exit 1
            fi
          done
          grep -Fq 'window.doImportData=' static/app.js
          grep -Fq "if(state.page==='数据集'){renderDatasets424();return}" static/app.js
      - name: Commit product migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/index.html tests/frontend/legacy-dataset-action-shell.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-status
          git commit -m 'refactor(ui): retire zero-reference dataset actions'
          git push
